<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e9d8">
<meta name="description" content="Drop things into Gulp the jar. Same size things fuse into something new. Can you make something nobody in the world has made?">
<meta property="og:title" content="Merge Anything">
<meta property="og:description" content="Drop things into Gulp the jar. Same size things fuse into something new. Can you make something nobody in the world has made?">

<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<body>
<title>Merge Anything</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* One 9:16 canvas, centered and letterboxed. A single warm "paper and stickers" look by choice. */
  :root { --bg: #f3e9d8; --fg: #2b2233; color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; -webkit-tap-highlight-color: transparent; }
  /* Discoveries book: a full-screen, scrollable page over the game. */
  .book {
    position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; font-family: Fredoka, ui-rounded, system-ui, sans-serif;
    padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(12px, env(safe-area-inset-bottom, 0px));
  }
  .book-head { display: flex; align-items: center; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; padding: 4px 0 10px; }
  .book-head h2 { margin: 0; font-size: 26px; font-weight: 700; flex: 1; }
  .book-count { font-size: 15px; font-weight: 500; opacity: 0.7; display: block; }
  .book-close {
    min-width: 48px; height: 48px; border-radius: 24px; border: 4px solid var(--fg); background: #fff;
    font: 700 22px Fredoka, system-ui, sans-serif; color: var(--fg); cursor: pointer;
  }
  .book-close:focus-visible { outline: 3px solid #ff4f7b; outline-offset: 2px; }
  .book-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; max-width: 560px; width: 100%; margin: 0 auto; padding-bottom: 24px; }
  .book-level { margin: 14px 0 8px; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .book-dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--fg); display: inline-flex;
    align-items: center; justify-content: center; font-size: 12px; }
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .book-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .book-ball { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--fg);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .book-item.missing .book-ball { background: rgba(43,34,51,0.08) !important; border-color: rgba(43,34,51,0.25);
    color: rgba(43,34,51,0.35); font: 700 24px Fredoka, system-ui, sans-serif; }
  .book-name { font-size: 13px; font-weight: 500; line-height: 1.15; }
  .book-item.missing .book-name { opacity: 0.45; }
  [hidden] { display: none !important; }
</style>

<div id="book" class="book" hidden role="dialog" aria-modal="true" aria-labelledby="book-title">
  <div class="book-head">
    <h2 id="book-title">Discoveries <span id="book-count" class="book-count"></span></h2>
    <button id="book-close" class="book-close" type="button" aria-label="Close">✕</button>
  </div>
  <div id="book-body" class="book-body"></div>
</div>

<canvas id="game" aria-label="Merge Anything. Tap to drop things into the jar. Two things of the same size fuse into something new."></canvas>

<script>

      ['Steam', 'Steam', 'Ramen', '🍜'], ['Steam', 'Plant', 'Tea', '🍵'], ['Steam', 'Cloud', 'Ghost', '👻'],
      ['Steam', 'Volcano', 'Hot Tub', '🛁'], ['Steam', 'Lightning', 'Robot', '🤖'], ['Steam', 'Desert', 'Genie', '🧞'],
      ['Plant', 'Plant', 'Tree', '🌳'], ['Plant', 'Cloud', 'Cotton Candy', '🍭'], ['Plant', 'Volcano', 'Chili Pepper', '🌶️'],
      ['Plant', 'Lightning', 'Broccoli', '🥦'], ['Plant', 'Desert', 'Tumbleweed', '🌾'],
      ['Cloud', 'Cloud', 'Sheep', '🐑'], ['Cloud', 'Volcano', 'Factory', '🏭'], ['Cloud', 'Lightning', 'WiFi', '📶'],
      ['Cloud', 'Desert', 'Mirage', '✨'],
      ['Volcano', 'Volcano', 'Dragon', '🐉'], ['Volcano', 'Lightning', 'Dynamite', '🧨'], ['Volcano', 'Desert', 'Scorpion', '🦂'],
      ['Lightning', 'Lightning', 'Light Bulb', '💡'], ['Lightning', 'Desert', 'Magic Glass', '🔮'],
      ['Desert', 'Desert', 'Fossil', '🦴'],
    ],
  };
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  const comboKey = (t, a, b) => { const x = [norm(a), norm(b)].sort(); return t + '|' + x[0] + '+' + x[1]; };
  const BOOK = new Map();
  const POOL = { 1: BASE.slice(), 2: [], 3: [] };
  for (const t of [2, 3]) for (const [a, b, n, e] of BOOK_RAW[t]) {
    BOOK.set(comboKey(t, a, b), { n, e });
    POOL[t].push({ n, e });
  }

  // =====================================================================
  // Canvas and scaling
  // =====================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, dpr = 1;
  const sprites = new Map();          // cached item drawings
  function resize() {
    const vw = document.body.clientWidth, vh = document.body.clientHeight;
    scale = Math.min(vw / W, vh / H);
    dpr = Math.min(window.devicePixelRatio || 1, 1080 / (W * scale));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    sprites.clear();
  }
  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('700 20px Fredoka'), document.fonts.load('500 20px Fredoka')])
      .then(() => sprites.clear()).catch(() => {});
  }

  // =====================================================================
  // Saved data (may be unavailable: private mode, previews)
  // =====================================================================
  function loadJSON(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
  function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  let best = loadJSON('merge_best', 0);
  let daily = loadJSON('merge_daily', { day: 0, best: 0, tries: 0, level: 0 });   // today's challenge
  let worldFirsts = loadJSON('merge_firsts', 0);
  let wins = loadJSON('merge_wins', 0);           // times the player made a level 10 thing

  // =====================================================================
  // Helpers
  // =====================================================================
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const points = t => t * (t + 1) / 2;
  // Daily challenge: the same things fall in the same order for every player in the world today.
  function seeded(seed) {   // small, well-known random generator (mulberry32)
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const dayNumber = () => Math.floor((Date.now() - Date.UTC(2026, 10, 1)) / 86400000) + 1;   // #1 = 1 Nov 2026 (UTC)
  let mode = 'normal', rng = Math.random, dailyNo = dayNumber();
  function pickDrop() {
    let r = rng(), t = 1;
    while (t < DROP_ODDS.length - 1 && r >= DROP_ODDS[t]) { r -= DROP_ODDS[t]; t++; }
    const p = POOL[t];
    return { t, item: p[Math.floor(rng() * p.length)] };
  }

  // =====================================================================
  // What do two things make? Levels 2-3 use the hand-written book above.
  // Level 4-10: each level has a fixed set of things (the WORLD below). Every thing has
  // a few "ingredients" (tags). Two things fuse into the thing of the next level that
  // shares the most ingredients with both of them. Same pair = same result for everyone,
  // works offline, costs nothing, no server or AI needed.
  // =====================================================================
  const TAGS = {
    'Water': 'water', 'Fire': 'fire hot', 'Earth': 'earth', 'Wind': 'air sky',
    'Ocean': 'water animal', 'Sun': 'fire hot sky space', 'Mountain': 'earth cold', 'Tornado': 'air sky',
    'Steam': 'water hot air', 'Plant': 'plant life earth', 'Cloud': 'sky water air', 'Volcano': 'fire earth hot',
    'Lightning': 'fire sky tech', 'Desert': 'earth hot',
    'Whale': 'water animal', 'Beach': 'water fun hot', 'Island': 'water earth', 'Hurricane': 'water air sky',
    'Spa Day': 'water hot fun', 'Sea Turtle': 'water animal life', 'Rain': 'water sky', 'Kraken': 'water monster',
    'Thunder Shark': 'water animal monster', 'Oasis': 'water plant hot', 'Supernova': 'space fire',
    'Sunrise': 'sky hot', 'Heatwave': 'hot air', 'Coffee': 'food hot', 'Sunflower': 'plant life',
    'Rainbow': 'sky magic fun', 'Dinosaur': 'animal monster', 'Battery': 'tech', 'Cactus': 'plant hot',
    'Snowy Peak': 'earth cold', 'Eagle': 'animal sky', 'Steam Train': 'tech hot', 'Forest': 'plant life',
    'Snow': 'cold water', 'Diamond': 'earth magic', 'Wizard': 'magic', 'Camel': 'animal hot',
    'Flying Cow': 'animal air fun', 'Helicopter': 'tech air', 'Autumn': 'plant air', 'Storm': 'sky water',
    'Meteor': 'space fire', 'Superhero': 'fun sky', 'Sandstorm': 'air earth', 'Ramen': 'food hot',
    'Tea': 'food plant', 'Ghost': 'magic monster', 'Hot Tub': 'water hot fun', 'Robot': 'tech',
    'Genie': 'magic air', 'Tree': 'plant life', 'Cotton Candy': 'food fun', 'Chili Pepper': 'food hot',
    'Broccoli': 'food plant', 'Tumbleweed': 'plant air', 'Sheep': 'animal cold', 'Factory': 'tech earth',
    'WiFi': 'tech sky', 'Mirage': 'magic hot', 'Dragon': 'monster fire magic', 'Dynamite': 'fire tech',
    'Scorpion': 'animal hot', 'Light Bulb': 'tech fire', 'Magic Glass': 'magic earth', 'Fossil': 'earth animal',
  };
  const WORLD = {
    4: [
      ['Pirate Ship', '⛵', 'water fun tech'], ['Snowman', '⛄', 'cold fun'], ['Lava Pizza', '🍕', 'food hot fire'],
      ['Mermaid', '🧜', 'water magic life'], ['Unicorn', '🦄', 'magic animal fun'], ['Rocket', '🚀', 'space tech fire'],
      ['Haunted House', '🏚️', 'monster magic earth'], ['Ice Cream', '🍦', 'food cold fun'], ['Popcorn', '🍿', 'food hot fun'],
      ['Treehouse', '🏡', 'plant fun earth'], ['Cyborg Cat', '🐱', 'tech animal'], ['Storm Chaser', '🌩️', 'sky air tech'],
      ['Sushi', '🍣', 'food water animal'], ['Dragon Egg', '🥚', 'monster fire life'], ['Cloud Castle', '🏰', 'sky magic air'],
      ['Dance Party', '💃', 'fun hot'], ['Sand Castle', '🏯', 'earth fun water'], ['Space Cow', '🐮', 'space animal fun'],
      ['Zombie Plant', '🧟', 'plant monster'], ['Jet Pack', '🎒', 'tech air fire'], ['Hot Cocoa', '🍫', 'food hot cold'],
      ['Lava Lamp', '🏮', 'fire fun tech'], ['Garden Gnome', '🍄', 'plant magic earth'], ['Penguin', '🐧', 'animal cold water'],
      ['Frog Prince', '🐸', 'animal water magic'], ['Panda', '🐼', 'animal plant life'], ['Toaster Bot', '🍞', 'food tech fun'],
      ['Cyber Cactus', '🌵', 'plant tech hot'], ['Magic Computer', '💻', 'tech magic'], ['Water Lily', '🌸', 'water plant life'],

      ['Flying Fish', '🐟', 'water sky animal'], ['Soup', '🍲', 'water hot food'], ['Space Octopus', '🐙', 'water space animal'],

    ],
    5: [
      ['Ghost Ship', '👻', 'water monster magic'], ['Ice Dragon', '🐲', 'monster cold magic'], ['Pizza Planet', '🍕', 'food space fun'],
      ['Robot Chef', '🤖', 'tech food'], ['Rainbow Unicorn', '🦄', 'magic fun sky'], ['Moon Base', '🌕', 'space tech'],
      ['Jungle', '🐒', 'plant animal life hot'], ['Ice Castle', '🏰', 'cold magic'], ['Thunderbird', '🦅', 'sky animal fire'],
      ['Candy Kingdom', '🍭', 'food fun magic'], ['Deep Sea City', '🐙', 'water tech'], ['Phoenix', '🐦', 'fire animal magic life'],
      ['Monster Truck', '🚚', 'monster tech fun'], ['Sky Whale', '🐋', 'sky animal water'], ['Mushroom Village', '🍄', 'plant magic earth'],

    6: [
      ['Kraken King', '🦑', 'water monster'], ['Volcano Dragon', '🐉', 'fire monster earth'], ['Flying Island', '🏝️', 'sky earth magic'],
      ['Robot Army', '🤖', 'tech monster'], ['Space Station', '🛰️', 'space tech'], ['Fairy Forest', '🧚', 'plant magic life'],
      ['Chocolate Factory', '🍫', 'food tech fun'], ['Frozen Kingdom', '❄️', 'cold magic earth'], ['Storm Giant', '⛈️', 'sky air monster'],
      ['Ocean Palace', '🐚', 'water magic fun'], ['Dino Park', '🦕', 'animal life fun'], ['Sun Temple', '🌞', 'hot fire magic sky'],
      ['Galaxy Cat', '🐈', 'space animal fun'], ['Giant Burger', '🍔', 'food fun hot'], ['Vampire Castle', '🦇', 'monster magic cold'],
      ['Rainforest', '🌳', 'plant water life hot'], ['Robot Garden', '🌻', 'tech plant life'],
    ],
    7: [
      ['Mecha Dragon', '🐉', 'tech monster fire'], ['Atlantis', '🔱', 'water magic earth'], ['Sky Kingdom', '🏰', 'sky magic air'],
      ['Moon Party', '🌙', 'space fun'], ['Candy Planet', '🍬', 'food space fun'], ['Ice Age', '🧊', 'cold earth animal'],
      ['World Tree', '🌳', 'plant life magic'], ['Lava World', '🌋', 'fire hot earth'], ['Robot City', '🏙️', 'tech earth fun'],
      ['Monster Zoo', '🦖', 'monster animal fun'], ['Storm Titan', '🌪️', 'air sky monster'], ['Ocean Kingdom', '🐳', 'water animal life'],

    ],
    8: [
      ['Dragon Empire', '🐲', 'monster fire magic'], ['Underwater Galaxy', '🌌', 'water space'], ['Robot Planet', '🤖', 'tech space earth'],

    ],
    9: [
      ['Black Hole', '🕳️', 'space monster'], ['Dream World', '💭', 'magic fun sky air'], ['Ocean Planet', '🌊', 'water life space'],
      ['Sun Dragon', '☀️', 'fire monster sky hot'], ['Mega Robot', '🦾', 'tech monster'], ['Frozen Galaxy', '🌌', 'cold space'],
      ['Garden Of Life', '🌺', 'plant life earth'], ['Party Universe', '🎆', 'fun food space'],
    ],
    10: [
      ['New Universe', '🌌', 'space magic life'], ['Dragon Of Everything', '🐉', 'monster fire magic'],
      ['Endless Ocean', '🌊', 'water life cold'], ['Robot Overlord', '🤖', 'tech monster earth'],
      ['Forever Party', '🥳', 'fun food sky'], ['Mother Nature', '🌍', 'plant earth life air'],
    ],
  };
  const tagsOf = new Map();
  for (const [n, tg] of Object.entries(TAGS)) tagsOf.set(norm(n), tg.split(' '));
  for (const t in WORLD) for (const [n, , tg] of WORLD[t]) tagsOf.set(norm(n), tg.split(' '));
  // How many different things exist in the whole game (the collection goal).
  const TOTAL_THINGS = BASE.length + BOOK_RAW[2].length + BOOK_RAW[3].length +
    Object.values(WORLD).reduce((s, l) => s + l.length, 0);
  const book = loadJSON('merge_book', {});         // things this player has made: "t|name" -> {n,e,t}

  // The full list for the book, level by level.
  const ALL_THINGS = [];
  for (const it of BASE) ALL_THINGS.push({ t: 1, n: it.n, e: it.e });
  for (const t of [2, 3]) for (const [, , n, e] of BOOK_RAW[t]) ALL_THINGS.push({ t, n, e });
  for (const t in WORLD) for (const [n, e] of WORLD[t]) ALL_THINGS.push({ t: +t, n, e });
  const isFound = th => th.t === 1 || !!book[th.t + '|' + norm(th.n)];
  const discoveredCount = () => ALL_THINGS.reduce((c, th) => c + (isFound(th) ? 1 : 0), 0);

  function fuseResult(a, b, t) {
    const key = comboKey(t, a.n, b.n);
    if (BOOK.has(key)) return BOOK.get(key);
    const A = tagsOf.get(norm(a.n)) || [], B = tagsOf.get(norm(b.n)) || [];
    const all = new Set([...A, ...B]);
    let best = null, bestScore = -1e9;
    for (const [n, e, tg] of WORLD[t] || []) {
      const C = tg.split(' ');
      const fromA = C.some(x => A.includes(x)), fromB = C.some(x => B.includes(x));

      // Must come from both parents if possible, share as much as possible, and add little that is foreign.
      const score = (fromA ? 3 : 0) + (fromB ? 3 : 0) + shared * 2 - (C.length - shared) * 1.5
        + (C.includes(A[0]) ? 2 : 0) + (C.includes(B[0]) ? 2 : 0)   // first ingredient = what the thing mainly is
        + (hash(key + '|' + n) % 1000) / 2000;     // fixed tie-break, same for every player
      if (score > bestScore) { bestScore = score; best = { n, e }; }
    }
    return best || { n: a.n, e: a.e };
  }
  function askCombo(a, b, t) { return Promise.resolve(Object.assign({ first: false }, fuseResult(a, b, t))); }

  // =====================================================================
  // Sound (all synthesized)
  // =====================================================================
  const Sound = (() => {
    let ac = null, master = null, noise = null;
    let muted = loadJSON('merge_muted', 0) === 1;
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { return; }
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.8;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -10; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.15;
      master.connect(comp); comp.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    function env(g, t, peak, a, d) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function tone(freq, when, dur, vol, type = 'sine', slideTo = 0) {
      if (!ac) return;
      const t = ac.currentTime + when;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = ac.createGain(); env(g, t, vol, 0.006, dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    // Rising musical scale: every bigger merge sings a higher note.
    const SCALE = [0, 262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047];
    const drop = () => tone(240, 0, 0.09, 0.12, 'triangle', 150);
    function merge(t) {
      const f = SCALE[Math.min(t, 11)];
      tone(f * 0.75, 0, 0.12, 0.2, 'sine', f * 1.5);          // bubbly "bloop"
      tone(f, 0.05, 0.22, 0.16, 'triangle');
    }
    function reveal() { tone(1568, 0, 0.18, 0.07); tone(2093, 0.06, 0.22, 0.05); }
    function discovery() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.07, 0.25, 0.12, 'triangle')); }
    function worldFirst() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, i === 4 ? 0.9 : 0.2, 0.2, 'triangle'));
      tone(2093, 0.45, 0.8, 0.06);
    }
    const tick = () => tone(1200, 0, 0.05, 0.07, 'square');
    // Gulp's signature sound: a long, wobbly cartoon BURP.
    function burp() {
      if (!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(110, t);
      o.frequency.linearRampToValueAtTime(82, t + 0.5);
      o.frequency.linearRampToValueAtTime(62, t + 1.0);
      const am = ac.createGain(); am.gain.value = 0.6;
      const lfo = ac.createOscillator(); lfo.frequency.value = 23;
      const lg = ac.createGain(); lg.gain.value = 0.4;
      lfo.connect(lg); lg.connect(am.gain);
      const out = ac.createGain();
      [[420, 5, 1], [900, 7, 0.5], [2300, 9, 0.12]].forEach(([fq, q, v]) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = q;
        const vg = ac.createGain(); vg.gain.value = v;
        am.connect(bp); bp.connect(vg); vg.connect(out);
      });
      o.connect(am);
      const g = ac.createGain(); out.connect(g); g.connect(master);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(2.2, t + 0.05);
      g.gain.setValueAtTime(2.2, t + 0.75);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.start(t); lfo.start(t); o.stop(t + 1.2); lfo.stop(t + 1.2);
    }
    function vanish() { [262, 330, 392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.05, 1.2, 0.12, 'triangle')); }
    function toggleMute() {
      muted = !muted; saveJSON('merge_muted', muted ? 1 : 0);
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
    }
    document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else ac.resume(); } });
    return { init, drop, merge, reveal, discovery, worldFirst, tick, burp, vanish, toggleMute, isMuted: () => muted };
  })();

  // =====================================================================
  // Game state
  // =====================================================================
  let bodies = [], particles = [], popups = [];
  let state, score, roundMade, roundFirsts, bestMade, held, next, readyAt, aimX, lastRecipe, banner, shake;
  let roundTop = 1, wasBest = false, wasDailyBest = false;
  let overAt = 0, firstDrop = true, idCounter = 0, warnT = 0, nextTick = 0, clock = 0;
  const gulp = { look: { x: W / 2, y: 600 }, blinkAt: 2, blink: 0, wob: 0, wobV: 0, wow: 0 };

  function newGame(m = mode) {
    mode = m;
    dailyNo = dayNumber();
    rng = mode === 'daily' ? seeded(dailyNo * 7919 + 17) : Math.random;
    bodies = []; particles = []; popups = [];
    state = 'play'; score = 0; roundMade = 0; roundFirsts = 0; bestMade = null;
    held = pickDrop(); next = pickDrop(); readyAt = 0; aimX = W / 2;
    lastRecipe = null; banner = null; shake = 0; warnT = 0;
  }
  newGame();

  function makeBody(x, y, t, item) {
    return { id: ++idCounter, x, y, px: x, py: y, r: RADII[t], tr: RADII[t], t, item,
             parents: null, overT: 0, born: clock, wob: 0, wobV: 0, spin: rand(0, 6) };
  }

  function dropHeld() {
    if (state !== 'play' || !held || clock < readyAt) return;
    const r = RADII[held.t];
    const x = clamp(aimX, JAR_L + r + 1, JAR_R - r - 1);
    const b = makeBody(x, DROP_Y, held.t, held.item);
    b.wob = -0.25;
    bodies.push(b);
    gulp.wobV += 5;
    Sound.drop();
    firstDrop = false;
    held = null;
    readyAt = clock + DROP_COOLDOWN;
  }

  // Two same-size things touched: they fuse. The new thing appears at once as a "?" and
  // is filled in when the answer arrives (instant for known recipes).
  function fuse(a, b) {
    a.dead = b.dead = true;
    const t = a.t + 1;
    const mx = (a.x * a.r * a.r + b.x * b.r * b.r) / (a.r * a.r + b.r * b.r);
    const my = (a.y + b.y) / 2;
    burst(mx, my, TIER_COLOR[a.t], 10 + a.t * 2, 160 + a.t * 25);
    burst(mx, my, '#ffffff', 6 + a.t * 2, 140 + a.t * 25);
    if (a.t >= 7) shake = Math.max(shake, 4 + a.t);
    Sound.merge(t);
    score += points(t);
    popups.push({ x: mx, y: my - 20, text: '+' + points(t), t: 0, life: 0.9, size: 26 + a.t * 2, color: INK });

    if (a.t === MAX_TIER) {
      // Two of the biggest things: they explode into stardust for a huge bonus.
      score += 200;
      popups.push({ x: mx, y: my - 70, text: 'LEGENDARY +200', t: 0, life: 2, size: 40, color: '#ff4f7b' });
      burst(mx, my, '#ffe066', 60, 600); burst(mx, my, '#ff8fa3', 40, 500);
      shake = 18; Sound.vanish(); gulp.wow = 2;
      return;
    }
    const nb = makeBody(mx, my, t, null);
    nb.px = mx - ((a.x - a.px) + (b.x - b.px)) / 2;
    nb.py = my - ((a.y - a.py) + (b.y - b.py)) / 2;
    nb.r = Math.max(a.r, b.r);                     // grows smoothly to its new size
    nb.parents = [a.item, b.item];
    nb.wob = 0.35;
    bodies.push(nb);
    lastRecipe = { a: a.item, b: b.item, res: null, t };
    const recipe = lastRecipe;
    askCombo(a.item, b.item, t).then(res => {
      nb.item = { n: res.n, e: res.e };
      nb.wob = 0.4; nb.revealAt = clock;
      recipe.res = nb.item;
      onMade(nb, res);
    });
  }

  function onMade(b, res) {
    roundMade++;
    if (!bestMade || b.t > bestMade.t) bestMade = { n: b.item.n, e: b.item.e, t: b.t };
    const prevMax = maxTierCache;
    if (b.t > maxTierCache) { maxTierCache = b.t; saveJSON('merge_maxtier', b.t); }
    const k = b.t + '|' + norm(res.n);
    const isNew = !book[k];
    if (isNew) { book[k] = { n: res.n, e: res.e, t: b.t, first: !!res.first }; saveJSON('merge_book', book); }
    if (b.t === MAX_TIER) {
      wins++; saveJSON('merge_wins', wins);
      banner = { kind: 'win', item: b.item, t: 0, life: 4.5 };
      Sound.worldFirst(); gulp.wow = 3; shake = 12;
      confetti(W / 2, 170, 90); confetti(W / 2, 500, 60);
    } else if (b.t > prevMax && b.t >= 3) {
      banner = { kind: 'level', item: b.item, level: b.t, t: 0, life: 2.4 };
      Sound.worldFirst(); gulp.wow = 1.6;
      confetti(W / 2, 170, 40);
    } else if (res.first) {
      worldFirsts++; roundFirsts++; saveJSON('merge_firsts', worldFirsts);
      banner = { kind: 'world', item: b.item, t: 0, life: 3.2 };
      Sound.worldFirst(); gulp.wow = 2.2;
      confetti(W / 2, 170, 70);
    } else if (isNew && b.t >= 2) {
      banner = { kind: 'new', item: b.item, t: 0, life: 1.8 };
      Sound.discovery(); if (b.t >= 5) gulp.wow = 1.2;
    } else Sound.reveal();
    if (b.t >= 6) gulp.wow = Math.max(gulp.wow, 1.2);
  }

  function gameOver() {
    state = 'burp'; overAt = clock;
    Sound.burp(); shake = 16; gulp.wobV -= 30;
    roundTop = bestMade ? bestMade.t : 1;
    if (mode === 'daily') {
      if (daily.day !== dailyNo) daily = { day: dailyNo, best: 0, tries: 0, level: 0 };
      daily.tries++;
      wasDailyBest = score > daily.best;
      if (score > daily.best) { daily.best = score; daily.level = roundTop; }
      saveJSON('merge_daily', daily);
    } else {
      wasBest = score > best;
      if (score > best) { best = score; saveJSON('merge_best', best); }
    }
    // Gulp burps everything out of the jar.
    for (const b of bodies) {
      const vx = (b.x - W / 2) * rand(1.2, 2.6) + rand(-200, 200);
      const vy = -rand(1300, 2100) * (0.7 + 0.3 * (1 - b.y / H));
      b.px = b.x - vx * STEP; b.py = b.y - vy * STEP;
      b.spinV = rand(-8, 8);
    }
    burst(W / 2, JAR_TOP, '#ffffff', 40, 500);
  }

  // =====================================================================
  // Physics (simple circles, Verlet integration, several small steps per frame)
  // =====================================================================
  function physicsStep(dt) {
    const burping = state !== 'play';      // after the burp nothing fuses or scores any more
    const g = GRAVITY * dt * dt * (burping ? 0.55 : 1);
    for (const b of bodies) {
      const vx = (b.x - b.px) * 0.998, vy = (b.y - b.py) * 0.998;
      b.px = b.x; b.py = b.y;
      b.x += vx; b.y += vy + g;
      if (b.r < b.tr) b.r = Math.min(b.tr, b.r + (b.tr - b.r) * 0.12 + 0.3);
      if (burping) b.spin += (b.spinV || 0) * dt;
    }
    if (burping) return;          // flying out: no walls, no collisions
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < bodies.length; i++) {
        const a = bodies[i]; if (a.dead) continue;
        for (let j = i + 1; j < bodies.length; j++) {
          const b = bodies[j]; if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= min * min) continue;
          if (a.t === b.t && a.item && b.item && a.r >= a.tr - 0.5 && b.r >= b.tr - 0.5) { fuse(a, b); break; }
          const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d;
          const over = (min - d);
          const ma = a.r * a.r, mb = b.r * b.r, wa = mb / (ma + mb), wb = ma / (ma + mb);
          a.x -= nx * over * wa; a.y -= ny * over * wa;
          b.x += nx * over * wb; b.y += ny * over * wb;
        }
      }
      for (const b of bodies) {
        if (b.dead) continue;
        if (b.x - b.r < JAR_L) { b.x = JAR_L + b.r; b.px = b.x; }
        if (b.x + b.r > JAR_R) { b.x = JAR_R - b.r; b.px = b.x; }
        if (b.y + b.r > FLOOR) {
          b.y = FLOOR - b.r;
          b.px = b.x - (b.x - b.px) * 0.86;   // floor friction
          b.py = b.y;
        }
      }
      bodies = bodies.filter(b => !b.dead);
    }
  }

  // =====================================================================
  // Effects
  // =====================================================================
  function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(speed * 0.3, speed);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: rand(3, 7), color, t: 0, life: rand(0.35, 0.7), g: 700 });
    }
  }
  function confetti(x, y, n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x: x + rand(-120, 120), y, vx: rand(-300, 300), vy: rand(-650, -150), r: rand(4, 8),
        color: PALETTE[i % PALETTE.length], t: 0, life: rand(1.2, 2.2), g: 650, rect: true, rot: rand(0, 6), rv: rand(-10, 10) });
    }
  }

  // =====================================================================
  // Input: touch/aim, lift to drop. One finger, nothing else.
  // =====================================================================
  const MUTE = { x: W - 38, y: 40, r: 26 };
  const BOOK_HIT = { x: W - 62, y: 97, w: 110, h: 44 };
  const OVER_TOP = 330;
  const BTN_AGAIN = { x: W / 2, y: OVER_TOP + 455, w: 300, h: 64 };
  const BTN_LEFT = { x: W / 2 - 108, y: OVER_TOP + 535, w: 200, h: 54 };
  const BTN_RIGHT = { x: W / 2 + 108, y: OVER_TOP + 535, w: 200, h: 54 };
  const BTN_INTRO = { x: W / 2, y: 846, w: 340, h: 56 };
  const inBtn = (b, p) => Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2;
  let toast = { msg: '', until: 0 };
  const showToast = (msg, ms = 2400) => { toast = { msg, until: performance.now() + ms }; };

  // ---- Discoveries book ----
  const bookEl = document.getElementById('book');
  const bookOpen = () => !bookEl.hidden;
  function openBook() {
    const body = document.getElementById('book-body');
    body.textContent = '';
    document.getElementById('book-count').textContent = `${discoveredCount()} of ${TOTAL_THINGS} found`;
    for (let t = 1; t <= MAX_TIER; t++) {
      const list = ALL_THINGS.filter(th => th.t === t);
      const found = list.filter(isFound).length;
      const h = document.createElement('div'); h.className = 'book-level';
      const dot = document.createElement('span'); dot.className = 'book-dot'; dot.style.background = TIER_COLOR[t]; dot.textContent = t;
      h.append(dot, document.createTextNode(`Level ${t}  ·  ${found}/${list.length}`));
      const grid = document.createElement('div'); grid.className = 'book-grid';
      for (const th of list) {
        const ok = isFound(th);
        const cell = document.createElement('div'); cell.className = 'book-item' + (ok ? '' : ' missing');
        const ball = document.createElement('div'); ball.className = 'book-ball';
        ball.style.background = TIER_COLOR[t]; ball.textContent = ok ? th.e : '?';
        const name = document.createElement('div'); name.className = 'book-name'; name.textContent = ok ? th.n : '???';
        cell.append(ball, name); grid.appendChild(cell);
      }
      body.append(h, grid);
    }
    bookEl.hidden = false;
    document.getElementById('book-close').focus();
  }
  function closeBook() { bookEl.hidden = true; }
  document.getElementById('book-close').addEventListener('click', closeBook);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && bookOpen()) closeBook(); });

  // ---- Share the daily result (works in apps without a share menu too) ----
  const GAME_URL = '';   // public link, added when the game is published
  function shareDaily() {
    const lvl = roundTop;
    const msg = `Merge Anything · Daily #${dailyNo}\n${score} points · Level ${lvl}/10\n` +
      '🟩'.repeat(lvl) + '⬜'.repeat(MAX_TIER - lvl) +
      `\nSame drops for everyone today. Can you beat me?` + (GAME_URL ? '\n' + GAME_URL : '');
    if (navigator.share) {
      navigator.share({ text: msg }).catch(err => { if (!err || err.name !== 'AbortError') copyMsg(msg); });
    } else copyMsg(msg);
  }
  function copyMsg(str) {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = str; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch (e) {}
    if (!ok) { try { navigator.clipboard.writeText(str); ok = true; } catch (e) {} }
    showToast(ok ? 'Result copied! Paste it to your friends' : 'Could not copy');
  }
  let aiming = false;
  function toLocal(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    Sound.init();
    const p = toLocal(e);
    if (Math.hypot(p.x - MUTE.x, p.y - MUTE.y) < MUTE.r + 8) { Sound.toggleMute(); return; }
    if (inBtn(BOOK_HIT, p)) { pendingBook = true; return; }
    if (state === 'over') {
      if (clock - overAt <= 1.9) return;
      if (inBtn(BTN_LEFT, p)) { newGame(mode === 'daily' ? 'normal' : 'daily'); return; }
      if (inBtn(BTN_RIGHT, p)) { if (mode === 'daily') pendingShare = true; else pendingBook = true; return; }
      newGame(); return;
    }
    if (state !== 'play') return;
    if (firstDrop && mode === 'normal' && inBtn(BTN_INTRO, p)) { newGame('daily'); return; }
    aiming = true; aimX = p.x;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    const p = toLocal(e);
    if (aiming || e.pointerType === 'mouse') aimX = p.x;
  });
  let pendingBook = false, pendingShare = false;
  const lift = e => {
    Sound.init();
    // Open the book / share on finger lift: phones only allow the share menu from a tap.
    if (pendingBook) { pendingBook = false; openBook(); return; }
    if (pendingShare) { pendingShare = false; shareDaily(); return; }
    if (!aiming) return;
    aiming = false;
    aimX = toLocal(e).x;
    dropHeld();
  };
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', () => { aiming = false; });
  const block = e => e.preventDefault();
  canvas.addEventListener('touchstart', block, { passive: false });
  canvas.addEventListener('touchmove', block, { passive: false });
  window.addEventListener('contextmenu', block);
  window.addEventListener('keydown', e => {
    if (bookOpen()) return;
    if (e.code === 'Space' || e.code === 'Enter') { Sound.init(); if (state === 'over' && clock - overAt > 1.9) newGame(); else dropHeld(); }
    if (e.code === 'ArrowLeft') aimX -= 24;
    if (e.code === 'ArrowRight') aimX += 24;
  });

  // =====================================================================
  // Update
  // =====================================================================
  let acc = 0;
  function update(dt) {
    clock += dt;
    const slow = state === 'burp' ? 0.6 : 1;
    acc += dt * slow;
    let steps = 0;
    while (acc >= STEP && steps < 6) { physicsStep(STEP); acc -= STEP; steps++; }
    if (steps === 6) acc = 0;

    if (state === 'play') {
      if (!held && clock >= readyAt) { held = next; next = pickDrop(); }
      // Too full? Anything resting above the rim for too long makes Gulp burp.
      let worst = 0;
      for (const b of bodies) {
        const settledAbove = b.y - b.r < JAR_TOP && clock - b.born > 1.0;
        b.overT = settledAbove ? b.overT + dt : 0;
        worst = Math.max(worst, b.overT);
      }
      warnT = worst;
      if (worst > 0.25 && clock > nextTick) { Sound.tick(); nextTick = clock + Math.max(0.12, 0.5 - worst * 0.18); }
      if (worst > OVER_LIMIT) gameOver();
    } else if (state === 'burp' && clock - overAt > 1.5) {
      state = 'over';
      overAt = clock - 1.5;
    }

    for (const b of bodies) {          // squash-and-stretch wobble
      b.wobV += (-b.wob * 260 - b.wobV * 14) * dt;
      b.wob += b.wobV * dt;
      if (!b.item) b.spin += dt * 3;
    }
    gulp.wobV += (-gulp.wob * 200 - gulp.wobV * 10) * dt;
    gulp.wob += gulp.wobV * dt;
    gulp.wow = Math.max(0, gulp.wow - dt);
    if (clock > gulp.blinkAt) { gulp.blink = 0.14; gulp.blinkAt = clock + rand(2, 5); }
    gulp.blink = Math.max(0, gulp.blink - dt);
    // Gulp watches the newest falling thing, or the thing you are holding.
    let target = { x: aimX, y: DROP_Y };
    const last = bodies[bodies.length - 1];
    if (last && clock - last.born < 0.8) target = last;
    gulp.look.x += (target.x - gulp.look.x) * Math.min(1, dt * 10);
    gulp.look.y += (target.y - gulp.look.y) * Math.min(1, dt * 10);

    for (const p of particles) {
      p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.99; if (p.rv) p.rot += p.rv * dt;
    }
    particles = particles.filter(p => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
    popups = popups.filter(p => p.t < p.life);
    if (banner) { banner.t += dt; if (banner.t > banner.life) banner = null; }
    if (lastRecipe && lastRecipe.res) lastRecipe.shownT = (lastRecipe.shownT || 0) + dt;
    shake = Math.max(0, shake - dt * 30);
  }

  // =====================================================================
  // Drawing
  // =====================================================================
  function text(str, x, y, size, color, weight = 700, align = 'center', font = FONT) {
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function fitFont(str, maxW, size, weight = 700) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    const w = ctx.measureText(str).width;
    return w > maxW ? Math.max(8, size * maxW / w) : size;
  }

  // Each thing is a round sticker: flat color, thick ink outline, emoji, and its name.
  function sprite(item, t) {
    const key = t + '|' + item.n + '|' + item.e;
    let s = sprites.get(key);
    if (s) return s;
    const r = RADII[t], pad = 6, k = scale * dpr;
    const size = Math.ceil((r + pad) * 2 * k);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    g.scale(k, k); g.translate(r + pad, r + pad);
    // drop shadow
    g.fillStyle = 'rgba(43,34,51,0.18)';
    g.beginPath(); g.arc(0, 3, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = TIER_COLOR[t];
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    // soft shine
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(-r * 0.38, -r * 0.42, r * 0.32, r * 0.17, -0.6, 0, Math.PI * 2); g.fill();
    g.lineWidth = Math.max(3, r * 0.09); g.strokeStyle = INK;
    g.beginPath(); g.arc(0, 0, r - g.lineWidth / 2, 0, Math.PI * 2); g.stroke();
    const labeled = r >= 35;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `${Math.round(r * (labeled ? 0.95 : 1.12))}px ${EMOJI_FONT}`;
    g.fillStyle = '#000';
    g.fillText(item.e, 0, labeled ? -r * 0.14 : r * 0.04);
    if (labeled) {
      let fs = Math.max(10, r * 0.26);
      g.font = `700 ${fs}px ${FONT}`;
      const w = g.measureText(item.n).width, maxW = r * 1.62;
      if (w > maxW) { fs = Math.max(8, fs * maxW / w); g.font = `700 ${fs}px ${FONT}`; }
      g.lineWidth = fs * 0.32; g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineJoin = 'round';
      g.strokeText(item.n, 0, r * 0.56);
      g.fillStyle = INK; g.fillText(item.n, 0, r * 0.56);
    }
    // level number badge
    const br = Math.max(9, r * 0.2), bx = r * 0.7, by = -r * 0.7;
    g.fillStyle = '#ffffff'; g.strokeStyle = INK; g.lineWidth = Math.max(2, br * 0.28);
    g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = INK; g.font = `700 ${Math.round(br * 1.25)}px ${FONT}`;
    g.fillText(String(t), bx, by + br * 0.06);
    if (t === MAX_TIER) {   // the legendary level shines
      g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.setLineDash([6, 8]);
      g.beginPath(); g.arc(0, 0, r * 0.86, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    }
    s = { c, half: r + pad };
    sprites.set(key, s);
    return s;
  }

  function drawBody(b) {
    const sx = 1 + b.wob, sy = 1 - b.wob;
    if (state === 'play' && held && b.item && b.t === held.t) {
      // "this one will fuse with what you are holding"
      const a = 0.55 + 0.45 * Math.sin(clock * 8);
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    if (state === 'burp') ctx.rotate(b.spin);
    ctx.scale(sx * b.r / b.tr, sy * b.r / b.tr);
    if (b.item) {
      const s = sprite(b.item, b.t);
      ctx.drawImage(s.c, -s.half, -s.half, s.half * 2, s.half * 2);
    } else drawMystery(b);
    ctx.restore();
  }
  // Still "cooking": the two parents swirl inside a cloudy bubble.
  function drawMystery(b) {
    const r = b.tr;
    ctx.fillStyle = 'rgba(43,34,51,0.18)';
    ctx.beginPath(); ctx.arc(0, 3, r, 0, Math.PI * 2); ctx.fill();
    const grd = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(1, '#e6dcff');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = Math.max(3, r * 0.09); ctx.strokeStyle = INK;
    ctx.setLineDash([r * 0.3, r * 0.18]); ctx.lineDashOffset = -clock * 40;
    ctx.beginPath(); ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    if (b.parents) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `${Math.round(r * 0.55)}px ${EMOJI_FONT}`;
      for (let i = 0; i < 2; i++) {
        const a = b.spin + i * Math.PI;
        ctx.fillText(b.parents[i].e, Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
      }
    }
    text('?', 0, 2, r * 0.7, 'rgba(43,34,51,0.55)', 700);
  }

  // Gulp: a hungry glass jar. Its open top is its mouth; its eyes sit on the rim.
  function jarPath() {
    const L = JAR_L - 10, R = JAR_R + 10, B = FLOOR + 12, cr = 46;
    ctx.beginPath();
    ctx.moveTo(L, JAR_TOP - 6);
    ctx.lineTo(L, B - cr);
    ctx.quadraticCurveTo(L, B, L + cr, B);
    ctx.lineTo(R - cr, B);
    ctx.quadraticCurveTo(R, B, R, B - cr);
    ctx.lineTo(R, JAR_TOP - 6);
  }
  function drawJarBack() {
    // feet
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(JAR_L + 70, FLOOR + 22, 42, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(JAR_R - 70, FLOOR + 22, 42, 12, 0, 0, Math.PI * 2); ctx.fill();
    // glass body
    jarPath(); ctx.closePath();
    ctx.fillStyle = 'rgba(214,240,255,0.55)';
    ctx.fill();
    // danger zone glow at the rim
    if (warnT > 0.2 && state === 'play') {
      const a = 0.25 + 0.25 * Math.sin(clock * 18);
      ctx.fillStyle = `rgba(255,79,123,${a})`;
      ctx.fillRect(JAR_L, JAR_TOP, JAR_R - JAR_L, 6);
    }
  }
  function drawJarFront() {
    const sq = gulp.wob * 0.04;
    // glass outline
    ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    jarPath(); ctx.stroke();
    // glass shine stripes
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(JAR_L + 8, JAR_TOP + 60); ctx.lineTo(JAR_L + 8, JAR_TOP + 230); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(JAR_L + 8, JAR_TOP + 260); ctx.lineTo(JAR_L + 8, JAR_TOP + 300); ctx.stroke();
    const lipY = JAR_TOP - 8 - sq * 60;
    // danger line
    ctx.save();
    ctx.setLineDash([12, 10]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = warnT > 0.2 && state === 'play' ? '#ff4f7b' : 'rgba(43,34,51,0.18)';
    ctx.beginPath(); ctx.moveTo(JAR_L + 6, JAR_TOP); ctx.lineTo(JAR_R - 6, JAR_TOP); ctx.stroke();
    ctx.restore();
    drawFace(lipY);
  }
  function drawFace(lipY) {
    const worried = warnT > 0.3 && state === 'play';
    const burping = state !== 'play';
    const wow = gulp.wow > 0;
    const eyes = [{ x: JAR_L - 10, side: -1 }, { x: JAR_R + 10, side: 1 }];
    const ey = lipY - 18;
    for (const e of eyes) {
      const er = burping ? 34 : wow ? 31 : 27;
      // eye stalk
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(e.x, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (gulp.blink > 0 && !burping) {
        ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(e.x - er * 0.7, ey); ctx.lineTo(e.x + er * 0.7, ey); ctx.stroke();
      } else if (burping && clock - overAt < 0.9) {
        // squeezed shut ">  <"
        ctx.lineWidth = 6; ctx.beginPath();
        ctx.moveTo(e.x - 12 * e.side, ey - 12); ctx.lineTo(e.x + 10 * e.side, ey); ctx.lineTo(e.x - 12 * e.side, ey + 12);
        ctx.stroke();
      } else {
        const dx = gulp.look.x - e.x, dy = gulp.look.y - ey, d = Math.hypot(dx, dy) || 1;
        const m = er - 13;
        const pr = wow ? 15 : 11;
        const px = e.x + dx / d * m, py = ey + dy / d * m;
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.35, pr * 0.32, 0, Math.PI * 2); ctx.fill();
        if (wow) {   // sparkle in the eyes
          ctx.beginPath(); ctx.arc(px + pr * 0.3, py + pr * 0.3, pr * 0.16, 0, Math.PI * 2); ctx.fill();
        }
      }
      // eyebrow
      ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
      const by = ey - er - 12 - (wow ? 6 : 0);
      const tilt = worried ? 10 : burping ? -6 : wow ? -4 : 0;
      ctx.beginPath();
      ctx.moveTo(e.x - 18 * e.side, by - tilt * 0.2);
      ctx.lineTo(e.x + 18 * e.side, by + (worried ? -tilt : tilt));
      ctx.stroke();
      // cheek blush
      ctx.fillStyle = 'rgba(255,120,150,0.45)';
      ctx.beginPath(); ctx.ellipse(e.x - 24 * e.side, ey + 50, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
    }
    drawMouth(worried, burping, wow);
    if (worried) {   // sweat drop
      const sy = ey + 10 + ((clock * 60) % 40);
      ctx.fillStyle = '#7cc4ff'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(JAR_R + 46, sy - 14); ctx.quadraticCurveTo(JAR_R + 56, sy, JAR_R + 46, sy + 6);
      ctx.quadraticCurveTo(JAR_R + 36, sy, JAR_R + 46, sy - 14); ctx.fill(); ctx.stroke();
    }
  }

  // Gulp's little mouth, drawn on the glass just under the rim.
  function drawMouth(worried, burping, wow) {
    const mx = W / 2, my = JAR_TOP + 40 + gulp.wob * 0.6;
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const gulping = gulp.wobV > 2;
    if (burping) {
      ctx.beginPath(); ctx.ellipse(mx, my + 6, 46, 34, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8fa3'; ctx.beginPath(); ctx.ellipse(mx, my + 24, 26, 12, 0, 0, Math.PI * 2); ctx.fill();
    } else if (wow || gulping) {
      ctx.beginPath(); ctx.ellipse(mx, my, 13, 16, 0, 0, Math.PI * 2); ctx.fill();
    } else if (worried) {
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) { const x = mx - 30 + i * 10, y = my + (i % 2 ? -5 : 5); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(mx, my - 14, 24, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    }
  }

  function drawHeld() {
    if (state !== 'play') return;
    const item = held;
    // aim guide
    const r = item ? RADII[item.t] : 22;
    const x = clamp(aimX, JAR_L + r + 1, JAR_R - r - 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(43,34,51,0.16)'; ctx.lineWidth = 3; ctx.setLineDash([4, 12]);
    ctx.beginPath(); ctx.moveTo(x, DROP_Y + r + 4); ctx.lineTo(x, FLOOR); ctx.stroke();
    ctx.restore();
    if (!item) return;
    const s = sprite(item.item, item.t);
    const bob = Math.sin(clock * 4) * 3;
    ctx.drawImage(s.c, x - s.half, DROP_Y - s.half + bob, s.half * 2, s.half * 2);
  }

  function drawHUD() {
    // score
    text(String(score), W / 2, 68, 64, INK, 700);
    if (mode === 'daily') {
      const todayBest = daily.day === dailyNo ? daily.best : 0;
      text('TODAY ' + todayBest, 24, 34, 20, 'rgba(43,34,51,0.6)', 700, 'left');
      pill(W / 2, 20, 190, 30, '#ffe066');
      text(`📅 DAILY #${dailyNo}`, W / 2, 21, 17, INK, 700, 'center', `${FONT}, ${EMOJI_FONT}`);
    } else text('BEST ' + best, 24, 34, 20, 'rgba(43,34,51,0.6)', 700, 'left');
    // next
    text('NEXT', 24, 70, 15, 'rgba(43,34,51,0.55)', 700, 'left');
    if (next) {
      const s = sprite(next.item, next.t);
      ctx.drawImage(s.c, 52 - 26, 106 - 26, 52, 52);
    }
    // discoveries
    pill(W - 62, 97, 104, 38, '#ffffff');
    text('📖', W - 92, 96, 20, INK, 500, 'center', EMOJI_FONT);
    text(discoveredCount() + '/' + TOTAL_THINGS, W - 76, 98, fitFont('183/183', 56, 19), INK, 700, 'left');
    // mute
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 3;
    const mx = MUTE.x, my = MUTE.y;
    ctx.beginPath(); ctx.moveTo(mx - 12, my - 5); ctx.lineTo(mx - 5, my - 5); ctx.lineTo(mx + 3, my - 12);
    ctx.lineTo(mx + 3, my + 12); ctx.lineTo(mx - 5, my + 5); ctx.lineTo(mx - 12, my + 5); ctx.closePath(); ctx.fill();
    if (Sound.isMuted()) { ctx.beginPath(); ctx.moveTo(mx + 8, my - 7); ctx.lineTo(mx + 18, my + 7); ctx.moveTo(mx + 18, my - 7); ctx.lineTo(mx + 8, my + 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(mx + 4, my, 10, -0.8, 0.8); ctx.stroke(); }

    // last recipe:  💧 Water + 🔥 Fire = ♨️ Steam
    if (banner) drawBanner();
    else if (lastRecipe) {
      const R = lastRecipe;
      const right = R.res ? R.res.e + ' ' + R.res.n : '…';
      const str = `${R.a.e} ${R.a.n}  +  ${R.b.e} ${R.b.n}  =  ${right}`;
      const fs = fitFont(str, W - 60, 22);
      pill(W / 2, 162, Math.min(W - 40, measure(str, fs) + 36), 42, '#ffffff');
      text(str, W / 2, 163, fs, INK, 700);
    } else if (firstDrop) {
      text('Same color = they fuse into something new!', W / 2, 162, 21, INK, 700);
    }

    // size ladder at the bottom: how big have you gone?
    const top = maxTierEver();
    // The level path: 1 to 10, the goal is the gold 10.
    const y = 938, r = 16, gap = 8, total = MAX_TIER * r * 2 + (MAX_TIER - 1) * gap;
    let x = (W - total) / 2 + r;
    for (let t = 1; t <= MAX_TIER; t++) {
      const got = t <= top;
      ctx.fillStyle = got ? TIER_COLOR[t] : 'rgba(43,34,51,0.08)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = got ? INK : 'rgba(43,34,51,0.25)'; ctx.stroke();
      text(t === MAX_TIER && !got ? '★' : String(t), x, y + 1, 16, got ? INK : 'rgba(43,34,51,0.4)', 700);
      x += r * 2 + gap;
    }
  }
  function measure(str, fs, weight = 700) { ctx.font = `${weight} ${fs}px ${FONT}`; return ctx.measureText(str).width; }
  function pill(cx, cy, w, h, fill, stroke = INK) {
    ctx.fillStyle = 'rgba(43,34,51,0.18)';
    rr(cx - w / 2, cy - h / 2 + 4, w, h, h / 2); ctx.fill();
    ctx.fillStyle = fill; rr(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  let maxTierCache = loadJSON('merge_maxtier', 1);
  function maxTierEver() {
    let m = maxTierCache;
    for (const b of bodies) if (b.item && b.t > m) m = b.t;
    if (m > maxTierCache) { maxTierCache = m; saveJSON('merge_maxtier', m); }
    return m;
  }

  function drawBanner() {
    const b = banner;
    const inT = Math.min(1, b.t / 0.18), outT = Math.min(1, (b.life - b.t) / 0.25);
    const k = Math.min(inT, outT);
    const pop = 1 + Math.sin(Math.min(1, b.t / 0.3) * Math.PI) * 0.12;
    ctx.save();
    ctx.translate(W / 2, 168);
    ctx.scale(k * pop, k * pop);
    const world = b.kind === 'world' || b.kind === 'win' || b.kind === 'level';
    const label = b.kind === 'win' ? 'YOU WIN! LEVEL 10 LEGEND'
      : b.kind === 'level' ? `LEVEL ${b.level} REACHED!` : world ? 'FIRST IN THE WORLD!' : 'NEW DISCOVERY';
    const str = b.item.e + ' ' + b.item.n;
    const fs = fitFont(str, 380, 34);
    const w = Math.max(measure(str, fs) + 70, 300);
    ctx.translate(0, 0);
    ctx.fillStyle = 'rgba(43,34,51,0.2)'; rr(-w / 2, -40 + 6, w, 84, 26); ctx.fill();
    ctx.fillStyle = world ? '#ffe066' : '#ffffff'; rr(-w / 2, -40, w, 84, 26); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    // tag
    const tw = measure(label, 16) + 26;
    ctx.fillStyle = world ? '#ff4f7b' : INK; rr(-tw / 2, -54, tw, 28, 14); ctx.fill();
    text(label, 0, -40, 16, '#ffffff', 700);
    ctx.font = `700 ${fs}px ${FONT}`;
    text(b.item.e, -measure(b.item.n, fs) / 2 - 6, 10, fs, '#000', 500, 'center', EMOJI_FONT);
    text(b.item.n, 18, 11, fs, INK, 700);
    ctx.restore();
  }

  function drawOverPanel() {
    if (state !== 'over') return;
    const t = clock - overAt;
    const k = Math.min(1, (t - 1.5) / 0.25);
    if (k <= 0) return;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(243,233,216,0.72)'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, top = 330;
    ctx.translate(0, (1 - k) * 40);
    ctx.fillStyle = 'rgba(43,34,51,0.2)'; rr(50, top + 8, W - 100, 400, 34); ctx.fill();
    ctx.fillStyle = '#ffffff'; rr(50, top, W - 100, 400, 34); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    const isDaily = mode === 'daily';
    text(isDaily ? `DAILY #${dailyNo}` : 'BURP!', cx, top + 52, 52, '#ff4f7b', 700);
    text(isDaily ? 'Same drops for everyone today' : 'Gulp is too full', cx, top + 96, 20, 'rgba(43,34,51,0.65)', 500);
    text(String(score), cx, top + 160, 76, INK, 700);
    const newBest = isDaily ? wasDailyBest : wasBest;
    const shownBest = isDaily ? daily.best : best;
    text(newBest ? (isDaily ? "TODAY'S BEST!" : 'NEW BEST!') : (isDaily ? 'TODAY ' : 'BEST ') + shownBest,
      cx, top + 212, 22, newBest ? '#ff4f7b' : 'rgba(43,34,51,0.6)', 700);
    if (bestMade) {
      text('Biggest thing you made', cx, top + 254, 17, 'rgba(43,34,51,0.6)', 500);
      const str = bestMade.n;
      const fs = fitFont(str, 300, 28);
      const w = measure(str, fs);
      text(bestMade.e, cx - w / 2 - 6, top + 290, 30, '#000', 500, 'center', EMOJI_FONT);
      text(str, cx + 18, top + 291, fs, INK, 700);
    }
    const disc = `Level ${roundTop} of 10   ·   📖 ${discoveredCount()}/${TOTAL_THINGS} found`;
    text(disc, cx, top + 336, 19, INK, 500, 'center', `${FONT}, ${EMOJI_FONT}`);
    if (t > 1.9) {
      const p = 1 + Math.sin(clock * 5) * 0.04;
      ctx.save(); ctx.translate(BTN_AGAIN.x, BTN_AGAIN.y); ctx.scale(p, p);
      pill(0, 0, BTN_AGAIN.w, BTN_AGAIN.h, '#ffe066');
      text(isDaily ? 'TRY AGAIN' : 'TAP TO PLAY AGAIN', 0, 1, 24, INK, 700);
      ctx.restore();
      const emo = `${FONT}, ${EMOJI_FONT}`;
      pill(BTN_LEFT.x, BTN_LEFT.y, BTN_LEFT.w, BTN_LEFT.h, '#ffffff');
      text(isDaily ? '🎲 NORMAL' : `📅 DAILY #${dailyNo}`, BTN_LEFT.x, BTN_LEFT.y + 1, 19, INK, 700, 'center', emo);
      pill(BTN_RIGHT.x, BTN_RIGHT.y, BTN_RIGHT.w, BTN_RIGHT.h, isDaily ? '#a5e37a' : '#ffffff');
      text(isDaily ? '📤 SHARE' : '📖 BOOK', BTN_RIGHT.x, BTN_RIGHT.y + 1, 19, INK, 700, 'center', emo);
    }
    ctx.restore();
  }

  // First screen: a tiny looping demo shows the one rule — same color fuses.
  function drawIntro() {
    if (!firstDrop || state !== 'play') return;
    text('MERGE ANYTHING', W / 2, 410, fitFont('MERGE ANYTHING', JAR_R - JAR_L - 40, 52), INK, 700);
    const T = (clock % 2.6) / 2.6;               // 0..1 loop
    const y = 540, water = BASE[0], ocean = POOL[2][0];
    const r1 = RADII[1] * 1.25, r2 = RADII[2] * 1.25;
    const draw1 = (item, t, x, yy, r) => {
      const sp = sprite(item, t), k = r / RADII[t];
      ctx.drawImage(sp.c, x - sp.half * k, yy - sp.half * k, sp.half * 2 * k, sp.half * 2 * k);
    };
    if (T < 0.45) {
      const d = 90 * (1 - T / 0.45) + r1;         // two blue ones slide together
      draw1(water, 1, W / 2 - d, y, r1); draw1(water, 1, W / 2 + d, y, r1);
    } else {
      const p = Math.min(1, (T - 0.45) / 0.12);
      const pop = p < 1 ? 0.6 + p * 0.5 : 1.1 - Math.min(0.1, (T - 0.57) * 0.6);
      draw1(ocean, 2, W / 2, y, r2 * pop);
      if (T < 0.62) { ctx.globalAlpha = 1 - (T - 0.45) / 0.17; ctx.strokeStyle = INK; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(W / 2, y, r2 * (1 + (T - 0.45) * 5), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    text('Same color = they fuse!', W / 2, 628, 30, INK, 700);
    text('💧 + 💧 = 🌊', W / 2, 670, 26, INK, 500, 'center', `${FONT}, ${EMOJI_FONT}`);
    text('Make bigger and bigger things.', W / 2, 726, 22, 'rgba(43,34,51,0.75)', 500);
    text('Reach level 10 to WIN!', W / 2, 758, 24, '#ff4f7b', 700);
    text('Don\'t let Gulp overflow!', W / 2, 792, 22, 'rgba(43,34,51,0.75)', 500);
    text('Touch, slide, let go to drop', W / 2, 462, 19, 'rgba(43,34,51,0.6)', 500);
    if (mode === 'normal') {
      pill(BTN_INTRO.x, BTN_INTRO.y, BTN_INTRO.w, BTN_INTRO.h, '#ffe066');
      text(`📅 TODAY'S CHALLENGE #${dailyNo}`, BTN_INTRO.x, BTN_INTRO.y + 1, 20, INK, 700, 'center', `${FONT}, ${EMOJI_FONT}`);
    } else text(`📅 Daily #${dailyNo}: same drops for everyone`, W / 2, 846, 20, INK, 700, 'center', `${FONT}, ${EMOJI_FONT}`);
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.fillStyle = '#f3e9d8'; ctx.fillRect(0, 0, W, H);
    // paper dots
    ctx.fillStyle = 'rgba(43,34,51,0.05)';
    for (let y = 20; y < H; y += 34) for (let x = (y / 34) % 2 ? 20 : 37; x < W; x += 34) { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    drawJarBack();
    drawIntro();
    for (const b of bodies) drawBody(b);
    drawJarFront();
    drawHeld();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.color;
      if (p.rect) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.font = `700 ${p.size}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === 'burp' && clock - overAt < 1.4) {
      const t = clock - overAt;
      ctx.save(); ctx.translate(W / 2, 470); ctx.rotate(-0.08); const s = 0.6 + Math.min(1, t * 4) * 0.6; ctx.scale(s, s);
      ctx.font = `700 110px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText('BURP!', 0, 0);
      ctx.fillStyle = '#ffe066'; ctx.fillText('BURP!', 0, 0);
      ctx.restore();
    }
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawHUD();
    drawOverPanel();
    if (performance.now() < toast.until) {
      const fs = fitFont(toast.msg, W - 80, 20);
      pill(W / 2, 290, Math.min(W - 40, measure(toast.msg, fs) + 40), 48, INK, INK);
      text(toast.msg, W / 2, 291, fs, '#ffffff', 700);
    }
  }

  // =====================================================================
  // Main loop
  // =====================================================================
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (!bookOpen()) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Small hook for automated checks.
  window.__merge = { get bodies() { return bodies; }, get state() { return state; }, get score() { return score; },
    drop(x) { aimX = x; dropHeld(); }, book: BOOK, ALL_THINGS, openBook, newGame, get mode() { return mode; }, RADII, DROP_ODDS, fuseResult, WORLD, POOL, TOTAL_THINGS,
    // Plays a round with random drops as fast as possible; returns how it went.
    heldName() { return held.item.n; }, forceNext() { held = next; next = pickDrop(); },
    async sim(maxDrops = 400, keepMode = false) {
      newGame(keepMode ? mode : 'normal'); firstDrop = false; let drops = 0, time = 0;
      while (state === 'play' && drops < maxDrops) {
        if (held && clock >= readyAt) { aimX = rand(JAR_L, JAR_R); dropHeld(); drops++; }
        update(1 / 60); time += 1 / 60; await null;
      }
      let top = 0; for (const b of bodies) top = Math.max(top, b.t);
      return { drops, time: Math.round(time), score, top };
    } };
})();
</script>
