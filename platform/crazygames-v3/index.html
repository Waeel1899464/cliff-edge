<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12141f">
<title>Cliff Edge</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
</style>
<script>window.CLIFF_BUILD = 'crazygames'; window.CLIFF_STORE_PREFIX = 'cg3_';</script>
</head>
<body>
<title>Cliff Edge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one 9:16 game canvas, centered and letterboxed on any screen. Single dark arcade look by choice. */
  :root {
    --bg: #12141f;
    --fg: #f4f1ff;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    /* Side areas on wide screens continue the game's world: sky down to the horizon, then sea
       (the sea starts at 84.4% of the game's height, the same line as in the game), slightly
       darkened so the game itself stays the focus. Falls back to the plain dark color. */
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(10, 10, 25, 0.38), rgba(10, 10, 25, 0.38)),
      linear-gradient(180deg, #2a1f5c 0%, #ff7a59 60%, #ffb36b 84.2%, #1f3d7a 84.4%, #1a3468 100%);
    color: var(--fg);
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.45);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  /* Share panel shown when the browser has no share menu (in-app browsers). */
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 9, 20, 0.72);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .sheet-card {
    width: 100%; max-width: 360px;
    background: #1d2033; color: #f4f1ff;
    border-radius: 22px; padding: 22px 20px 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  .sheet-card h2 { margin: 0; font-size: 22px; font-weight: 900; text-wrap: balance; }
  .sheet-card p { margin: 0 0 4px; font-size: 15px; line-height: 1.45; color: #cfd0e6; }
  .sheet-actions { display: flex; flex-direction: column; gap: 10px; }
  .sheet-btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 16px; border-radius: 26px; border: 0;
    font: 800 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-decoration: none; cursor: pointer;
    background: #2c3050; color: #ffffff;
  }
  .sheet-btn.primary { background: #ffd23f; color: #12141f; }
  .sheet-btn.ghost { background: transparent; color: #a9abc8; min-height: 44px; }
  .sheet-btn:focus-visible { outline: 3px solid #7ef9ff; outline-offset: 2px; }
</style>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <h2 id="sheet-title"></h2>
    <p id="sheet-text"></p>
    <div id="sheet-actions" class="sheet-actions"></div>
    <button id="sheet-close" class="sheet-btn ghost" type="button">Close</button>
  </div>
</div>

<canvas id="game" aria-label="Cliff Edge game. Press and hold to drive, release to stop as close to the edge as you can."></canvas>

<script>
(() => {
  // ---------- Build ----------
  // 'web' = the public GitHub Pages version (all features).
  // 'crazygames' = platform version, set by build.sh: no external links, no clip sharing,
  // no friend-challenge links, no event tracking. Original features stay in the code.
  const BUILD = window.CLIFF_BUILD === 'crazygames' ? 'crazygames' : 'web';
  const IS_PORTAL = BUILD !== 'web';

  // ---------- Setup ----------
  const W = 540, H = 960;            // logical size (9:16)
  const PPM = 30;                    // pixels per meter (at zoom 1)
  const EDGE_X = 430;                // cliff edge, in logical pixels
  const GROUND_Y = 620;              // top of the cliff
  const WATER_Y = H - 150;           // sea surface
  const CAR_LEN = 1.6;               // meters
  const CAR_H = 26, WHEEL_R = 8;     // pixels
  const G_PX = 900;                  // gravity in px/s² for the fall
  const CAM_ANCHOR_X = W * 0.55;     // where the camera focus sits on screen

  /* PHYSICS-BEGIN
     Pure functions: no DOM, no game state. tools/sim reads this exact block from index.html,
     so the simulator and the game always share the same physics.

     Motion is computed with closed-form equations, not frame steps, so a position or a stop
     depends only on input times, never on the screen's frame rate (30/60/120/144 Hz all equal).
       Holding (from rest, accel a up to vmax):  v = min(vmax, a*t)
       Sliding (dv/dt = -(c + k*v)):             v(t) = (v0 + c/k) e^(-k t) - c/k
                                                 x(t) = (v0 + c/k)(1 - e^(-k t))/k - (c/k) t
                                                 stop time  = ln(1 + k v0 / c) / k
                                                 stop dist  = v0/k - (c/k^2) ln(1 + k v0 / c)  */
  const Physics = (() => {
    const ACCEL = 7;                                  // m/s² while holding (unchanged)
    // Braking: deceleration = base + drag * speed (unchanged values)
    const SURFACES = [
      { name: 'ROAD', base: 2.0, drag: 0.9 },
      { name: 'ICE',  base: 0.9, drag: 0.45 },
      { name: 'MUD',  base: 4.0, drag: 1.8 },
      { name: 'SAND', base: 3.0, drag: 1.2 },          // V3 (desert): grippy but slides a bit longer than mud
    ];
    const BASE_SURFACES = 3;                            // V2 grounds: random, daily and seeded cliffs use only these

    // ---- holding from rest ----
    function hold(tau, vmax) {
      if (!(tau > 0)) return { d: 0, v: 0, a: ACCEL };
      const tv = vmax / ACCEL;
      if (tau < tv) return { d: 0.5 * ACCEL * tau * tau, v: ACCEL * tau, a: ACCEL };
      return { d: 0.5 * vmax * tv + vmax * (tau - tv), v: vmax, a: 0 };
    }
    // time (s) at which the holding car has moved `dist` meters
    function holdTimeFor(dist, vmax) {
      if (!(dist > 0)) return 0;
      const tv = vmax / ACCEL, dv = 0.5 * vmax * tv;
      return dist <= dv ? Math.sqrt(2 * dist / ACCEL) : tv + (dist - dv) / vmax;
    }

    // ---- sliding ----
    function stopTime(v0, c, k) { return v0 > 0 ? Math.log(1 + k * v0 / c) / k : 0; }
    function stopDist(v0, c, k) { return v0 > 0 ? v0 / k - (c / (k * k)) * Math.log(1 + k * v0 / c) : 0; }
    function slide(sig, v0, c, k) {
      const ts = stopTime(v0, c, k);
      if (!(sig > 0)) return { d: 0, v: v0, a: v0 > 0 ? -(c + k * v0) : 0, done: !(v0 > 0) };
      if (sig >= ts) return { d: stopDist(v0, c, k), v: 0, a: 0, done: true };
      const A = v0 + c / k, e = Math.exp(-k * sig), v = A * e - c / k;
      return { d: A * (1 - e) / k - (c / k) * sig, v, a: -(c + k * v), done: false };
    }
    // time (s) after release at which the sliding car has moved `dist` (< stop distance); bisection
    function slideTimeFor(dist, v0, c, k) {
      let lo = 0, hi = stopTime(v0, c, k);
      for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (slide(m, v0, c, k).d < dist) lo = m; else hi = m; }
      return (lo + hi) / 2;
    }

    // ---- whole attempt ----
    // gap to the edge (m) after releasing at hold time tau, front starting D meters from the edge
    function gapAfter(tau, D, vmax, c, k) { const h = hold(tau, vmax); return D - h.d - stopDist(h.v, c, k); }
    // hold time that leaves `gap` meters (gap(tau) only decreases with tau)
    function releaseFor(gap, D, vmax, c, k) {
      let lo = 0, hi = holdTimeFor(D, vmax);
      for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (gapAfter(m, D, vmax, c, k) > gap) lo = m; else hi = m; }
      return (lo + hi) / 2;
    }
    // how many meters the result moves per second of release timing, near the edge
    function sensitivity(D, vmax, c, k) {
      const t0 = releaseFor(0, D, vmax, c, k), h = 1e-4;
      return (gapAfter(t0 - h, D, vmax, c, k) - gapAfter(t0 + h, D, vmax, c, k)) / (2 * h);
    }

    // ---- fair targets (see tools/sim and reports for how these were chosen) ----
    // Release-timing noise of the reference ("average") player on a FIRST try at a cliff (seconds):
    // human timing spread, touch-screen sampling (uniform over q) and the misjudgment of a cliff not
    // seen before (learned = 1: none of it learned yet). Retries are easier: the ghost helps.
    const REF = { st: 0.015, q: 0.008, bias0: 0.040, learned: 1 };
    function timingSigma(prof) {
      const p = prof || REF;
      return Math.sqrt(p.st * p.st + p.q * p.q / 12 + p.learned * p.bias0 * p.bias0);
    }
    // inverse standard normal CDF (Acklam's approximation, |error| < 1.2e-9)
    function normInv(pr) {
      const a = [-39.6968302866538, 220.946098424521, -275.928510446969, 138.357751867269, -30.6647980661472, 2.50662827745924];
      const b = [-54.4760987982241, 161.585836858041, -155.698979859887, 66.8013118877197, -13.2806815528857];
      const c = [-0.00778489400243029, -0.322396458041136, -2.40075827716184, -2.54973253934373, 4.37466414146497, 2.93816398269878];
      const d = [0.00778469570904146, 0.32246712907004, 2.445134137143, 3.75440866190742];
      const pl = 0.02425;
      if (pr < pl) { const q = Math.sqrt(-2 * Math.log(pr)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
      if (pr > 1 - pl) { const q = Math.sqrt(-2 * Math.log(1 - pr)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
      const q = pr - 0.5, r = q * q;
      return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
    }
    // Intended FIRST-try success of the reference player on cliff n (the difficulty curve).
    const CURVE = { start: 0.92, n1: 3, mid: 0.60, n2: 10, late: 0.40, n3: 20, plateau: 0.25, n4: 50, relief: 0.12 };
    function successGoal(n) {
      const C = CURVE;
      let p;
      if (n <= C.n1) p = C.start;
      else if (n <= C.n2) p = C.start + (C.mid - C.start) * (n - C.n1) / (C.n2 - C.n1);
      else if (n <= C.n3) p = C.mid + (C.late - C.mid) * (n - C.n2) / (C.n3 - C.n2);
      else if (n <= C.n4) p = C.late + (C.plateau - C.late) * (n - C.n3) / (C.n4 - C.n3);
      else p = C.plateau;
      if (n > 1 && (n - 1) % 5 === 0) p = Math.min(C.start, p + C.relief);   // checkpoint cliffs: a breather
      return p;
    }
    // Target (cm) giving success probability p for a cliff, 0.5..100 cm. Rounded up to what the
    // screen shows exactly: whole cm from 10 cm, half cm below (the shown target is the real one).
    function targetFor(p, D, vmax, c, k, prof) {
      const sPos = sensitivity(D, vmax, c, k) * timingSigma(prof);          // result spread (m)
      const T = 2 * sPos * normInv((1 + p) / 2) * 100;
      const r = T >= 10 ? Math.ceil(T) : Math.ceil(T * 2) / 2;
      return Math.min(100, Math.max(0.5, r));
    }

    // ---- stop quality: PERFECT < GREAT < success threshold, always in that order ----
    const GRADE = { greatFrac: 0.4, greatMax: 10, perfectFrac: 0.2, perfectMax: 2 };
    function grade(resultCm, targetCm) {
      if (typeof resultCm !== 'number' || !(resultCm >= 0) || !(resultCm < targetCm)) return null;   // only successful stops
      const great = Math.min(GRADE.greatMax, GRADE.greatFrac * targetCm);
      const perfect = Math.min(GRADE.perfectMax, GRADE.perfectFrac * targetCm, great * 0.5);
      return resultCm < perfect ? 'PERFECT' : resultCm < great ? 'GREAT' : 'GOOD';
    }

    // ---- cliffs ----
    // seeded layout: same numbers for everyone for the same key (daily, and cliffs 11+)
    function seededParams(key) {
      let h = 2166136261;
      for (const ch of key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      let a = h >>> 0;
      const r = () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
      return {
        si: Math.floor(r() * BASE_SURFACES),
        dist: Math.round((8 + r() * 5) * 1000) / 1000,
        vmax: Math.round((6 + r() * 3) * 1000) / 1000,
      };
    }
    // First 10 cliffs, designed by hand (si: 0 road, 1 ice, 2 mud). See reports for each one's purpose.
    // Road first; mud from cliff 3, mixed in gradually; ice only where the car is already at top
    // speed when you let go (forgiving: the result moves at the car's speed, not faster), never two
    // ice cliffs in a row; checkpoint cliff 6 is a gentle first ice.
    const CURATED = [
      { si: 0, dist: 8,  vmax: 6 },     //  1 road, slow: learn hold and release
      { si: 0, dist: 10, vmax: 6 },     //  2 road, longer drive
      { si: 2, dist: 9,  vmax: 6 },     //  3 first mud: stops much sooner
      { si: 0, dist: 11, vmax: 6.5 },   //  4 road, a bit faster
      { si: 2, dist: 11, vmax: 7 },     //  5 mud, faster
      { si: 1, dist: 11, vmax: 6 },     //  6 checkpoint: first ice, slow, top speed well before you let go
      { si: 0, dist: 12, vmax: 8 },     //  7 fast road
      { si: 2, dist: 12, vmax: 8.5 },   //  8 fast mud
      { si: 0, dist: 13, vmax: 8.5 },   //  9 long fast road
      { si: 1, dist: 13, vmax: 6.5 },   // 10 second ice, still at top speed when you let go
    ];
    function cliffParams(n) { return n >= 1 && n <= CURATED.length ? Object.assign({}, CURATED[n - 1]) : seededParams('cliff-' + n); }
    function cliffTarget(n, prm) {
      const S = SURFACES[prm.si];
      return targetFor(successGoal(n), prm.dist, prm.vmax, S.base, S.drag);
    }

    // =====================================================================================
    // Story cliffs (V3 worlds). A cliff is a "spec": every twist is part of the motion itself,
    // computed with the same closed-form pieces, so the simulator reproduces it exactly.
    //   si, dist, vmax       ground, distance from the car front to the edge (m), top speed
    //   slope                downhill grade (+ = downhill toward the edge): pulls the car on
    //   wind                 constant push in m/s² (+ = tail wind toward the edge, - = head wind)
    //   gs                   gravity scale (1 = Earth, Moon < 1): grip and braking scale with it
    //   patches [{at, si}]   ground changes when the car front has travelled `at` metres
    //   crumble [{at, len}]  when the front reaches `at`, a piece `len` long breaks off the edge
    //   fog, quake           harder to see / steady: visual only, but the target is sized for it
    // Holding: accel (ACCEL + gravity along the slope + wind) up to vmax, whatever the ground.
    // Sliding on each piece of ground: dv/dt = -(c + k v), c = base*gs - g*gs*slope - wind, k = drag*gs.
    // =====================================================================================
    const G = 9.8;
    function spec(o) {
      return Object.assign({ slope: 0, wind: 0, gs: 1, patches: [], crumble: [], fog: 0, quake: 0, boss: false }, o);
    }
    function holdAccel(sp) { return ACCEL + G * sp.gs * sp.slope + sp.wind; }
    function groundCK(sp, si) {
      const S = SURFACES[si];
      return { c: S.base * sp.gs - G * sp.gs * sp.slope - sp.wind, k: S.drag * sp.gs };
    }
    // pieces of ground along the road, in metres travelled by the car front
    function segments(sp) {
      const out = [], ps = sp.patches.slice().sort((a, b) => a.at - b.at);
      let x0 = 0, si = sp.si;
      for (const p of ps) { out.push(Object.assign({ x0, x1: p.at, si }, groundCK(sp, si))); x0 = p.at; si = p.si; }
      out.push(Object.assign({ x0, x1: Infinity, si }, groundCK(sp, si)));
      return out;
    }
    function holdS(tau, sp) {
      const a = holdAccel(sp), vmax = sp.vmax;
      if (!(tau > 0)) return { d: 0, v: 0, a };
      const tv = vmax / a;
      if (tau < tv) return { d: 0.5 * a * tau * tau, v: a * tau, a };
      return { d: 0.5 * vmax * tv + vmax * (tau - tv), v: vmax, a: 0 };
    }
    function holdTimeForS(dist, sp) {
      if (!(dist > 0)) return 0;
      const a = holdAccel(sp), tv = sp.vmax / a, dv = 0.5 * sp.vmax * tv;
      return dist <= dv ? Math.sqrt(2 * dist / a) : tv + (dist - dv) / sp.vmax;
    }
    // A slide from travel x0 at speed v0, piece by piece. Each phase is one closed-form piece.
    function slidePlan(x0, v0, sp) {
      const segs = segments(sp), phases = [];
      let x = x0, v = v0, t = 0, j = 0;
      while (j < segs.length - 1 && x >= segs[j].x1) j++;
      for (;;) {
        const g = segs[j], sd = stopDist(v, g.c, g.k);
        if (x + sd <= g.x1 || j === segs.length - 1) {
          const st = stopTime(v, g.c, g.k);
          phases.push({ t0: t, x0: x, v0: v, c: g.c, k: g.k, si: g.si, dur: st });
          return { phases, stopX: x + sd, stopT: t + st };
        }
        const dt = slideTimeFor(g.x1 - x, v, g.c, g.k);
        phases.push({ t0: t, x0: x, v0: v, c: g.c, k: g.k, si: g.si, dur: dt });
        v = slide(dt, v, g.c, g.k).v; x = g.x1; t += dt; j++;
      }
    }
    // position (travel), speed and accel `sig` seconds after the slide began
    function planAt(plan, sig) {
      const ph = plan.phases;
      let i = 0;
      while (i < ph.length - 1 && sig >= ph[i].t0 + ph[i].dur) i++;
      const p = ph[i], m = slide(Math.min(sig - p.t0, p.dur), p.v0, p.c, p.k);
      return { d: p.x0 + m.d, v: m.v, a: m.a, si: p.si };
    }
    // seconds after the slide began at which the front reaches travel x (< stopX)
    function planTimeFor(plan, x) {
      for (const p of plan.phases) {
        const end = p.x0 + slide(p.dur, p.v0, p.c, p.k).d;
        if (x <= end) return p.t0 + slideTimeFor(x - p.x0, p.v0, p.c, p.k);
      }
      return plan.stopT;
    }
    // where the edge is once the front has travelled up to `reach` (pieces break off on the way)
    function edgeAt(sp, reach) {
      let E = sp.dist;
      for (const c of sp.crumble.slice().sort((a, b) => a.at - b.at)) if (c.at <= Math.min(reach, E)) E -= c.len;
      return E;
    }
    // Whole attempt for a spec: release after holding `tau` s. Returns the final gap (m, < 0 = fall).
    function gapS(tau, sp) {
      const h = holdS(tau, sp), plan = slidePlan(h.d, h.v, sp);
      return edgeAt(sp, plan.stopX) - plan.stopX;
    }
    function releaseS(gap, sp) {
      let lo = 0, hi = holdTimeForS(edgeAt(sp, Infinity), sp);
      for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (gapS(m, sp) > gap) lo = m; else hi = m; }
      return (lo + hi) / 2;
    }
    function sensitivityS(sp) {
      const t0 = releaseS(0, sp), h = 1e-4;
      return (gapS(t0 - h, sp) - gapS(t0 + h, sp)) / (2 * h);
    }
    // Fog and shaking make the moment harder to judge: the reference player's misjudgment grows,
    // so the target grows with it (still the same intended chance of success).
    function refFor(sp) {
      return { st: REF.st * (1 + 0.5 * sp.quake), q: REF.q, bias0: REF.bias0 * (1 + sp.fog), learned: REF.learned };
    }
    // Intended first-try success on story cliff n: the V2 curve; boss cliffs a little harder.
    function storyGoal(n, sp) { return Math.max(0.2, successGoal(n) - (sp.boss ? 0.05 : 0)); }
    // Chance that the reference player succeeds with target T (cm), aiming at the middle of the zone:
    // the real gap function is integrated over a normal timing error (exact for any twist, including
    // ground changes and a crumbling edge, where one straight-line sensitivity is not enough).
    function successProbS(T, sp, sigma) {
      const tA = releaseS(T / 200, sp), N = 120, span = 4 * sigma;
      let sum = 0, wsum = 0;
      for (let i = 0; i <= N; i++) {
        const e = -span + 2 * span * i / N, w = Math.exp(-0.5 * (e / sigma) * (e / sigma)) * (i === 0 || i === N ? 0.5 : 1);
        const g = gapS(Math.max(0, tA + e), sp) * 100;
        if (g >= 0 && g < T) sum += w;
        wsum += w;
      }
      return sum / wsum;
    }
    function roundTarget(T) { const r = T >= 10 ? Math.ceil(T) : Math.ceil(T * 2) / 2; return Math.min(100, Math.max(0.5, r)); }
    function targetS(p, sp) {
      const sigma = timingSigma(refFor(sp));
      if (!sp.patches.length && !sp.crumble.length) {
        // smooth cliffs: V2's method (the gap changes at one steady rate near the edge)
        return roundTarget(2 * sensitivityS(sp) * sigma * normInv((1 + p) / 2) * 100);
      }
      let lo = 0.5, hi = 100;
      if (successProbS(hi, sp, sigma) < p) return 100;
      for (let i = 0; i < 22; i++) { const m = (lo + hi) / 2; if (successProbS(m, sp, sigma) < p) lo = m; else hi = m; }
      return roundTarget(hi);
    }

    const WORLDS = [

      { name: 'DESERT', twist: 'Wind and sand' },
      { name: 'SNOW MOUNTAIN', twist: 'Ground changes, fog' },

      { name: 'VOLCANO', twist: 'Crumbling edge' },
    ];
    const CLIFFS = [
      // World 1: Green Hills — V2's first 5 cliffs, then the boss battle (cliffs 6-10, 5 phases):

      ...CURATED.slice(0, 5).map(c => spec(c)),
      spec(Object.assign({}, CURATED[5], { dist: 12, slope: 0.02 })), //  6 boss phase 1 (checkpoint): ice, barely tilted (1 m longer: top speed before you let go)
      spec(Object.assign({}, CURATED[6], { slope: 0.04 })),          //  7 phase 2: road
      spec(Object.assign({}, CURATED[7], { slope: 0.06 })),          //  8 phase 3: mud
      spec(Object.assign({}, CURATED[8], { slope: 0.08 })),          //  9 phase 4: long road
      spec({ si: 0, dist: 16, vmax: 8, slope: 0.1, boss: true }),    // 10 phase 5, the final hit: long steep downhill
      // World 2: Desert — wind (constant, shown by arrows and the flag) and sand. si 3 = SAND.
      spec({ si: 3, dist: 10, vmax: 7,   wind: 0.6 }),              // 11 checkpoint: the desert from the first second: sand and a visible tail wind

      spec({ si: 3, dist: 12, vmax: 8,   wind: -0.8 }),             // 14 sand with a head wind
      spec({ si: 2, dist: 11, vmax: 8,   wind: 0.8 }),              // 15 mud pushed by a tail wind
      // Boss battle (16-20): THE SANDSTORM circles you; its wind grows every phase, sand fills the air.
      spec({ si: 3, dist: 12, vmax: 7,   wind: 0.5 }),                         // 16 phase 1 (checkpoint): gentle tail wind on sand
      spec({ si: 1, dist: 12, vmax: 6.5, wind: -0.7 }),                        // 17 phase 2: ice, a head wind
      spec({ si: 0, dist: 13, vmax: 8.5, wind: 0.9, fog: 0.15 }),              // 18 phase 3: strong tail wind, sand in the air
      spec({ si: 3, dist: 13, vmax: 9,   wind: -1.0, fog: 0.2 }),              // 19 phase 4: strong head wind, fast sand
      spec({ si: 3, dist: 14, vmax: 8.5, wind: 1.2, fog: 0.3, boss: true }),   // 20 phase 5, final hit: strongest tail wind
      // World 3: Snow Mountain — the ground changes on the way (painted on the road and named on the
      // cliff face) and fog (the edge shows only when you get close; the distance counter stays).
      spec({ si: 0, dist: 11, vmax: 7, patches: [{ at: 9, si: 1 }] }),                         // 21 checkpoint: last 2 m are ice
      spec({ si: 0, dist: 12, vmax: 7.5, patches: [{ at: 8, si: 1 }, { at: 10.5, si: 0 }] }),  // 22 an ice strip in the middle

      // Boss battle (26-30): THE BLIZZARD; the sky darkens and the fog thickens every phase, night at the end.
      spec({ si: 1, dist: 12, vmax: 6, fog: 0.3, patches: [{ at: 10, si: 0 }] }),              // 26 phase 1 (checkpoint): ice to road, light fog
      spec({ si: 0, dist: 13, vmax: 8, fog: 0.45, patches: [{ at: 7, si: 1 }, { at: 10, si: 2 }] }),   // 27 phase 2: road, ice, then mud
      spec({ si: 1, dist: 13, vmax: 7, fog: 0.6 }),                                            // 28 phase 3: dusk, ice in fog
      spec({ si: 0, dist: 13, vmax: 7.5, fog: 0.7, patches: [{ at: 11, si: 1 }] }),            // 29 phase 4: dusk, road to ice, thick fog
      spec({ si: 0, dist: 14, vmax: 8.5, fog: 1.0, patches: [{ at: 10.5, si: 1 }, { at: 12.5, si: 0 }], boss: true }),   // 30 BOSS: night, thick fog, an ice strip
      // World 4: Moon — low gravity (gs 0.4): weaker grip, so the car slides much further; longer roads.
      // No wind on the Moon (no air). Earlier twists come back: slopes and ground changes.
      spec({ si: 2, dist: 14, vmax: 6,   gs: 0.4 }),                                           // 31 checkpoint: floaty mud
      spec({ si: 0, dist: 18, vmax: 6,   gs: 0.4 }),                                           // 32 road: a long, long slide
      spec({ si: 3, dist: 16, vmax: 7,   gs: 0.4 }),                                           // 33 moon sand
      spec({ si: 2, dist: 16, vmax: 7.5, gs: 0.4, slope: 0.05 }),                              // 34 crater slope
      spec({ si: 0, dist: 20, vmax: 7,   gs: 0.4, patches: [{ at: 17, si: 3 }] }),             // 35 road, then sand
      // Boss battle (36-40): THE CRATER MONSTER pulls you in; the crater slope grows every phase.
      spec({ si: 3, dist: 17, vmax: 6.5, gs: 0.4, slope: 0.02 }),                              // 36 phase 1 (checkpoint): sand, slight slope
      spec({ si: 0, dist: 22, vmax: 7.5, gs: 0.4, slope: 0.03, patches: [{ at: 19, si: 2 }] }),   // 37 phase 2: a mud strip before the edge
      spec({ si: 2, dist: 18, vmax: 8,   gs: 0.4, slope: 0.04 }),                              // 38 phase 3: steeper
      spec({ si: 0, dist: 22, vmax: 8,   gs: 0.4, slope: 0.045, patches: [{ at: 19.5, si: 1 }] }),   // 39 phase 4: icy crater rim
      spec({ si: 3, dist: 24, vmax: 8.5, gs: 0.4, slope: 0.06, patches: [{ at: 20, si: 0 }], boss: true }),   // 40 BOSS: the big crater run
      // World 5: Volcano — the edge crumbles: when the car front passes a red line on the road, the
      // cracked piece at the edge breaks off (the edge moves closer). Cracks and lines are drawn, the
      // positions are fixed. Earthquakes shake the screen (the target is sized for it).
      spec({ si: 0, dist: 11, vmax: 7,   crumble: [{ at: 9, len: 0.4 }] }),                                  // 41 checkpoint: one piece
      spec({ si: 0, dist: 12, vmax: 7.5, crumble: [{ at: 9.5, len: 0.5 }] }),                                // 42 a bigger piece
      spec({ si: 2, dist: 12, vmax: 8,   crumble: [{ at: 9.5, len: 0.4 }, { at: 10.5, len: 0.4 }] }),        // 43 two pieces on mud
      spec({ si: 0, dist: 12, vmax: 7.5, quake: 0.5 }),                                                      // 44 first earthquake
      spec({ si: 3, dist: 13, vmax: 8,   wind: 0.6, crumble: [{ at: 10, len: 0.4 }, { at: 11, len: 0.4 }] }),   // 45 hot wind, two pieces
      // Boss battle (46-50): THE ANGRY VOLCANO; it shakes harder and breaks more of the edge every phase.
      spec({ si: 0, dist: 12, vmax: 7,   quake: 0.2, crumble: [{ at: 10, len: 0.5 }] }),                     // 46 phase 1 (checkpoint)
      spec({ si: 1, dist: 13, vmax: 7,   quake: 0.3, crumble: [{ at: 10, len: 0.5 }] }),                     // 47 phase 2: ice
      spec({ si: 0, dist: 14, vmax: 8.5, quake: 0.4, slope: 0.06, crumble: [{ at: 11, len: 0.4 }, { at: 12, len: 0.4 }] }),   // 48 phase 3: downhill
      spec({ si: 2, dist: 13, vmax: 8.5, quake: 0.6, fog: 0.3, crumble: [{ at: 10, len: 0.4 }, { at: 11, len: 0.4 }] }),     // 49 phase 4: smoke, two pieces
      spec({ si: 0, dist: 15, vmax: 8.5, wind: -0.6, slope: 0.05, fog: 0.4, quake: 0.8,                      // 50 FINAL BOSS: everything at once
             patches: [{ at: 10.5, si: 1 }, { at: 12.5, si: 0 }], crumble: [{ at: 12.6, len: 0.4 }, { at: 13.6, len: 0.4 }], boss: true }),

    function worldOf(n) { return Math.min(WORLDS.length, Math.floor((n - 1) / 10) + 1); }
    // Spec for story cliff n. Worlds not built yet fall back to the seeded V2 cliffs.
    function cliffSpec(n) {
      if (n >= 1 && n <= CLIFFS.length) return spec(JSON.parse(JSON.stringify(CLIFFS[n - 1])));
      return spec(seededParams('cliff-' + n));
    }
    function storyTarget(n, sp) { return targetS(storyGoal(n, sp), sp); }

    // ---- Endless (after cliff 50): new cliffs mixing every twist, slowly harder ----
    // Each run has its own seed; cliff i of a run is the same for anyone with that seed (the
    // simulator replays it exactly). Every candidate is checked before it is used: the car can
    // always stop, crumbling lines are fair, the release is not too early and the target fits the
    // intended chance of success. Unfit candidates are skipped (not shown).
    function endlessGoal(i) { return i < 3 ? 0.6 : Math.max(0.25, 0.6 - 0.35 * Math.min(1, (i - 3) / 30)); }
    function prng(key) {
      let h = 2166136261;
      for (const ch of key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      let a = h >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
    }
    function endlessValid(sp) {
      for (const g of segments(sp)) if (!(g.c > 0.25)) return false;
      let E = sp.dist;
      for (const c of sp.crumble.slice().sort((a, b) => a.at - b.at)) { E -= c.len; if (c.at > E - 0.3) return false; }
      return releaseS(0, sp) > 0.5;
    }
    function endlessSpec(seed, i) {
      const twists = i < 3 ? 0 : i < 10 ? 1 : i < 20 ? 2 : 3;
      for (let attempt = 0; attempt < 40; attempt++) {
        const r = prng(`endless-${seed}-${i}-${attempt}`);
        const pick = arr => arr[Math.floor(r() * arr.length)];
        const o = { si: Math.floor(r() * 4), dist: Math.round((10 + r() * 4) * 10) / 10, vmax: Math.round((6 + r() * 3) * 10) / 10 };
        const pool = ['wind', 'slope', 'patch', 'crumble', 'moon', 'fog', 'quake'];
        for (let k = 0; k < twists; k++) {
          const tw = pool.splice(Math.floor(r() * pool.length), 1)[0];
          if (tw === 'wind') o.wind = Math.round((r() < 0.5 ? -1 : 1) * (0.4 + r() * 0.6) * 10) / 10;
          if (tw === 'slope') o.slope = Math.round((0.02 + r() * 0.06) * 100) / 100;
          if (tw === 'patch') o.patches = [{ at: 0, si: pick([0, 1, 2, 3].filter(x => x !== o.si)) }];
          if (tw === 'crumble') o.crumble = r() < 0.5 ? [{ at: 0, len: 0.4 }] : [{ at: 0, len: 0.4 }, { at: 0, len: 0.4 }];
          if (tw === 'moon') { o.gs = 0.4; o.dist = Math.round((16 + r() * 6) * 10) / 10; }
          if (tw === 'fog') o.fog = Math.round((0.3 + r() * 0.4) * 10) / 10;
          if (tw === 'quake') o.quake = Math.round((0.3 + r() * 0.3) * 10) / 10;
        }
        // positions near the edge are set after the distance is known
        if (o.patches) o.patches[0].at = Math.round((o.dist - (1.5 + r() * 2.5)) * 10) / 10;
        if (o.crumble) o.crumble.forEach((c, k) => { c.at = Math.round((o.dist - 2.4 + k * 1.0) * 10) / 10; });
        if (o.gs === 0.4) delete o.wind;          // no wind on the Moon
        const sp = spec(o);
        if (!endlessValid(sp)) continue;
        if (targetS(endlessGoal(i), sp) >= 100) continue;   // too touchy for a fair target
        return sp;
      }
      return spec({ si: 0, dist: 12, vmax: 7 });   // fallback: a plain road
    }
    function endlessTarget(i, sp) { return targetS(endlessGoal(i), sp); }

    return { ACCEL, SURFACES, hold, holdTimeFor, stopTime, stopDist, slide, slideTimeFor, gapAfter, releaseFor,
             sensitivity, REF, timingSigma, normInv, CURVE, successGoal, targetFor, GRADE, grade,
             seededParams, CURATED, cliffParams, cliffTarget,

             gapS, releaseS, sensitivityS, refFor, storyGoal, targetS, successProbS, endlessGoal, endlessSpec, endlessTarget, endlessValid, WORLDS, CLIFFS, worldOf, cliffSpec, storyTarget };

    document.getElementById('sheet-text').textContent = body;
    const box = document.getElementById('sheet-actions');
    box.textContent = '';
    actions.forEach(a => {
      const el = document.createElement(a.href ? 'a' : 'button');
      el.className = 'sheet-btn' + (a.primary ? ' primary' : '');
      el.textContent = a.label;
      if (a.href) { el.href = a.href; if (a.newTab) { el.target = '_blank'; el.rel = 'noopener'; } }
      else el.type = 'button';
      if (a.onClick) el.addEventListener('click', () => a.onClick(el));
      box.appendChild(el);
    });
    sheetEl.hidden = false;
  }
  function closeSheet() { sheetEl.hidden = true; }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
  sheetEl.addEventListener('pointerdown', e => e.stopPropagation());
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetEl.hidden) closeSheet(); });

  // Copy that also works inside in-app browsers, where the newer clipboard call is often blocked.
  function copyText(str) {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = str; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, str.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) {}
    if (!ok) { try { navigator.clipboard.writeText(str); ok = true; } catch (e) {} }
    return ok;
  }
  function copyAction(label, str, primary = true) {
    return { label, primary, onClick: el => {
      el.textContent = copyText(str) ? 'Copied! Paste it in the chat' : 'Copy failed. Press and hold the link';
    } };
  }
  function challengeSheet(msg, url) {
    const full = msg + ' ' + url;
    openSheet('Challenge a friend',
      'Send this to a friend. They play the same cliff and try to beat you.',
      [
        copyAction('Copy link', full),
        { label: 'WhatsApp', href: 'https://wa.me/?text=' + encodeURIComponent(full), newTab: true },
        { label: 'Telegram', href: 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(msg), newTab: true },
      ]);
  }
  function isAndroid() { return /Android/i.test(navigator.userAgent || ''); }
  // Android only: a link that hands this page to Chrome (documented Chrome intent link).
  function chromeIntentUrl() {
    const u = new URL(GAME_URL);
    return 'intent://' + u.host + u.pathname + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(GAME_URL) + ';end';
  }
  function clipSheet() {
    if (isAndroid()) {
      openSheet('Share your clip',
        "This app's browser can't share videos. Open the game in Chrome, play a round, then tap SHARE CLIP.",
        [
          { label: 'Open in Chrome', href: chromeIntentUrl(), primary: true },
          copyAction('Copy game link', GAME_URL, false),
        ]);
    } else {
      openSheet('Share your clip',
        "This app's browser can't share videos. Tap the ••• or share icon, choose Open in Safari, play a round, then tap SHARE CLIP.",
        [copyAction('Copy game link', GAME_URL)]);
    }
  }

  function doChallenge() {
    Track.send('challenge', s.daily ? -1 : s.cliff);
    const url = challengeUrl(), msg = challengeText();
    if (navigator.share) {
      navigator.share({ title: 'Cliff Edge', text: msg, url }).catch(err => {
        if (err && err.name === 'AbortError') return;   // player closed the share menu
        challengeSheet(msg, url);
      });
    } else {
      challengeSheet(msg, url);
    }
  }
  function showToast(msg, ms = 2600) { toast = { msg, until: performance.now() + ms }; }

  // Must run inside a tap (pointerup) so phones allow the share sheet.
  const GAME_URL = 'https://waeel1899464.github.io/cliff-edge/';
  function doShare() {
    Track.send('share_clip', s.cliff);
    const round = s;
    Rec.finish(round.id, blob => shareClip(blob, round));
  }
  function shareClip(blob, round) {
    const s = round;
    const ext = blob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const label = s.result !== null ? s.result.toFixed(1).replace('.', '_') + 'cm' : 'fall';
    const file = new File([blob], `cliff-edge-${label}.${ext}`, { type: blob.type });
    const msg = s.result !== null
      ? `I stopped ${fmt(s.result)} from the edge! Can you get closer? ${GAME_URL}`
      : `My car flew off the cliff 😂 Can you stop closer to the edge? ${GAME_URL}`;
    if (claudeDownloads) {
      claudeDownloads.save({ filename: file.name, data: blob })
        .then(() => showToast('Saved! Sharing opens on the public link'))
        .catch(err => { if (!err || err.code !== 'declined') showToast('Could not save the video'); });
      return;
    }
    // Video only, no text: apps like Messenger keep the text and drop the video when both are sent.
    // The game link is drawn inside the video instead.
    const shareFile = () => navigator.share({ files: [file] });
    let why = 'no-share';
    if (navigator.share) {
      let ok = false;
      if (navigator.canShare) { try { ok = navigator.canShare({ files: [file] }); } catch (e) {} }
      else ok = true;   // older browsers: no canShare, just try
      why = ok ? '' : 'no-video-share';
      if (ok) {
        shareFile().catch(err => {
          // AbortError = the player closed the share menu.
          if (err && err.name === 'AbortError') return;
          if (err && err.name === 'NotAllowedError') { showToast('Tap SHARE CLIP again'); return; }
          if (inAppBrowser()) { clipSheet(); return; }
          saveFile(blob, file.name); explainSave('no-video-share');
        });
        return;
      }
    }
    // In-app browsers can't share or save videos: offer the way out to Chrome / Safari.
    if (inAppBrowser() && window.top === window) { clipSheet(); return; }
    // Other browsers: save the video file and say why sharing was not possible.
    saveFile(blob, file.name);
    explainSave(why);
  }

  // "All worlds completed!" card (web build only: the platform build has no external sharing)
  const CARD_BTN = { x: W / 2, y: 610, w: 240, h: 52 };
  let pendingCard = false;
  function cardVisible() { return !IS_PORTAL && s.allDone && s.state === 'stopped'; }
  function shareCard() {
    let total = 0; for (const k in stars) total += stars[k];
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#2a1f5c'); bg.addColorStop(0.65, '#ff7a59'); bg.addColorStop(1, '#ffb36b');
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
    const t = (str, y, size, col) => { g.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; g.textAlign = 'center'; g.lineWidth = size * 0.16; g.strokeStyle = 'rgba(10,10,25,0.85)'; g.strokeText(str, 540, y); g.fillStyle = col; g.fillText(str, 540, y); };
    t('CLIFF EDGE', 180, 110, '#ffd23f');
    t('ALL 5 WORLDS', 420, 96, '#ffffff');
    t('COMPLETED!', 530, 96, '#ffffff');
    t(`★ ${total} / 150 STARS`, 680, 64, '#ffd23f');
    t('Can you beat all 5 bosses?', 820, 44, '#fff3c4');
    t(GAME_URL.replace('https://', ''), 960, 36, '#ffffff');
    Track.send('share_card', total);
    c.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], 'cliff-edge-all-worlds.png', { type: 'image/png' });
      let ok = false;
      if (navigator.share && navigator.canShare) { try { ok = navigator.canShare({ files: [file] }); } catch (e) {} }
      if (ok) navigator.share({ files: [file], text: `I beat all 5 worlds of Cliff Edge! ${GAME_URL}` }).catch(() => {});
      else { saveFile(blob, file.name); showToast('Card saved'); }
    }, 'image/png');
  }
  function saveFile(blob, name) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
    } catch (e) {}
  }

  // Links opened inside TikTok, Instagram, Facebook, WhatsApp etc. run in a built-in browser that cannot share files.
  function inAppBrowser() {
    const ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|Bytedance|Snapchat|Line\/|WhatsApp|Telegram|; wv\)/i.test(ua);
  }

  function explainSave(why) {
    if (window.top !== window) showToast('Video saved\nSharing works on the public link');
    else if (inAppBrowser()) showToast('Video saved\nTo share, open this page in Chrome', 5000);
    else if (why === 'no-video-share') showToast('Video saved\nThis browser can\'t share videos. Try Chrome', 5000);
    else showToast('Video saved\nThis browser can\'t share. Try Chrome', 5000);
  }

  // ---------- Helpers ----------
  const edgeM = EDGE_X / PPM;
  const rand = (a, b) => a + Math.random() * (b - a);
  function frontX() { return s.x + CAR_LEN; }

  function puff(x, y, n, color, spread, up, size, life) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: rand(-spread, spread), vy: -rand(up * 0.4, up), life: rand(life * 0.6, life), t: 0, r: rand(size * 0.5, size), color, g: 500 });
    }
  }

  function spawnDust(n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: s.x * PPM + 8 + Math.random() * 6, y: GROUND_Y - 2,
        vx: -(20 + Math.random() * 40) + s.v * 6, vy: -(15 + Math.random() * 45),
        life: 0.45 + Math.random() * 0.3, t: 0, r: 2 + Math.random() * 3,
        color: s.surfNow.dust, g: 80, grow: true,
      });
    }
  }

  // Break the car into pieces that tumble down the cliff.
  // A missed cliff: lose a heart and retry it; with no hearts left, go back to the checkpoint.
  function missCliff() {
    s.missed = true;
    addFail(s.cliff);
    // The last heart is about to go: offer a rescue first (story mode only). Nothing changes until the
    // player chooses: "Save me!" keeps the heart; any other tap (or 3 seconds) goes back as usual.
    if (hearts <= 1 && rescueAllowed()) { s.rescue = { state: 'offer', t0: performance.now() }; s.heartsLeft = 0; return; }   // shown at once
    applyMiss();
  }
  function endRun() {
    s.runOver = true; s.missed = true; s.runScore = endless.score;
    Track.send('endless_run', endless.score);      // web build only
  }
  function applyMiss() {
    hearts--;
    if (hearts <= 0) { cliff = checkpoint; hearts = baseHearts(checkpoint); s.backTo = checkpoint; }
    s.heartsLeft = hearts;
    saveProgress();
  }

  function rememberTry(stopped) {
    lastTry = { key: s.layoutKey, release: s.releaseFront, stop: stopped ? frontX() : null };
  }

  // The first fall of a session plays in full; later ones are shorter (less slow motion, quicker
  // end), so retrying after many falls never feels slow. Tapping to retry works during the fall.
  let fallsThisSession = 0;
  const FALL_FULL = { slow: 0.45, end: 0.9 }, FALL_SHORT = { slow: 0.2, end: 0.45 };
  function startFall() {
    rememberTry(false);
    fallsThisSession++;
    s.fallTiming = fallsThisSession === 1 ? FALL_FULL : FALL_SHORT;
    if (s.endless) endRun(); else if (!s.friend && !s.daily) { if (s.replay) { s.missed = true; addFail(s.cliff); } else missCliff(); }
    s.state = 'falling';
    s.endAt = performance.now();
    s.fallT = 0;
    const len = CAR_LEN * PPM;
    const cx = s.x * PPM + len / 2;
    const bodyY = GROUND_Y - WHEEL_R - CAR_H / 2 - 2;
    const vx = Math.max(s.v, 1.4) * PPM;
    s.parts = [
      cx < edgePx() + 12
        // Slow: the body tips forward over the edge before it drops.
        ? { kind: 'body', x: cx, y: bodyY, vx, vy: 0, rot: s.tilt, vrot: 1.5, r: 12, tipping: true }
        : { kind: 'body', x: cx, y: bodyY, vx, vy: -60, rot: s.tilt, vrot: 3 + s.v * 0.5, r: 12 },
      { kind: 'wheel', x: cx - len / 2 + 11, y: GROUND_Y - WHEEL_R, vx: vx + rand(-80, 40), vy: -rand(180, 320), rot: 0, vrot: rand(-14, 14), r: WHEEL_R },
      { kind: 'wheel', x: cx + len / 2 - 11, y: GROUND_Y - WHEEL_R, vx: vx + rand(20, 140), vy: -rand(220, 380), rot: 0, vrot: rand(-14, 14), r: WHEEL_R },
    ];
    s.fallMsg = s.v < 1.5 ? 'SO CLOSE!' : ['NOOOO!', 'BYE BYE!', 'OOPS!', 'SPLASH!'][Math.floor(Math.random() * 4)];
    puff(edgePx(), GROUND_Y, 10, s.surface.dust, 90, 160, 4, 0.6);
    Sound.scream();
    Sound.pop();
  }

  // what the car lands in: water, Moon dust, or lava sparks
  function splashColors() {
    if (s.daily || s.friend) return ['#e8f6ff', '#5fa8ff'];
    return s.world === 4 ? ['#c9ccd8', '#8a8ea3'] : s.world === 5 ? ['#ffd23f', '#ff6a1a'] : ['#e8f6ff', '#5fa8ff'];
  }
  function updateFall(dt) {
    s.fallT += dt;
    const ex = edgePx();
    for (const p of s.parts) {
      if (p.tipping) {
        p.vx += 250 * dt; p.vrot += 10 * dt;
        p.x += p.vx * dt; p.rot += p.vrot * dt;
        p.y += p.vx * dt * Math.sin(Math.max(0, p.rot)) * 0.6;
        if (p.x > ex + p.r) { p.tipping = false; p.vy = p.vx * Math.sin(Math.max(0, p.rot)); }
        continue;
      }
      if (p.inWater) {
        p.vx *= Math.pow(0.2, dt);
        p.vy += (35 - p.vy) * Math.min(1, dt * 3);   // sink slowly
        p.vrot *= Math.pow(0.3, dt);
      } else {
        p.vy += G_PX * (s.spec.gs || 1) * dt;     // the Moon: a slow, floaty fall
      }
      const prevY = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;

      // Bounce off the cliff top (wheels that hop backwards)
      if (!p.inWater && p.kind === 'wheel' && p.x < ex && prevY + p.r <= GROUND_Y && p.y + p.r > GROUND_Y) {
        p.y = GROUND_Y - p.r; p.vy = -Math.abs(p.vy) * 0.45; p.vx *= 0.7;
      }
      // Bounce off the cliff wall
      if (!p.inWater && p.y + p.r > GROUND_Y && p.x - p.r < ex && prevY + p.r > GROUND_Y) {
        p.x = ex + p.r; p.vx = Math.abs(p.vx) * 0.5 + 30; p.vrot *= -0.7;
        puff(ex, p.y, 5, s.surface.dust, 60, 80, 3, 0.5);
      }
      // Hit the sea
      if (!p.inWater && p.y > WATER_Y) {
        p.inWater = true;
        p.vy *= 0.15;
        const big = p.kind === 'body';
        const sc = splashColors();
        puff(p.x, WATER_Y, big ? 26 : 8, sc[0], big ? 140 : 60, big ? 420 : 220, big ? 6 : 4, 0.9);
        puff(p.x, WATER_Y, big ? 14 : 4, sc[1], big ? 110 : 50, big ? 320 : 160, big ? 5 : 3, 0.8);
        if (big) { shake = 14; s.splashed = true; s.splashAt = s.fallT; Sound.splash(); }
      }
    }
    if (s.splashed && s.fallT - s.splashAt > s.fallTiming.end) s.state = 'fell';
    if (!s.rescue || s.rescue.state === 'offer') (s.rec = s.rec || []).push(s.parts.map(p => [p.x, p.y, p.rot]));
  }

  // ---------- Update ----------
  function update(rawDt, now) {
    if (now === undefined) now = performance.now();
    // Slow motion for the first moment of a fall: the dramatic part.
    let dt = rawDt;
    if (s.state === 'falling' && s.fallT < s.fallTiming.slow) dt = rawDt * 0.3;

    if (s.state === 'holding' || s.state === 'sliding') {
      // Over the edge? Place the car exactly where it crossed, at its speed then.
      const over = now >= s.crossAt;
      const m = motionAt(over ? s.crossAt : s.state === 'sliding' ? Math.min(now, s.stopAt) : now);
      // A release that arrives late (busy phone) is still applied at its real time; the drawn car
      // just never steps backwards while it catches up with the exact slide.
      s.x = s.state === 'sliding' ? Math.max(s.x, s.x0 + m.d) : s.x0 + m.d; s.v = m.v; s.a = m.a;
      s.surfNow = surfaceAt(travel());
      if (s.spec.crumble.length) {
        const n = fallenPieces();
        while ((s.fallen || 0) < n) {
          const E0 = Physics.edgeAt(s.spec, s.spec.crumble.slice().sort((a, b) => a.at - b.at)[s.fallen || 0].at - 1e-9);
          const len = s.spec.crumble.slice().sort((a, b) => a.at - b.at)[s.fallen || 0].len;
          const x1 = EDGE_X - (s.dist - E0) * PPM, w = len * PPM;
          (s.rocks = s.rocks || []).push({ x: x1 - w / 2, y: GROUND_Y + 30, w, h: 60, vx: 25, vy: -30, rot: 0, vr: 1.2 });
          puff(x1 - w / 2, GROUND_Y, 14, s.surface.dust, 80, 140, 4, 0.7);
          shake = Math.max(shake, 6); Sound.pop();
          s.fallen = (s.fallen || 0) + 1;
        }
      }
      if (s.state === 'sliding' && s.v > 0.4 && Math.random() < 0.9) spawnDust(Math.random() < s.v / 6 ? 2 : 1);
      if (over) {
        startFall();
      } else if (s.state === 'sliding' && now >= s.stopAt) {
        s.v = 0; s.a = 0;
        s.x = s.x0 + s.plan.stopX;                    // front exactly where the slide ends
        s.state = 'stopped';
        s.endAt = performance.now();
        s.result = s.gap * 100;                       // centimeters, decided at the release moment
        rememberTry(true);
        if (s.friend) { s.friendWin = s.friend.score === null || s.result < s.friend.score; if (s.friendWin) s.friend.won = true; }
        if (best === null || s.result < best) { best = s.result; save('cliff_best', best); s.newBest = true; }
        if (s.daily) {
          // The round belongs to the day it was made for; after midnight it no longer changes the new day.
          const d = loadJSON('cliff_daily') || getDaily();
          if (d.day === s.dailyDay && (d.best === null || s.result < d.best)) { d.best = s.result; s.newDailyBest = true; saveJSON('cliff_daily', d); }
        } else if (s.endless) {
          if (s.result < s.target) {
            s.cleared = true; s.grade = Physics.grade(s.result, s.target);
            s.coinsWon = coinReward(s.result, s.target, s.grade); coins += s.coinsWon; save('cliff_coins', coins);
            endless.i++; endless.score++;
            if (endless.score > endlessBest) { endlessBest = endless.score; save('cliff_endless_best', endlessBest); s.newEndlessBest = true; }
            puff(EDGE_X - 30, GROUND_Y - 40, 30, '#ffd23f', 160, 380, 5, 1.1);
          } else endRun();
        } else if (!s.friend) {
          if (s.result < s.target) {
            s.cleared = true;
            s.grade = Physics.grade(s.result, s.target);
            s.stars = STAR_OF[s.grade];
            if (s.stars > (stars[s.cliff] || 0)) { stars[s.cliff] = s.stars; s.newStars = true; saveJSON('cliff_stars', stars); }
            s.coinsWon = coinReward(s.result, s.target, s.grade);
            stuck = { n: 0, fails: 0 }; saveJSON('cliff_stuck', stuck);
            coins += s.coinsWon; save('cliff_coins', coins);
            if (!s.replay) {
              Track.send('cliff_pass', s.cliff);      // web build only: where players get through (and where they stop)
              if (s.spec.boss) s.worldDone = true;
              if (s.spec.boss && s.world === 5 && !storyDone()) { s.allDone = true; Track.send('all_worlds', roundsPlayed); }
              cliff++;
              if (s.stars === 3 && hearts < maxHearts(cliff)) { hearts++; s.heartWon = true; }   // golden heart: reward for skill
              if (isCheckpoint(cliff)) { checkpoint = cliff; hearts = Math.min(maxHearts(cliff), Math.max(hearts, baseHearts(cliff))); s.newCp = true; }
              if (inArena(cliff) && arenaPhase(cliff) === 1) s.bossStart = true;
              if (cliff > bestCliff) { bestCliff = cliff; s.newBestCliff = true; }
              saveProgress();
            }
            puff(EDGE_X - 30, GROUND_Y - 40, 30, '#ffd23f', 160, 380, 5, 1.1);
            puff(EDGE_X - 30, GROUND_Y - 40, 20, '#ff4f7b', 160, 380, 4, 1.1);
          } else if (s.replay) {
            s.missed = true;
            addFail(s.cliff);
          } else {
            missCliff();
          }
        }
        if (s.missed) Sound.fail();                     // stopped short of the target: a clear "no"
        else {
          if (s.cleared || s.friendWin || s.newDailyBest) Sound.fanfare();
          if (s.grade === 'GREAT') Sound.great();
          if (s.worldDone) { Sound.great(); puff(EDGE_X - 60, GROUND_Y - 60, 40, '#7ef9ff', 220, 480, 5, 1.4); puff(EDGE_X - 60, GROUND_Y - 60, 30, '#ffffff', 220, 480, 4, 1.4); }
          if (s.grade === 'PERFECT') { Sound.perfect(); puff(EDGE_X - 30, GROUND_Y - 40, 18, '#ffffff', 190, 430, 4, 1.3); }
          if (!s.cleared && !s.friendWin && !s.newDailyBest) { if (s.newBest || s.result < 10) Sound.ding(); else Sound.bloop(); }
        }
      }
    } else if ((s.state === 'falling' || s.state === 'fell') && !(s.rescue && s.rescue.state === 'anim')) {
      updateFall(dt);
    }
    // rescue: 3-second offer once the round has ended, then the chosen animation
    if (s.rescue) {
      const R = s.rescue;
      if (R.state === 'offer') {
        if (R.t0 !== null && now - R.t0 > 3000) declineRescue();
      } else if (R.state === 'anim' && R.kind === 'rewind' && !s.parts) {
        const k = Math.min(1, (now - R.t0) / (R.dur * 1000));
        s.x = R.stopX + (s.x0 - R.stopX) * (k * k * (3 - 2 * k));
      }
      if (R.state === 'anim' && now - R.t0 > R.dur * 1000) {
        R.state = 'done';
        newRound();                       // same cliff, the heart is kept
      }
    }

    // Body pitch spring
    const targetTilt = (s.state === 'holding' || s.state === 'sliding') ? -s.a * 0.012 : 0;
    s.tiltV += ((targetTilt - s.tilt) * 120 - s.tiltV * 9) * dt;
    s.tilt += s.tiltV * dt;

    // Character springs: googly pupil lags behind motion, antenna wobbles, body squashes.
    const moving = s.state === 'holding' || s.state === 'sliding';
    const ax = moving ? -s.a : 0;
    const eyeTX = moving ? Math.max(-6, Math.min(6, ax * 0.7 + 2)) : (s.state === 'stopped' ? 3 : 1.5);
    const eyeTY = s.state === 'stopped' && gapNow() < 1 ? 3 : 0;
    s.eyeV += ((eyeTX - s.eyeX) * 260 - s.eyeV * 11) * dt; s.eyeX += s.eyeV * dt;
    s.eyeYV += ((eyeTY - s.eyeY) * 260 - s.eyeYV * 11) * dt; s.eyeY += s.eyeYV * dt;
    if (s.parts) s.antV += rand(-60, 60) * dt * 10;
    s.antV += ((Math.max(-0.9, Math.min(0.9, ax * 0.07)) - s.ant) * 90 - s.antV * 3.5) * dt; s.ant += s.antV * dt;
    const sqT = moving ? Math.max(-0.12, Math.min(0.12, s.a * 0.012)) : 0;
    s.sqV += ((sqT - s.sq) * 160 - s.sqV * 8) * dt; s.sq += s.sqV * dt;

    // Pieces of the edge falling into the lava
    if (s.rocks) for (const r of s.rocks) { r.vy += G_PX * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; }
    // quake: the screen keeps shaking while you drive
    if (s.spec.quake && (s.state === 'holding' || s.state === 'sliding') && !s.daily) shake = Math.max(shake, 3 * s.spec.quake);
    // Particles
    for (const p of particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    }
    particles = particles.filter(p => p.t < p.life);
    shake *= Math.pow(0.02, rawDt);

    // Camera: zoom toward the edge when close; pull back to show the fall.
    // Long roads: zoom out just enough that the whole car stays on screen (V2 roads keep zoom 1).
    const rearPx = s.x * PPM;
    const zFar = rearPx < 12 ? Math.max(0.36, (CAM_ANCHOR_X - 12) / (CAM_ANCHOR_X - rearPx)) : 1;
    let zt = zFar, ft = CAM_ANCHOR_X, fyt = GROUND_Y;
    if (s.rescue && s.rescue.state === 'anim' && s.rescue.kind !== 'rewind') {
      zt = 1; ft = CAM_ANCHOR_X; fyt = GROUND_Y;          // the whole scene: cliff, sea and the rescue
    } else if (s.parts) {
      // Follow the falling body down to the splash, zoomed in.
      const b = s.parts[0];
      zt = 2;
      ft = CAM_ANCHOR_X + (b.x - CAM_ANCHOR_X);
      fyt = Math.min(b.y, WATER_Y - 40);
    } else if (s.state === 'sliding' || s.state === 'stopped') {
      const d = gapNow();
      const near = Math.max(0, Math.min(1, 1 - d / 3));
      zt = zFar + (3 - zFar) * near * near;
      const focus = (frontX() * PPM + EDGE_X) / 2;
      ft = CAM_ANCHOR_X + (focus - CAM_ANCHOR_X) * near;
    }
    const ease = 1 - Math.exp(-rawDt * (s.parts ? 6 : 5));
    cam.z += (zt - cam.z) * ease;
    cam.fx += (ft - cam.fx) * ease;
    cam.fy += (fyt - cam.fy) * ease;
  }

  // ---------- Draw ----------
  function fmt(cm) {
    if (cm < 100) return cm.toFixed(1) + ' cm';
    return (cm / 100).toFixed(2) + ' m';
  }
  function fmtTarget(cm) { return cm >= 100 ? (cm / 100) + ' m' : (cm >= 10 ? Math.round(cm) : cm.toFixed(1)) + ' cm'; }

  function text(str, x, y, size, color, weight = 800, align = 'center') {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = size * 0.18;
    ctx.strokeStyle = 'rgba(10,10,25,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawWheel(x, y, rot, r) {
    if (artReady('wheel')) {
      const R = r || (CAR_ART ? CAR_ART.r : WHEEL_R);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.drawImage(ART.wheel, -R, -R, R * 2, R * 2);
      ctx.restore();
      return;
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#1b1d2b';
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a8fa8';
    ctx.fillRect(-1.5, -WHEEL_R + 2, 3, WHEEL_R - 2);
    ctx.restore();
  }

  // Body centered on (0,0). mood: 'calm' | 'scared' | 'scream' | 'happy'
  // The character: a jelly-bean car with one big googly eye and a wobbly antenna.
  // mood: 'calm' | 'determined' | 'scared' | 'happy' | 'scream'
  function drawBody(braking, mood) {
    const len = CAR_LEN * PPM, h = CAR_H;
    const sq = s.sq || 0;
    ctx.save();
    ctx.scale(1 + sq, 1 - sq);

    const A = carArt();
    // antenna (springy) with a glowing ball
    ctx.save();
    ctx.translate(-8, A ? A.top + 1 : -h / 2 - 14);
    ctx.rotate(s.ant || 0);
    ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.stroke();
    ctx.fillStyle = skin.ball;
    ctx.beginPath(); ctx.arc(0, -18, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-1.5, -19.5, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (A) {
      ctx.drawImage(ART.car, A.x, A.top, A.w, A.h);
      if (braking) {                                   // brake light at the back of the picture
        ctx.fillStyle = '#ff1f3d'; ctx.shadowColor = '#ff1f3d'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.roundRect(A.x - 1, A.top + A.h * 0.52, 4, 6, 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // the same face, smaller, looking out of the side window
      ctx.save(); ctx.translate(A.face.x, A.face.y); ctx.scale(A.face.k, A.face.k); ctx.translate(-13, 0);
      drawFace(mood, '#f07ba3');
      ctx.restore();
      ctx.restore();
      return;
    }

    // roof dome
    ctx.fillStyle = skin.roof;
    ctx.beginPath(); ctx.roundRect(-len / 2 + 5, -h / 2 - 15, len * 0.52, 20, [10, 10, 2, 2]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.roundRect(-len / 2 + 9, -h / 2 - 12, 6, 9, 3); ctx.fill();

    // body: bean shape with a darker belly
    ctx.save();
    ctx.beginPath(); ctx.roundRect(-len / 2, -h / 2, len, h, 12);
    ctx.fillStyle = skin.body; ctx.fill();
    ctx.clip();
    ctx.fillStyle = skin.shade;
    ctx.fillRect(-len / 2, h / 2 - 7, len, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-len / 2 + 6, -h / 2 + 3, len * 0.35, 3);
    ctx.restore();

    // brake light
    ctx.fillStyle = braking ? '#ff1f3d' : '#7a2236';
    if (braking) { ctx.shadowColor = '#ff1f3d'; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.roundRect(-len / 2 - 2, -h / 2 + 5, 5, 8, 2); ctx.fill();
    ctx.shadowBlur = 0;

    drawFace(mood, skin.body);
    ctx.restore();
  }

  // The face (cheek, eye, eyebrow, mouth, sweat) around (13, 0). lid = body colour for the sad eyelid.
  function drawFace(mood, lid) {
    // cheek
    ctx.fillStyle = 'rgba(255,150,170,0.75)';
    ctx.beginPath(); ctx.ellipse(4, 6, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();

    // eye
    const ex = 13, ey = -4;
    const er = mood === 'scream' ? 12.5 : mood === 'scared' ? 11.5 : 10;
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b2d42';
    if (mood === 'happy') {
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey + 4, 6.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (mood === 'sad') {
      // looking down, heavy eyelid, and a tear
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#12141f'; ctx.beginPath(); ctx.arc(ex - 1, ey + 4, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lid; ctx.beginPath(); ctx.arc(ex, ey, er + 1, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ex - er, ey); ctx.lineTo(ex + er, ey); ctx.stroke();
      ctx.fillStyle = '#7fd4ff'; ctx.beginPath(); ctx.moveTo(ex + 6, ey + 9); ctx.quadraticCurveTo(ex + 10, ey + 15, ex + 6, ey + 17); ctx.quadraticCurveTo(ex + 2, ey + 15, ex + 6, ey + 9); ctx.fill();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      let px = s.eyeX || 0, py = s.eyeY || 0;
      if (mood === 'scream') { px = rand(-4, 4); py = rand(-4, 4); }
      const pr = mood === 'calm' || mood === 'determined' ? 4.8 : 3.2;
      const lim = er - pr - 1.5;
      const m = Math.hypot(px, py); if (m > lim) { px *= lim / m; py *= lim / m; }
      ctx.fillStyle = '#12141f';
      ctx.beginPath(); ctx.arc(ex + px, ey + py, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex + px - 1.4, ey + py - 1.6, 1.3, 0, Math.PI * 2); ctx.fill();
    }

    // eyebrow
    ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    if (mood === 'determined') { ctx.moveTo(5, -17); ctx.lineTo(20, -13); }
    else if (mood === 'scared' || mood === 'scream') { ctx.moveTo(5, -18); ctx.quadraticCurveTo(12, -24, 21, -19); }
    else if (mood === 'happy') { ctx.moveTo(6, -14); ctx.quadraticCurveTo(13, -19, 20, -14); }
    else if (mood === 'sad') { ctx.moveTo(6, -19); ctx.lineTo(20, -14); }
    else { ctx.moveTo(6, -16); ctx.lineTo(20, -16); }
    ctx.stroke();

    // mouth
    ctx.fillStyle = '#5a0f22'; ctx.strokeStyle = '#5a0f22'; ctx.lineWidth = 2.2;
    const mx = 17, my = 8;
    ctx.beginPath();
    if (mood === 'scream') { ctx.ellipse(mx, my + 1, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (mood === 'scared') { ctx.ellipse(mx, my, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (mood === 'happy') { ctx.arc(mx, my - 1, 5, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill(); }
    else if (mood === 'determined') { ctx.moveTo(mx - 4, my); ctx.lineTo(mx + 3, my - 1); ctx.stroke(); }
    else if (mood === 'sad') { ctx.arc(mx, my + 4, 4, Math.PI + 0.35, Math.PI * 2 - 0.35); ctx.stroke(); }
    else { ctx.arc(mx, my - 3, 4, 0.3, Math.PI - 0.3); ctx.stroke(); }

    // sweat drop when scared
    if (mood === 'scared') {
      ctx.fillStyle = '#7fd4ff';
      ctx.beginPath();
      ctx.moveTo(-1, -22); ctx.quadraticCurveTo(3, -16, -1, -14); ctx.quadraticCurveTo(-5, -16, -1, -22);
      ctx.fill();
    }
  }

  function carMood() {
    const d = gapNow();
    if (s.state === 'holding') return 'determined';
    if (s.state === 'stopped') return s.missed && !s.daily && !s.friend ? 'sad' : s.result < 10 ? 'happy' : d < 1 ? 'scared' : 'calm';
    if (s.state === 'sliding') return d < 1.2 ? 'scared' : 'determined';
    return 'calm';
  }

  function drawCar() {
    const len = CAR_LEN * PPM;
    const cx = s.x * PPM + len / 2;
    const braking = s.state === 'sliding' && s.v > 0;

    ctx.save();
    ctx.translate(cx, GROUND_Y - WHEEL_R);
    const A = carArt();
    if (A) for (const wx of A.wheels) drawWheel(wx, A.wy, s.x * PPM / A.r, A.r);
    else {
      drawWheel(-len / 2 + 11, 0, s.x * PPM / WHEEL_R, WHEEL_R);
      drawWheel(len / 2 - 11, 0, s.x * PPM / WHEEL_R, WHEEL_R);
    }
    ctx.rotate(s.tilt);
    if (s.state === 'stopped' && s.missed) {          // "no, no": a short head shake after a short stop
      const k = (performance.now() - s.endAt) / 700;
      if (k < 1) ctx.rotate(Math.sin(k * Math.PI * 6) * 0.07 * (1 - k));
    }
    ctx.translate(0, -CAR_H / 2 - 2);
    drawBody(braking, carMood());
    ctx.restore();
  }

  // Buttons pop in once when the round ends, then stay still.
  function drawButton(b, label, fill, ink, size, icon) {
    if (shareShownFor !== s.id) { shareShownFor = s.id; shareShownAt = performance.now(); }
    const k = Math.min(1, (performance.now() - shareShownAt) / 180);
    const pop = 0.85 + 0.15 * (1 - Math.pow(1 - k, 3)) + Math.sin(k * Math.PI) * 0.05;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(pop, pop);
    ctx.fillStyle = 'rgba(10,10,25,0.45)';
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2 + 5, b.w, b.h, b.h / 2); ctx.fill();
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
    ctx.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width;
    const ix = -tw / 2 - 8;
    ctx.fillStyle = ink;
    if (icon === 'play') {
      ctx.beginPath(); ctx.moveTo(ix - 16, -10); ctx.lineTo(ix - 16, 10); ctx.lineTo(ix, 0); ctx.closePath(); ctx.fill();
    } else if (icon === 'flag') {
      ctx.fillRect(ix - 16, -13, 3, 26);
      ctx.beginPath(); ctx.moveTo(ix - 13, -13); ctx.lineTo(ix + 3, -7); ctx.lineTo(ix - 13, -1); ctx.closePath(); ctx.fill();
    }
    ctx.fillText(label, 12, 1);
    ctx.restore();
  }
  function drawShareBtn() { drawButton(SHARE_BTN, 'SHARE CLIP', '#ffffff', '#12141f', 22, 'play'); }
  function drawChallengeBtn() { drawButton(CHALLENGE_BTN, 'CHALLENGE A FRIEND', '#ffd23f', '#12141f', 26, 'flag'); }

  // Hearts row; `lost` also shows the spent hearts as empty outlines.
  function drawHearts(cx, cy, n, lost) {
    const base = baseHearts(s.cliff), total = Math.min(base + 1, Math.max(base, n)), gap = 40, x0 = cx - (total - 1) * gap / 2;
    for (let i = 0; i < total; i++) {
      const full = i < n;
      ctx.save(); ctx.translate(x0 + i * gap, cy + 2); ctx.scale(1.6, 1.6);
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-12, -2, -8, -12, 0, -6);
      ctx.bezierCurveTo(8, -12, 12, -2, 0, 6);
      ctx.closePath();
      ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(10,10,25,0.75)'; ctx.stroke();
      ctx.fillStyle = full ? (i >= base ? '#ffd23f' : '#ff4f7b') : 'rgba(255,255,255,0.18)';
      ctx.fill();
      ctx.restore();
    }
  }

  // Bottom line on end screens.
  function endHint(runText, friendText) {
    if (s.friend) return friendText;
    if (s.daily) {
      const left = dailyLeft();
      return left > 0 ? `TAP TO TRY AGAIN · ${left} LEFT` : `NEXT DAILY IN ${nextDailyIn()}`;
    }
    return runText;
  }

  // "DAILY" pill on the home screen (top right, next to the sound button).
  const DAILY_PILL = { x: W - 150, y: 50, w: 132, h: 42 };
  function pillVisible() { return s.state === 'ready' && !s.friend; }
  function toggleDaily() {
    if (s.daily) { mode = 'run'; newRound(); return; }
    if (dailyLeft() > 0) { mode = 'daily'; newRound(); }
    else showToast('Daily done for today\nNext one in ' + nextDailyIn(), 3000);
  }
  function drawDailyPill() {
    const b = DAILY_PILL, streak = getStreak();
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = s.daily ? 'rgba(255,255,255,0.9)' : 'rgba(10,10,25,0.4)';
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
    ctx.font = '900 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s.daily ? '#12141f' : '#ffffff';
    const label = s.daily ? '✕ EXIT DAILY' : (streak > 0 ? `DAILY 🔥${streak}` : 'DAILY');
    ctx.fillText(label, 0, 1);
    // red dot: today's daily not played yet
    if (!s.daily && getDaily().tries === 0) {
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(b.w / 2 - 6, -b.h / 2 + 5, 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Ruler on the cliff top, plus the ghost of the previous try on this same cliff.
  function drawAssist() {
    const top = GROUND_Y;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // meter marks
    const ex = edgePx();
    for (let m = 1; m <= 5; m++) {
      const x = ex - m * PPM;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(x - 1, top, 2, 12);
      ctx.font = '800 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(m + 'm', x, top + 26);
    }
    // fine marks near the edge (readable when the camera zooms in)
    [[0.5, '50'], [0.2, '20'], [0.1, '10']].forEach(([m, label]) => {
      const x = ex - m * PPM;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(x - 0.5, top, 1, 6);
      if (cam.z > 1.6) {
        ctx.font = '800 5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(label, x, top + 11);
      }
    });
    // ghost of the previous try on this cliff
    if (lastTry && lastTry.key === s.layoutKey && s.state !== 'stopped' && !s.parts) {
      if (lastTry.release !== null) {
        const x = lastTry.release * PPM;
        ctx.strokeStyle = 'rgba(255,210,63,0.95)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(x, top - 68); ctx.lineTo(x, top); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '900 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#ffd23f';
        ctx.fillText('LAST RELEASE', x, top - 76);     // where you let go on your previous try (above LAST STOP)
      }
      if (lastTry.stop !== null) {
        const len = CAR_LEN * PPM, x = lastTry.stop * PPM - len;
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath(); ctx.roundRect(x, top - WHEEL_R * 2 - CAR_H - 2, len, CAR_H + WHEEL_R * 2 + 2, 10); ctx.fill();
        ctx.font = '900 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText('LAST STOP', x + len / 2, top - WHEEL_R * 2 - CAR_H - 12);
      }
    }
    ctx.restore();
  }

  function drawMuteIcon() {
    ctx.save();
    ctx.translate(MUTE_X, MUTE_Y);
    ctx.fillStyle = 'rgba(10,10,25,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-10, -4); ctx.lineTo(-5, -4); ctx.lineTo(1, -10); ctx.lineTo(1, 10); ctx.lineTo(-5, 4); ctx.lineTo(-10, 4);
    ctx.closePath(); ctx.fill();
    if (Sound.isMuted()) {
      ctx.beginPath(); ctx.moveTo(5, -5); ctx.lineTo(13, 5); ctx.moveTo(13, -5); ctx.lineTo(5, 5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(3, 0, 6, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(3, 0, 11, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParts() {
    for (const p of s.parts) {
      if (p.kind === 'wheel') { drawWheel(p.x, p.y, p.rot); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      drawBody(false, 'scream');
      ctx.restore();
    }
  }

  // Zones: the sky changes every 5 cliffs (at each checkpoint), then the cycle repeats.
  // Only colors and a few dots: no images, the ground and the text stay exactly as readable.
  const ZONES = [
    { name: 'SUNSET', sky: ['#2a1f5c', '#ff7a59', '#ffb36b'], sea: 'rgba(31,61,122,0.92)', page: ['#2a1f5c', '#ff7a59', '#ffb36b', '#1f3d7a', '#1a3468'] },
    { name: 'DUSK',   sky: ['#1d1442', '#a8467a', '#f08a6a'], sea: 'rgba(28,46,104,0.93)', page: ['#1d1442', '#a8467a', '#f08a6a', '#1c2e68', '#17285a'] },
    { name: 'NIGHT',  sky: ['#070a1f', '#1b2350', '#38407a'], sea: 'rgba(14,26,66,0.94)',  page: ['#070a1f', '#1b2350', '#38407a', '#0e1a42', '#0b1536'], stars: true },
    { name: 'DAWN',   sky: ['#3d5fa8', '#e39ab8', '#ffd2a1'], sea: 'rgba(36,74,138,0.92)', page: ['#3d5fa8', '#e39ab8', '#ffd2a1', '#244a8a', '#1f4078'] },
  ];
  // V3 worlds: each world has its own sky, backdrop and sea. Only shapes and colors (no images).
  const WORLD_LOOKS = [
    { name: 'GREEN HILLS', sky: ['#2a6fc4', '#6cb6ee', '#c4e8ff'], sea: 'rgba(30,96,168,0.92)', foam: 'rgba(255,255,255,0.35)', bg: 'hills',
      far: '#7fbf7a', near: '#4f9d58', page: ['#2a6fc4', '#6cb6ee', '#c4e8ff', '#1e60a8', '#1a5494'] },

  function drawBossBar(cx, cy, hp, hit) {

  // The boss itself, drawn in the sky behind the cliff. It wakes up phase by phase, shakes when hit

  function drawBoss() {

      ctx.fillStyle = B.body; puffs.forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, Math.PI * 2); ctx.fill(); });

  // layout: 5 world cards, 10 cliffs each; returns the cliff nodes for drawing and tapping

  const MAP_PLAY = { x: W / 2, y: 900, w: 300, h: 70 };

  }

  function draw() {
