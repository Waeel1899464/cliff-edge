    // The game link is drawn inside the video instead.
    const shareFile = () => navigator.share({ files: [file] });
    let why = 'no-share';
    if (navigator.share) {
      let ok = false;
      if (navigator.canShare) { try { ok = navigator.canShare({ files: [file] }); } catch (e) {} }
      else ok = true;   // older browsers: no canShare, just try
      why = ok ? '' : 'no-video-share';
      if (ok) {
        shareFile().catch(err => {
          // AbortError = the player closed the share menu.
          if (err && err.name === 'AbortError') return;
          if (err && err.name === 'NotAllowedError') { showToast('Tap SHARE CLIP again'); return; }
          if (inAppBrowser()) { clipSheet(); return; }
          saveFile(blob, file.name); explainSave('no-video-share');
        });
        return;
      }
    }
    // In-app browsers can't share or save videos: offer the way out to Chrome / Safari.
    if (inAppBrowser() && window.top === window) { clipSheet(); return; }
    // Other browsers: save the video file and say why sharing was not possible.
    saveFile(blob, file.name);
    explainSave(why);
  }

  // "All worlds completed!" card (web build only: the platform build has no external sharing)
  const CARD_BTN = { x: W / 2, y: 610, w: 240, h: 52 };
  let pendingCard = false;
  function cardVisible() { return !IS_PORTAL && s.allDone && s.state === 'stopped'; }
  function shareCard() {
    let total = 0; for (const k in stars) total += stars[k];
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#2a1f5c'); bg.addColorStop(0.65, '#ff7a59'); bg.addColorStop(1, '#ffb36b');
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
    const t = (str, y, size, col) => { g.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; g.textAlign = 'center'; g.lineWidth = size * 0.16; g.strokeStyle = 'rgba(10,10,25,0.85)'; g.strokeText(str, 540, y); g.fillStyle = col; g.fillText(str, 540, y); };
    t('CLIFF EDGE', 180, 110, '#ffd23f');
    t('ALL 5 WORLDS', 420, 96, '#ffffff');
    t('COMPLETED!', 530, 96, '#ffffff');
    t(`★ ${total} / 150 STARS`, 680, 64, '#ffd23f');
    t('Can you beat all 5 bosses?', 820, 44, '#fff3c4');
    t(GAME_URL.replace('https://', ''), 960, 36, '#ffffff');
    Track.send('share_card', total);
    c.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], 'cliff-edge-all-worlds.png', { type: 'image/png' });
      let ok = false;
      if (navigator.share && navigator.canShare) { try { ok = navigator.canShare({ files: [file] }); } catch (e) {} }
      if (ok) navigator.share({ files: [file], text: `I beat all 5 worlds of Cliff Edge! ${GAME_URL}` }).catch(() => {});
      else { saveFile(blob, file.name); showToast('Card saved'); }
    }, 'image/png');
  }
  function saveFile(blob, name) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
    } catch (e) {}
  }

  // Links opened inside TikTok, Instagram, Facebook, WhatsApp etc. run in a built-in browser that cannot share files.
  function inAppBrowser() {
    const ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|Bytedance|Snapchat|Line\/|WhatsApp|Telegram|; wv\)/i.test(ua);
  }

  function explainSave(why) {
    if (window.top !== window) showToast('Video saved\nSharing works on the public link');
    else if (inAppBrowser()) showToast('Video saved\nTo share, open this page in Chrome', 5000);
    else if (why === 'no-video-share') showToast('Video saved\nThis browser can\'t share videos. Try Chrome', 5000);
    else showToast('Video saved\nThis browser can\'t share. Try Chrome', 5000);
  }

  // ---------- Helpers ----------
  const edgeM = EDGE_X / PPM;
  const rand = (a, b) => a + Math.random() * (b - a);
  function frontX() { return s.x + CAR_LEN; }

  function puff(x, y, n, color, spread, up, size, life) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: rand(-spread, spread), vy: -rand(up * 0.4, up), life: rand(life * 0.6, life), t: 0, r: rand(size * 0.5, size), color, g: 500 });
    }
  }

  function spawnDust(n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: s.x * PPM + 8 + Math.random() * 6, y: GROUND_Y - 2,
        vx: -(20 + Math.random() * 40) + s.v * 6, vy: -(15 + Math.random() * 45),
        life: 0.45 + Math.random() * 0.3, t: 0, r: 2 + Math.random() * 3,
        color: s.surfNow.dust, g: 80, grow: true,
      });
    }
  }

  // Break the car into pieces that tumble down the cliff.
  // A missed cliff: lose a heart and retry it; with no hearts left, go back to the checkpoint.
  function missCliff() {
    s.missed = true;
    addFail(s.cliff);
    // The last heart is about to go: offer a rescue first (story mode only). Nothing changes until the
    // player chooses: "Save me!" keeps the heart; any other tap (or 3 seconds) goes back as usual.
    if (hearts <= 1 && rescueAllowed()) { s.rescue = { state: 'offer', t0: performance.now() }; s.heartsLeft = 0; return; }   // shown at once
    applyMiss();
  }
  function endRun() {
    s.runOver = true; s.missed = true; s.runScore = endless.score;
    Track.send('endless_run', endless.score);      // web build only
  }
  function applyMiss() {
    hearts--;
    if (hearts <= 0) { cliff = checkpoint; hearts = baseHearts(checkpoint); s.backTo = checkpoint; }
    s.heartsLeft = hearts;
    saveProgress();
  }

  function rememberTry(stopped) {
    lastTry = { key: s.layoutKey, release: s.releaseFront, stop: stopped ? frontX() : null };
  }

  // The first fall of a session plays in full; later ones are shorter (less slow motion, quicker
  // end), so retrying after many falls never feels slow. Tapping to retry works during the fall.
  let fallsThisSession = 0;
  const FALL_FULL = { slow: 0.45, end: 0.9 }, FALL_SHORT = { slow: 0.2, end: 0.45 };
  function startFall() {
    rememberTry(false);
    fallsThisSession++;
    s.fallTiming = fallsThisSession === 1 ? FALL_FULL : FALL_SHORT;
    if (s.endless) endRun(); else if (!s.friend && !s.daily) { if (s.replay) { s.missed = true; addFail(s.cliff); } else missCliff(); }
    s.state = 'falling';
    s.endAt = performance.now();
    s.fallT = 0;
    const len = CAR_LEN * PPM;
    const cx = s.x * PPM + len / 2;
    const bodyY = GROUND_Y - WHEEL_R - CAR_H / 2 - 2;
    const vx = Math.max(s.v, 1.4) * PPM;
    s.parts = [
      cx < edgePx() + 12
        // Slow: the body tips forward over the edge before it drops.
        ? { kind: 'body', x: cx, y: bodyY, vx, vy: 0, rot: s.tilt, vrot: 1.5, r: 12, tipping: true }
        : { kind: 'body', x: cx, y: bodyY, vx, vy: -60, rot: s.tilt, vrot: 3 + s.v * 0.5, r: 12 },
      { kind: 'wheel', x: cx - len / 2 + 11, y: GROUND_Y - WHEEL_R, vx: vx + rand(-80, 40), vy: -rand(180, 320), rot: 0, vrot: rand(-14, 14), r: WHEEL_R },
      { kind: 'wheel', x: cx + len / 2 - 11, y: GROUND_Y - WHEEL_R, vx: vx + rand(20, 140), vy: -rand(220, 380), rot: 0, vrot: rand(-14, 14), r: WHEEL_R },
    ];
    s.fallMsg = s.v < 1.5 ? 'SO CLOSE!' : ['NOOOO!', 'BYE BYE!', 'OOPS!', 'SPLASH!'][Math.floor(Math.random() * 4)];
    puff(edgePx(), GROUND_Y, 10, s.surface.dust, 90, 160, 4, 0.6);
    Sound.scream();
    Sound.pop();
  }

  // what the car lands in: water, Moon dust, or lava sparks
  function splashColors() {
    if (s.daily || s.friend) return ['#e8f6ff', '#5fa8ff'];
    return s.world === 4 ? ['#c9ccd8', '#8a8ea3'] : s.world === 5 ? ['#ffd23f', '#ff6a1a'] : ['#e8f6ff', '#5fa8ff'];
  }
  function updateFall(dt) {
    s.fallT += dt;
    const ex = edgePx();
    for (const p of s.parts) {
      if (p.tipping) {
        p.vx += 250 * dt; p.vrot += 10 * dt;
        p.x += p.vx * dt; p.rot += p.vrot * dt;
        p.y += p.vx * dt * Math.sin(Math.max(0, p.rot)) * 0.6;
        if (p.x > ex + p.r) { p.tipping = false; p.vy = p.vx * Math.sin(Math.max(0, p.rot)); }
        continue;
      }
      if (p.inWater) {
        p.vx *= Math.pow(0.2, dt);
        p.vy += (35 - p.vy) * Math.min(1, dt * 3);   // sink slowly
        p.vrot *= Math.pow(0.3, dt);
      } else {
        p.vy += G_PX * (s.spec.gs || 1) * dt;     // the Moon: a slow, floaty fall
      }
      const prevY = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;

      // Bounce off the cliff top (wheels that hop backwards)
      if (!p.inWater && p.kind === 'wheel' && p.x < ex && prevY + p.r <= GROUND_Y && p.y + p.r > GROUND_Y) {
        p.y = GROUND_Y - p.r; p.vy = -Math.abs(p.vy) * 0.45; p.vx *= 0.7;
      }
      // Bounce off the cliff wall
      if (!p.inWater && p.y + p.r > GROUND_Y && p.x - p.r < ex && prevY + p.r > GROUND_Y) {
        p.x = ex + p.r; p.vx = Math.abs(p.vx) * 0.5 + 30; p.vrot *= -0.7;
        puff(ex, p.y, 5, s.surface.dust, 60, 80, 3, 0.5);
      }
      // Hit the sea
      if (!p.inWater && p.y > WATER_Y) {
        p.inWater = true;
        p.vy *= 0.15;
        const big = p.kind === 'body';
        const sc = splashColors();
        puff(p.x, WATER_Y, big ? 26 : 8, sc[0], big ? 140 : 60, big ? 420 : 220, big ? 6 : 4, 0.9);
        puff(p.x, WATER_Y, big ? 14 : 4, sc[1], big ? 110 : 50, big ? 320 : 160, big ? 5 : 3, 0.8);
        if (big) { shake = 14; s.splashed = true; s.splashAt = s.fallT; Sound.splash(); }
      }
    }
    if (s.splashed && s.fallT - s.splashAt > s.fallTiming.end) s.state = 'fell';
    if (!s.rescue || s.rescue.state === 'offer') (s.rec = s.rec || []).push(s.parts.map(p => [p.x, p.y, p.rot]));
  }

  // ---------- Update ----------
  function update(rawDt, now) {
    if (now === undefined) now = performance.now();
    // Slow motion for the first moment of a fall: the dramatic part.
    let dt = rawDt;
    if (s.state === 'falling' && s.fallT < s.fallTiming.slow) dt = rawDt * 0.3;

    if (s.state === 'holding' || s.state === 'sliding') {
      // Over the edge? Place the car exactly where it crossed, at its speed then.
      const over = now >= s.crossAt;
      const m = motionAt(over ? s.crossAt : s.state === 'sliding' ? Math.min(now, s.stopAt) : now);
      // A release that arrives late (busy phone) is still applied at its real time; the drawn car
      // just never steps backwards while it catches up with the exact slide.
      s.x = s.state === 'sliding' ? Math.max(s.x, s.x0 + m.d) : s.x0 + m.d; s.v = m.v; s.a = m.a;
      s.surfNow = surfaceAt(travel());
      if (s.spec.crumble.length) {
        const n = fallenPieces();
        while ((s.fallen || 0) < n) {
          const E0 = Physics.edgeAt(s.spec, s.spec.crumble.slice().sort((a, b) => a.at - b.at)[s.fallen || 0].at - 1e-9);
          const len = s.spec.crumble.slice().sort((a, b) => a.at - b.at)[s.fallen || 0].len;
          const x1 = EDGE_X - (s.dist - E0) * PPM, w = len * PPM;
          (s.rocks = s.rocks || []).push({ x: x1 - w / 2, y: GROUND_Y + 30, w, h: 60, vx: 25, vy: -30, rot: 0, vr: 1.2 });
          puff(x1 - w / 2, GROUND_Y, 14, s.surface.dust, 80, 140, 4, 0.7);
          shake = Math.max(shake, 6); Sound.pop();
          s.fallen = (s.fallen || 0) + 1;
        }
      }
      if (s.state === 'sliding' && s.v > 0.4 && Math.random() < 0.9) spawnDust(Math.random() < s.v / 6 ? 2 : 1);
      if (over) {
        startFall();
      } else if (s.state === 'sliding' && now >= s.stopAt) {
        s.v = 0; s.a = 0;
        s.x = s.x0 + s.plan.stopX;                    // front exactly where the slide ends
        s.state = 'stopped';
        s.endAt = performance.now();
        s.result = s.gap * 100;                       // centimeters, decided at the release moment
        rememberTry(true);
        if (s.friend) { s.friendWin = s.friend.score === null || s.result < s.friend.score; if (s.friendWin) s.friend.won = true; }
        if (best === null || s.result < best) { best = s.result; save('cliff_best', best); s.newBest = true; }
        if (s.daily) {
          // The round belongs to the day it was made for; after midnight it no longer changes the new day.
          const d = loadJSON('cliff_daily') || getDaily();
          if (d.day === s.dailyDay && (d.best === null || s.result < d.best)) { d.best = s.result; s.newDailyBest = true; saveJSON('cliff_daily', d); }
        } else if (s.endless) {
          if (s.result < s.target) {
            s.cleared = true; s.grade = Physics.grade(s.result, s.target);
            s.coinsWon = coinReward(s.result, s.target, s.grade); coins += s.coinsWon; save('cliff_coins', coins);
            endless.i++; endless.score++;
            if (endless.score > endlessBest) { endlessBest = endless.score; save('cliff_endless_best', endlessBest); s.newEndlessBest = true; }
            puff(EDGE_X - 30, GROUND_Y - 40, 30, '#ffd23f', 160, 380, 5, 1.1);
          } else endRun();
        } else if (!s.friend) {
          if (s.result < s.target) {
            s.cleared = true;
            s.grade = Physics.grade(s.result, s.target);
            s.stars = STAR_OF[s.grade];
            if (s.stars > (stars[s.cliff] || 0)) { stars[s.cliff] = s.stars; s.newStars = true; saveJSON('cliff_stars', stars); }
            s.coinsWon = coinReward(s.result, s.target, s.grade);
            stuck = { n: 0, fails: 0 }; saveJSON('cliff_stuck', stuck);
            coins += s.coinsWon; save('cliff_coins', coins);
            if (!s.replay) {
              Track.send('cliff_pass', s.cliff);      // web build only: where players get through (and where they stop)
              if (s.spec.boss) s.worldDone = true;
              if (s.spec.boss && s.world === 5 && !storyDone()) { s.allDone = true; Track.send('all_worlds', roundsPlayed); }
              cliff++;
              if (s.stars === 3 && hearts < maxHearts(cliff)) { hearts++; s.heartWon = true; }   // golden heart: reward for skill
              if (isCheckpoint(cliff)) { checkpoint = cliff; hearts = Math.min(maxHearts(cliff), Math.max(hearts, baseHearts(cliff))); s.newCp = true; }
              if (inArena(cliff) && arenaPhase(cliff) === 1) s.bossStart = true;
              if (cliff > bestCliff) { bestCliff = cliff; s.newBestCliff = true; }
              saveProgress();
            }
            puff(EDGE_X - 30, GROUND_Y - 40, 30, '#ffd23f', 160, 380, 5, 1.1);
            puff(EDGE_X - 30, GROUND_Y - 40, 20, '#ff4f7b', 160, 380, 4, 1.1);
          } else if (s.replay) {
            s.missed = true;
            addFail(s.cliff);
          } else {
            missCliff();
          }
        }
        if (s.missed) Sound.fail();                     // stopped short of the target: a clear "no"
        else {
          if (s.cleared || s.friendWin || s.newDailyBest) Sound.fanfare();
          if (s.grade === 'GREAT') Sound.great();
          if (s.worldDone) { Sound.great(); puff(EDGE_X - 60, GROUND_Y - 60, 40, '#7ef9ff', 220, 480, 5, 1.4); puff(EDGE_X - 60, GROUND_Y - 60, 30, '#ffffff', 220, 480, 4, 1.4); }
          if (s.grade === 'PERFECT') { Sound.perfect(); puff(EDGE_X - 30, GROUND_Y - 40, 18, '#ffffff', 190, 430, 4, 1.3); }
          if (!s.cleared && !s.friendWin && !s.newDailyBest) { if (s.newBest || s.result < 10) Sound.ding(); else Sound.bloop(); }
        }
      }
    } else if ((s.state === 'falling' || s.state === 'fell') && !(s.rescue && s.rescue.state === 'anim')) {
      updateFall(dt);
    }
    // rescue: 3-second offer once the round has ended, then the chosen animation
    if (s.rescue) {
      const R = s.rescue;
      if (R.state === 'offer') {
        if (R.t0 !== null && now - R.t0 > 3000) declineRescue();
      } else if (R.state === 'anim' && R.kind === 'rewind' && !s.parts) {
        const k = Math.min(1, (now - R.t0) / (R.dur * 1000));
        s.x = R.stopX + (s.x0 - R.stopX) * (k * k * (3 - 2 * k));
      }
      if (R.state === 'anim' && now - R.t0 > R.dur * 1000) {
        R.state = 'done';
        newRound();                       // same cliff, the heart is kept
      }
    }

    // Body pitch spring
    const targetTilt = (s.state === 'holding' || s.state === 'sliding') ? -s.a * 0.012 : 0;
    s.tiltV += ((targetTilt - s.tilt) * 120 - s.tiltV * 9) * dt;
    s.tilt += s.tiltV * dt;

    // Character springs: googly pupil lags behind motion, antenna wobbles, body squashes.
    const moving = s.state === 'holding' || s.state === 'sliding';
    const ax = moving ? -s.a : 0;
    const eyeTX = moving ? Math.max(-6, Math.min(6, ax * 0.7 + 2)) : (s.state === 'stopped' ? 3 : 1.5);
    const eyeTY = s.state === 'stopped' && gapNow() < 1 ? 3 : 0;
    s.eyeV += ((eyeTX - s.eyeX) * 260 - s.eyeV * 11) * dt; s.eyeX += s.eyeV * dt;
    s.eyeYV += ((eyeTY - s.eyeY) * 260 - s.eyeYV * 11) * dt; s.eyeY += s.eyeYV * dt;
    if (s.parts) s.antV += rand(-60, 60) * dt * 10;
    s.antV += ((Math.max(-0.9, Math.min(0.9, ax * 0.07)) - s.ant) * 90 - s.antV * 3.5) * dt; s.ant += s.antV * dt;
    const sqT = moving ? Math.max(-0.12, Math.min(0.12, s.a * 0.012)) : 0;
    s.sqV += ((sqT - s.sq) * 160 - s.sqV * 8) * dt; s.sq += s.sqV * dt;

    // Pieces of the edge falling into the lava
    if (s.rocks) for (const r of s.rocks) { r.vy += G_PX * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; }
    // quake: the screen keeps shaking while you drive
    if (s.spec.quake && (s.state === 'holding' || s.state === 'sliding') && !s.daily) shake = Math.max(shake, 3 * s.spec.quake);
    // Particles
    for (const p of particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    }
    particles = particles.filter(p => p.t < p.life);
    shake *= Math.pow(0.02, rawDt);

    // Camera: zoom toward the edge when close; pull back to show the fall.
    // Long roads: zoom out just enough that the whole car stays on screen (V2 roads keep zoom 1).
    const rearPx = s.x * PPM;
    const zFar = rearPx < 12 ? Math.max(0.36, (CAM_ANCHOR_X - 12) / (CAM_ANCHOR_X - rearPx)) : 1;
    let zt = zFar, ft = CAM_ANCHOR_X, fyt = GROUND_Y;
    if (s.rescue && s.rescue.state === 'anim' && s.rescue.kind !== 'rewind') {
      zt = 1; ft = CAM_ANCHOR_X; fyt = GROUND_Y;          // the whole scene: cliff, sea and the rescue
    } else if (s.parts) {
      // Follow the falling body down to the splash, zoomed in.
      const b = s.parts[0];
      zt = 2;
      ft = CAM_ANCHOR_X + (b.x - CAM_ANCHOR_X);
      fyt = Math.min(b.y, WATER_Y - 40);
    } else if (s.state === 'sliding' || s.state === 'stopped') {
      const d = gapNow();
      const near = Math.max(0, Math.min(1, 1 - d / 3));
      zt = zFar + (3 - zFar) * near * near;
      const focus = (frontX() * PPM + EDGE_X) / 2;
      ft = CAM_ANCHOR_X + (focus - CAM_ANCHOR_X) * near;
    }
    const ease = 1 - Math.exp(-rawDt * (s.parts ? 6 : 5));
    cam.z += (zt - cam.z) * ease;
    cam.fx += (ft - cam.fx) * ease;
    cam.fy += (fyt - cam.fy) * ease;
  }

  // ---------- Draw ----------
  function fmt(cm) {
    if (cm < 100) return cm.toFixed(1) + ' cm';
    return (cm / 100).toFixed(2) + ' m';
  }
  function fmtTarget(cm) { return cm >= 100 ? (cm / 100) + ' m' : (cm >= 10 ? Math.round(cm) : cm.toFixed(1)) + ' cm'; }

  function text(str, x, y, size, color, weight = 800, align = 'center') {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = size * 0.18;
    ctx.strokeStyle = 'rgba(10,10,25,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawWheel(x, y, rot, r) {
    if (artReady('wheel')) {
      const R = r || (CAR_ART ? CAR_ART.r : WHEEL_R);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.drawImage(ART.wheel, -R, -R, R * 2, R * 2);
      ctx.restore();
      return;
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#1b1d2b';
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a8fa8';
    ctx.fillRect(-1.5, -WHEEL_R + 2, 3, WHEEL_R - 2);
    ctx.restore();
  }

  // Body centered on (0,0). mood: 'calm' | 'scared' | 'scream' | 'happy'
  // The character: a jelly-bean car with one big googly eye and a wobbly antenna.
  // mood: 'calm' | 'determined' | 'scared' | 'happy' | 'scream'
  function drawBody(braking, mood) {
    const len = CAR_LEN * PPM, h = CAR_H;
    const sq = s.sq || 0;
    ctx.save();
    ctx.scale(1 + sq, 1 - sq);

    const A = carArt();
    // antenna (springy) with a glowing ball
    ctx.save();
    ctx.translate(-8, A ? A.top + 1 : -h / 2 - 14);
    ctx.rotate(s.ant || 0);
    ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.stroke();
    ctx.fillStyle = skin.ball;
    ctx.beginPath(); ctx.arc(0, -18, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-1.5, -19.5, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (A) {
      ctx.drawImage(ART.car, A.x, A.top, A.w, A.h);
      if (braking) {                                   // brake light at the back of the picture
        ctx.fillStyle = '#ff1f3d'; ctx.shadowColor = '#ff1f3d'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.roundRect(A.x - 1, A.top + A.h * 0.52, 4, 6, 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // the same face, smaller, looking out of the side window
      ctx.save(); ctx.translate(A.face.x, A.face.y); ctx.scale(A.face.k, A.face.k); ctx.translate(-13, 0);
      drawFace(mood, '#f07ba3');
      ctx.restore();
      ctx.restore();
      return;
    }

    // roof dome
    ctx.fillStyle = skin.roof;
    ctx.beginPath(); ctx.roundRect(-len / 2 + 5, -h / 2 - 15, len * 0.52, 20, [10, 10, 2, 2]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.roundRect(-len / 2 + 9, -h / 2 - 12, 6, 9, 3); ctx.fill();

    // body: bean shape with a darker belly
    ctx.save();
    ctx.beginPath(); ctx.roundRect(-len / 2, -h / 2, len, h, 12);
    ctx.fillStyle = skin.body; ctx.fill();
    ctx.clip();
    ctx.fillStyle = skin.shade;
    ctx.fillRect(-len / 2, h / 2 - 7, len, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-len / 2 + 6, -h / 2 + 3, len * 0.35, 3);
    ctx.restore();

    // brake light
    ctx.fillStyle = braking ? '#ff1f3d' : '#7a2236';
    if (braking) { ctx.shadowColor = '#ff1f3d'; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.roundRect(-len / 2 - 2, -h / 2 + 5, 5, 8, 2); ctx.fill();
    ctx.shadowBlur = 0;

    drawFace(mood, skin.body);
    ctx.restore();
  }

  // The face (cheek, eye, eyebrow, mouth, sweat) around (13, 0). lid = body colour for the sad eyelid.
  function drawFace(mood, lid) {
    // cheek
    ctx.fillStyle = 'rgba(255,150,170,0.75)';
    ctx.beginPath(); ctx.ellipse(4, 6, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();

    // eye
    const ex = 13, ey = -4;
    const er = mood === 'scream' ? 12.5 : mood === 'scared' ? 11.5 : 10;
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b2d42';
    if (mood === 'happy') {
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey + 4, 6.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (mood === 'sad') {
      // looking down, heavy eyelid, and a tear
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#12141f'; ctx.beginPath(); ctx.arc(ex - 1, ey + 4, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lid; ctx.beginPath(); ctx.arc(ex, ey, er + 1, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ex - er, ey); ctx.lineTo(ex + er, ey); ctx.stroke();
      ctx.fillStyle = '#7fd4ff'; ctx.beginPath(); ctx.moveTo(ex + 6, ey + 9); ctx.quadraticCurveTo(ex + 10, ey + 15, ex + 6, ey + 17); ctx.quadraticCurveTo(ex + 2, ey + 15, ex + 6, ey + 9); ctx.fill();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      let px = s.eyeX || 0, py = s.eyeY || 0;
      if (mood === 'scream') { px = rand(-4, 4); py = rand(-4, 4); }
      const pr = mood === 'calm' || mood === 'determined' ? 4.8 : 3.2;
      const lim = er - pr - 1.5;
      const m = Math.hypot(px, py); if (m > lim) { px *= lim / m; py *= lim / m; }
      ctx.fillStyle = '#12141f';
      ctx.beginPath(); ctx.arc(ex + px, ey + py, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex + px - 1.4, ey + py - 1.6, 1.3, 0, Math.PI * 2); ctx.fill();
    }

    // eyebrow
    ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    if (mood === 'determined') { ctx.moveTo(5, -17); ctx.lineTo(20, -13); }
    else if (mood === 'scared' || mood === 'scream') { ctx.moveTo(5, -18); ctx.quadraticCurveTo(12, -24, 21, -19); }
    else if (mood === 'happy') { ctx.moveTo(6, -14); ctx.quadraticCurveTo(13, -19, 20, -14); }
    else if (mood === 'sad') { ctx.moveTo(6, -19); ctx.lineTo(20, -14); }
    else { ctx.moveTo(6, -16); ctx.lineTo(20, -16); }
    ctx.stroke();

    // mouth
    ctx.fillStyle = '#5a0f22'; ctx.strokeStyle = '#5a0f22'; ctx.lineWidth = 2.2;
    const mx = 17, my = 8;
    ctx.beginPath();
    if (mood === 'scream') { ctx.ellipse(mx, my + 1, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (mood === 'scared') { ctx.ellipse(mx, my, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (mood === 'happy') { ctx.arc(mx, my - 1, 5, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill(); }
    else if (mood === 'determined') { ctx.moveTo(mx - 4, my); ctx.lineTo(mx + 3, my - 1); ctx.stroke(); }
    else if (mood === 'sad') { ctx.arc(mx, my + 4, 4, Math.PI + 0.35, Math.PI * 2 - 0.35); ctx.stroke(); }
    else { ctx.arc(mx, my - 3, 4, 0.3, Math.PI - 0.3); ctx.stroke(); }

    // sweat drop when scared
    if (mood === 'scared') {
      ctx.fillStyle = '#7fd4ff';
      ctx.beginPath();
      ctx.moveTo(-1, -22); ctx.quadraticCurveTo(3, -16, -1, -14); ctx.quadraticCurveTo(-5, -16, -1, -22);
      ctx.fill();
    }
  }

  function carMood() {
    const d = gapNow();
    if (s.state === 'holding') return 'determined';
    if (s.state === 'stopped') return s.missed && !s.daily && !s.friend ? 'sad' : s.result < 10 ? 'happy' : d < 1 ? 'scared' : 'calm';
    if (s.state === 'sliding') return d < 1.2 ? 'scared' : 'determined';
    return 'calm';
  }

  function drawCar() {
    const len = CAR_LEN * PPM;
    const cx = s.x * PPM + len / 2;
    const braking = s.state === 'sliding' && s.v > 0;

    ctx.save();
    ctx.translate(cx, GROUND_Y - WHEEL_R);
    const A = carArt();
    if (A) for (const wx of A.wheels) drawWheel(wx, A.wy, s.x * PPM / A.r, A.r);
    else {
      drawWheel(-len / 2 + 11, 0, s.x * PPM / WHEEL_R, WHEEL_R);
      drawWheel(len / 2 - 11, 0, s.x * PPM / WHEEL_R, WHEEL_R);
    }
    ctx.rotate(s.tilt);
    if (s.state === 'stopped' && s.missed) {          // "no, no": a short head shake after a short stop
      const k = (performance.now() - s.endAt) / 700;
      if (k < 1) ctx.rotate(Math.sin(k * Math.PI * 6) * 0.07 * (1 - k));
    }
    ctx.translate(0, -CAR_H / 2 - 2);
    drawBody(braking, carMood());
    ctx.restore();
  }

  // Buttons pop in once when the round ends, then stay still.
  function drawButton(b, label, fill, ink, size, icon) {
    if (shareShownFor !== s.id) { shareShownFor = s.id; shareShownAt = performance.now(); }
    const k = Math.min(1, (performance.now() - shareShownAt) / 180);
    const pop = 0.85 + 0.15 * (1 - Math.pow(1 - k, 3)) + Math.sin(k * Math.PI) * 0.05;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(pop, pop);
    ctx.fillStyle = 'rgba(10,10,25,0.45)';
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2 + 5, b.w, b.h, b.h / 2); ctx.fill();
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
    ctx.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width;
    const ix = -tw / 2 - 8;
    ctx.fillStyle = ink;
    if (icon === 'play') {
      ctx.beginPath(); ctx.moveTo(ix - 16, -10); ctx.lineTo(ix - 16, 10); ctx.lineTo(ix, 0); ctx.closePath(); ctx.fill();
    } else if (icon === 'flag') {
      ctx.fillRect(ix - 16, -13, 3, 26);
      ctx.beginPath(); ctx.moveTo(ix - 13, -13); ctx.lineTo(ix + 3, -7); ctx.lineTo(ix - 13, -1); ctx.closePath(); ctx.fill();
    }
    ctx.fillText(label, 12, 1);
    ctx.restore();
  }
  function drawShareBtn() { drawButton(SHARE_BTN, 'SHARE CLIP', '#ffffff', '#12141f', 22, 'play'); }
  function drawChallengeBtn() { drawButton(CHALLENGE_BTN, 'CHALLENGE A FRIEND', '#ffd23f', '#12141f', 26, 'flag'); }

  // Hearts row; `lost` also shows the spent hearts as empty outlines.
  function drawHearts(cx, cy, n, lost) {
    const base = baseHearts(s.cliff), total = Math.min(base + 1, Math.max(base, n)), gap = 40, x0 = cx - (total - 1) * gap / 2;
    for (let i = 0; i < total; i++) {
      const full = i < n;
      ctx.save(); ctx.translate(x0 + i * gap, cy + 2); ctx.scale(1.6, 1.6);
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-12, -2, -8, -12, 0, -6);
      ctx.bezierCurveTo(8, -12, 12, -2, 0, 6);
      ctx.closePath();
      ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(10,10,25,0.75)'; ctx.stroke();
      ctx.fillStyle = full ? (i >= base ? '#ffd23f' : '#ff4f7b') : 'rgba(255,255,255,0.18)';
      ctx.fill();
      ctx.restore();
    }
  }

  // Bottom line on end screens.
  function endHint(runText, friendText) {
    if (s.friend) return friendText;
    if (s.daily) {
      const left = dailyLeft();
      return left > 0 ? `TAP TO TRY AGAIN · ${left} LEFT` : `NEXT DAILY IN ${nextDailyIn()}`;
    }
    return runText;
  }

  // "DAILY" pill on the home screen (top right, next to the sound button).
  const DAILY_PILL = { x: W - 150, y: 50, w: 132, h: 42 };
  function pillVisible() { return s.state === 'ready' && !s.friend; }
  function toggleDaily() {
    if (s.daily) { mode = 'run'; newRound(); return; }
    if (dailyLeft() > 0) { mode = 'daily'; newRound(); }
    else showToast('Daily done for today\nNext one in ' + nextDailyIn(), 3000);
  }
  function drawDailyPill() {
    const b = DAILY_PILL, streak = getStreak();
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = s.daily ? 'rgba(255,255,255,0.9)' : 'rgba(10,10,25,0.4)';
    ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
    ctx.font = '900 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s.daily ? '#12141f' : '#ffffff';
    const label = s.daily ? '✕ EXIT DAILY' : (streak > 0 ? `DAILY 🔥${streak}` : 'DAILY');
    ctx.fillText(label, 0, 1);
    // red dot: today's daily not played yet
    if (!s.daily && getDaily().tries === 0) {
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(b.w / 2 - 6, -b.h / 2 + 5, 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Ruler on the cliff top, plus the ghost of the previous try on this same cliff.
  function drawAssist() {
    const top = GROUND_Y;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // meter marks
    const ex = edgePx();
    for (let m = 1; m <= 5; m++) {
      const x = ex - m * PPM;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(x - 1, top, 2, 12);
      ctx.font = '800 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(m + 'm', x, top + 26);
    }
    // fine marks near the edge (readable when the camera zooms in)
    [[0.5, '50'], [0.2, '20'], [0.1, '10']].forEach(([m, label]) => {
      const x = ex - m * PPM;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(x - 0.5, top, 1, 6);
      if (cam.z > 1.6) {
        ctx.font = '800 5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(label, x, top + 11);
      }
    });
    // ghost of the previous try on this cliff
    if (lastTry && lastTry.key === s.layoutKey && s.state !== 'stopped' && !s.parts) {
      if (lastTry.release !== null) {
        const x = lastTry.release * PPM;
        ctx.strokeStyle = 'rgba(255,210,63,0.95)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(x, top - 68); ctx.lineTo(x, top); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '900 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#ffd23f';
        ctx.fillText('LAST RELEASE', x, top - 76);     // where you let go on your previous try (above LAST STOP)
      }
      if (lastTry.stop !== null) {
        const len = CAR_LEN * PPM, x = lastTry.stop * PPM - len;
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath(); ctx.roundRect(x, top - WHEEL_R * 2 - CAR_H - 2, len, CAR_H + WHEEL_R * 2 + 2, 10); ctx.fill();
        ctx.font = '900 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText('LAST STOP', x + len / 2, top - WHEEL_R * 2 - CAR_H - 12);
      }
    }
    ctx.restore();
  }

  function drawMuteIcon() {
    ctx.save();
    ctx.translate(MUTE_X, MUTE_Y);
    ctx.fillStyle = 'rgba(10,10,25,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-10, -4); ctx.lineTo(-5, -4); ctx.lineTo(1, -10); ctx.lineTo(1, 10); ctx.lineTo(-5, 4); ctx.lineTo(-10, 4);
    ctx.closePath(); ctx.fill();
    if (Sound.isMuted()) {
      ctx.beginPath(); ctx.moveTo(5, -5); ctx.lineTo(13, 5); ctx.moveTo(13, -5); ctx.lineTo(5, 5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(3, 0, 6, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(3, 0, 11, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParts() {
    for (const p of s.parts) {
      if (p.kind === 'wheel') { drawWheel(p.x, p.y, p.rot); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      drawBody(false, 'scream');
      ctx.restore();
    }
  }

  // Zones: the sky changes every 5 cliffs (at each checkpoint), then the cycle repeats.
  // Only colors and a few dots: no images, the ground and the text stay exactly as readable.
  const ZONES = [
    { name: 'SUNSET', sky: ['#2a1f5c', '#ff7a59', '#ffb36b'], sea: 'rgba(31,61,122,0.92)', page: ['#2a1f5c', '#ff7a59', '#ffb36b', '#1f3d7a', '#1a3468'] },
    { name: 'DUSK',   sky: ['#1d1442', '#a8467a', '#f08a6a'], sea: 'rgba(28,46,104,0.93)', page: ['#1d1442', '#a8467a', '#f08a6a', '#1c2e68', '#17285a'] },
    { name: 'NIGHT',  sky: ['#070a1f', '#1b2350', '#38407a'], sea: 'rgba(14,26,66,0.94)',  page: ['#070a1f', '#1b2350', '#38407a', '#0e1a42', '#0b1536'], stars: true },
    { name: 'DAWN',   sky: ['#3d5fa8', '#e39ab8', '#ffd2a1'], sea: 'rgba(36,74,138,0.92)', page: ['#3d5fa8', '#e39ab8', '#ffd2a1', '#244a8a', '#1f4078'] },
  ];
  // V3 worlds: each world has its own sky, backdrop and sea. Only shapes and colors (no images).
  const WORLD_LOOKS = [
    { name: 'GREEN HILLS', sky: ['#2a6fc4', '#6cb6ee', '#c4e8ff'], sea: 'rgba(30,96,168,0.92)', foam: 'rgba(255,255,255,0.35)', bg: 'hills',
      far: '#7fbf7a', near: '#4f9d58', page: ['#2a6fc4', '#6cb6ee', '#c4e8ff', '#1e60a8', '#1a5494'] },
    { name: 'DESERT', sky: ['#d9672e', '#f5a35a', '#ffd9a0'], sea: 'rgba(38,112,150,0.92)', foam: 'rgba(255,255,255,0.35)', bg: 'dunes',
      far: '#e9b46a', near: '#d39445', page: ['#d9672e', '#f5a35a', '#ffd9a0', '#267096', '#205f80'] },
    { name: 'SNOW MOUNTAIN', sky: ['#4f6fa8', '#93b2de', '#e2ecf8'], sea: 'rgba(36,74,124,0.93)', foam: 'rgba(255,255,255,0.45)', bg: 'peaks',
      far: '#9fb3d4', near: '#7d93ba', page: ['#4f6fa8', '#93b2de', '#e2ecf8', '#244a7c', '#1f406c'] },
    { name: 'MOON', sky: ['#03040a', '#0b0e22', '#1a1e3a'], sea: 'rgba(36,38,56,0.97)', foam: 'rgba(200,205,225,0.3)', bg: 'moon', stars: true,
      far: '#3a3d55', near: '#2a2c40', page: ['#03040a', '#0b0e22', '#1a1e3a', '#24263a', '#1c1e2e'] },
    { name: 'VOLCANO', sky: ['#1c0a10', '#5e1a1a', '#b9421e'], sea: 'rgba(255,96,24,0.95)', foam: 'rgba(255,220,90,0.8)', bg: 'volcano',
      far: '#3a1716', near: '#24100f', page: ['#1c0a10', '#5e1a1a', '#b9421e', '#ff6018', '#e04f12'] },
  ];
  // Story mode uses the world's look; the daily and friend cliffs keep the original sunset.
  const SNOW_NIGHT = { name: 'SNOW NIGHT', sky: ['#05081a', '#141c3c', '#2c3866'], sea: 'rgba(16,28,64,0.95)', foam: 'rgba(255,255,255,0.3)', bg: 'peaks', stars: true,
    far: '#2c3a5c', near: '#1f2a46', page: ['#05081a', '#141c3c', '#2c3866', '#101c40', '#0c1634'] };
  const SNOW_DUSK = { name: 'SNOW DUSK', sky: ['#2c3561', '#5d6a9c', '#a7b3d6'], sea: 'rgba(26,44,92,0.94)', foam: 'rgba(255,255,255,0.35)', bg: 'peaks',
    far: '#6f7fa6', near: '#56668d', page: ['#2c3561', '#5d6a9c', '#a7b3d6', '#1a2c5c', '#16264e'] };
  function zoneOf(st) {
    if (st.daily || st.friend) return ZONES[0];
    if (st.world === 3 && st.spec && st.spec.boss) return SNOW_NIGHT;      // the snow boss is at night
    if (st.world === 3 && inArena(st.cliff) && arenaPhase(st.cliff) >= 3) return SNOW_DUSK;   // the blizzard darkens the sky
    return WORLD_LOOKS[(st.world || 1) - 1];
  }
  // Far backdrop behind the cliff and the sea (screen space, does not move with the camera).
  function drawBackdrop(Z) {
    const base = WATER_Y;
    const ridge = (amp, f, ph, top, col) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, base);
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, top - amp * (0.5 + 0.5 * Math.sin(x * f + ph)) - amp * 0.4 * Math.sin(x * f * 2.3 + ph * 2));
      ctx.lineTo(W, base); ctx.closePath(); ctx.fill();
    };
    if (Z.bg === 'hills') { ridge(60, 0.012, 1, 700, Z.far); ridge(40, 0.019, 4, 750, Z.near); }
    else if (Z.bg === 'dunes') { ridge(45, 0.008, 2, 720, Z.far); ridge(30, 0.013, 5, 765, Z.near); }
    else if (Z.bg === 'peaks') {
      [[60, 690, 120], [210, 640, 150], [380, 670, 130], [500, 700, 110]].forEach(([x, top, w]) => {
        ctx.fillStyle = Z.far; ctx.beginPath(); ctx.moveTo(x - w, base); ctx.lineTo(x, top); ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f4f8ff'; ctx.beginPath(); ctx.moveTo(x - w * 0.28, top + (base - top) * 0.28); ctx.lineTo(x, top);
        ctx.lineTo(x + w * 0.28, top + (base - top) * 0.28); ctx.lineTo(x + w * 0.1, top + (base - top) * 0.22); ctx.lineTo(x - w * 0.08, top + (base - top) * 0.3); ctx.closePath(); ctx.fill();
      });
      ridge(25, 0.02, 3, 780, Z.near);
    } else if (Z.bg === 'volcano' && !(inArena(s.cliff) && s.world === 5 && !s.daily && !s.friend)) {
      ctx.fillStyle = Z.far; ctx.beginPath(); ctx.moveTo(200, base); ctx.lineTo(360, 500); ctx.lineTo(420, 500); ctx.lineTo(580, base); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,140,40,0.85)'; ctx.fillRect(362, 496, 56, 6);
      ctx.fillStyle = 'rgba(60,30,30,0.5)';
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(390 + i * 18, 460 - i * 34, 16 + i * 7, 0, Math.PI * 2); ctx.fill(); }

  const MAP_PLAY = { x: W / 2, y: 900, w: 300, h: 70 };

    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(sb.x - sb.w / 2, sb.y - sb.h / 2, sb.w, sb.h, sb.h / 2); ctx.fill();

    const nodes = mapNodes();

      ctx.beginPath(); ctx.arc(nd.x, nd.y, boss ? 19 : 16, 0, Math.PI * 2); ctx.fill();

  function draw() {
    if (screen === 'map') {

        text(s.newCp ? 'CHECKPOINT SAVED!' : 'CLIFF CLEARED!', W / 2, 150, 34, '#ffd23f', 900);
        text(s.newCp ? `Hearts refilled · next: ${cliffLabel(cliff)}` : `Next: ${cliffLabel(cliff)}`, W / 2, 196, 22, '#fff3c4', 800);
      }
    } else if (s.rescue && s.rescue.state === 'offer' && (s.state === 'stopped' || s.state === 'fell' || s.splashed)) {
      text('LAST HEART LOST!', W / 2, 150, 32, '#ff8fa8', 900);
      text(`Save it, or tap anywhere: back to ${cliffLabel(checkpoint)}`, W / 2, 196, 19, '#fff3c4', 800);
    } else if (s.missed && (s.state === 'stopped' || s.state === 'fell' || s.splashed)) {
      if (s.backTo) {
        text('NO HEARTS LEFT', W / 2, 150, 34, '#ff8fa8', 900);
        text(`Back to checkpoint · cliff ${s.backTo}`, W / 2, 196, 22, '#fff3c4', 800);
      } else {
        text(s.state === 'stopped' ? 'TOO SHORT!' : 'MISSED!', W / 2, 150, 38, '#ff5a6e', 900);
        drawHearts(W / 2, 198, s.heartsLeft, true);
      }
    } else {
      if (inArena(s.cliff) && !s.daily && !s.friend) {
        const B = BOSSES[s.world];
        text(B.name + (s.replay ? ' · REPLAY' : ''), W / 2, 104, 16, '#ff8a5c', 900);
        drawBossBar(W / 2, 126, 6 - arenaPhase(s.cliff), false);
        text(arenaPhase(s.cliff) === 5 ? 'FINAL HIT · PHASE 5/5' : `BOSS · PHASE ${arenaPhase(s.cliff)}/5`, W / 2, 154, 20, '#ff8a5c', 900);
      } else {
        text(Physics.WORLDS[s.world - 1].name + (s.replay ? ' · REPLAY' : ''), W / 2, 116, 16, 'rgba(255,255,255,0.85)', 800);
        if (s.spec.boss) text(`BOSS · ${cliffLabel(s.cliff).replace('CLIFF ', '')}`, W / 2, 150, 22, '#ff8a5c', 900);
        else text(cliffLabel(s.cliff), W / 2, 150, 20, '#ffd23f', 800);
      }
      text('UNDER ' + fmtTarget(s.target), W / 2, 194, 44, '#ffffff', 900);
      if (!s.replay) drawHearts(W / 2, 242, hearts, false);
      else text('NO HEARTS LOST IN A REPLAY', W / 2, 242, 15, 'rgba(255,255,255,0.75)', 800);
      const tl = [];
      if (s.spec.wind) {
        const w = s.spec.wind, k = Math.abs(w) <= 0.6 ? 1 : Math.abs(w) <= 1.0 ? 2 : 3;
        tl.push(w > 0 ? 'TAIL WIND ' + '›'.repeat(k) : '‹'.repeat(k) + ' HEAD WIND');
      }
      if (s.spec.gs < 1) tl.push('LOW GRAVITY');
      if (s.spec.crumble.length) tl.push('CRUMBLING EDGE');
      if (s.spec.quake) tl.push('EARTHQUAKE');
      // shown before you drive (while driving, the distance counter takes this place)
      if (s.state === 'ready') {
        const lines = tl.length > 2 ? [tl.slice(0, 2).join(' · '), tl.slice(2).join(' · ')] : tl;
        lines.forEach((l, i) => text(l, W / 2, 280 + i * 26, 20, '#ffffff', 900));
      }
    }

    if (s.state === 'ready') {
      // Teach the controls only in the first rounds; after that the screen stays clean.
      if (roundsPlayed < 3) {
        text(FINE_POINTER ? 'HOLD SPACE OR CLICK' : 'HOLD TO DRIVE', W / 2, 380, 40, '#ffffff');
        text('Let go to stop at the edge', W / 2, 426, 22, '#fff3c4', 600);
      }
    } else if (s.state === 'sliding' || (ASSIST && s.state === 'holding')) {
      text(fmt(Math.max(0, gapNow() * 100)), W / 2, 340, 52, 'rgba(255,255,255,0.9)');
    } else if (s.state === 'stopped' && !rescuing) {
      const shortStop = s.missed && !s.daily && !s.friend;     // stopped before reaching the target
      text(fmt(s.result), W / 2, 300, 76, shortStop ? '#ff5a6e' : '#ffffff');
      if (s.friend) text(s.friendWin ? 'YOU BEAT YOUR FRIEND!' : 'YOUR FRIEND WINS', W / 2, 358, 30, s.friendWin ? '#ffd23f' : '#fff3c4', 900);
      else if (s.daily) {
        // After midnight (UTC) the round still belongs to its own day, so today's best is not shown for it.
        const db = s.dailyDay === dayKey() ? getDaily().best : null;
        text(s.newDailyBest ? (s.dailyDay === dayKey() ? 'NEW BEST TODAY!' : 'NEW BEST!') : db !== null ? 'BEST TODAY ' + fmt(db) : 'from the edge', W / 2, 358, 28, s.newDailyBest ? '#ffd23f' : '#fff3c4', 800);
      }
      else if (s.grade) {
        // Stop quality on a cleared cliff: PERFECT < GREAT < target, so PERFECT is always also GREAT.
        const G = { PERFECT: ['PERFECT!', 36, '#ffd23f', 900], GREAT: ['GREAT!', 32, '#ffe27a', 900], GOOD: ['GOOD', 28, '#fff3c4', 800] }[s.grade];
        text(G[0], W / 2, 358, G[1], G[2], G[3]);
        if (s.newBest) text('NEW BEST STOP', W / 2, 238, 18, '#ffd23f', 800);
        // one row: the stars of this stop, then the coins won
        if (!s.endless) drawStarRow(W / 2 - 46, 400, s.stars, 15);
        if (s.coinsWon) { drawCoin(W / 2 + 50, 400, 11); text('+' + s.coinsWon, W / 2 + 66, 401, 24, '#ffe27a', 900, 'left'); }
      }
      else if (shortStop) text('NEEDED UNDER ' + fmtTarget(s.target), W / 2, 358, 26, '#ffd0d6', 900);
      else text(s.newBest ? 'NEW BEST STOP!' : 'from the edge', W / 2, 358, 28, s.newBest ? '#ffd23f' : '#fff3c4', 700);
      text(endHint(s.endless ? (s.cleared ? 'TAP FOR THE NEXT CLIFF' : 'TAP FOR A NEW RUN') : s.allDone ? 'TAP TO START ENDLESS' : s.cleared ? `TAP FOR ${cliffLabel(cliff)}` : `TAP TO RETRY ${cliffLabel(s.replay ? s.cliff : cliff)}`, 'TAP TO PLAY AGAIN'), W / 2, 900, 26, '#ffffff', 700);
    } else if (rescuing) {
      // the rescue animation speaks for itself
    } else if (s.state === 'falling' || s.state === 'fell') {
      text(s.fallMsg, W / 2, 340, 64, '#ffffff');
      if (s.friend) text(s.friend.score === null ? 'YOU BOTH FELL!' : 'YOUR FRIEND WINS', W / 2, 400, 28, '#fff3c4', 900);
      text(endHint(s.endless ? 'TAP FOR A NEW RUN' : `TAP TO RETRY ${cliffLabel(s.replay ? s.cliff : cliff)}`, 'TAP TO TRY AGAIN'), W / 2, 900, 26, '#ffffff', 700);
    }
    if (s.introAt) drawBossIntro();
    if (s.worldIntroAt) drawWorldIntro();
    if (rescueBtnVisible()) drawRescueBtn();
    if (helperVisible()) drawHelpers();
    if (doubleVisible()) {
      drawPillBtn(DOUBLE_BTN, 'DOUBLE COINS', '#ffd23f', '#12141f', 18);
      text(`${rewardLeft('double')} left today`, DOUBLE_BTN.x, DOUBLE_BTN.y + 36, 13, 'rgba(255,255,255,0.75)', 800);
      if (isNew('double')) drawNewBadge(DOUBLE_BTN.x + DOUBLE_BTN.w / 2 - 4, DOUBLE_BTN.y - DOUBLE_BTN.h / 2);
    }
    if (heartBtnVisible()) {
      drawPillBtn(HEART_BTN, '+1 ♥', '#ff4f7b', '#ffffff', 18);
      text('1 a day', HEART_BTN.x, HEART_BTN.y + 30, 12, 'rgba(255,255,255,0.75)', 800);
      if (isNew('heart')) drawNewBadge(HEART_BTN.x + HEART_BTN.w / 2 - 2, HEART_BTN.y - HEART_BTN.h / 2);
    }
    if (boxVisible()) {
      drawPillBtn(BOX_BTN, 'OPEN MYSTERY BOX', '#7ef9ff', '#12141f', 18);
      if (isNew('box')) drawNewBadge(BOX_BTN.x + BOX_BTN.w / 2 - 4, BOX_BTN.y - BOX_BTN.h / 2);
    }
    if (s.boxCoins) { drawCoin(W / 2 - 50, 452, 12); text('+' + s.boxCoins + ' FROM THE BOX', W / 2 - 32, 453, 20, '#7ef9ff', 900, 'left'); }
    if (s.heartWon) text('GOLDEN HEART! +1 ♥', W / 2, 512, 20, '#ffd23f', 900);
    if (s.allDone && s.state === 'stopped') {
      text('ENDLESS MODE UNLOCKED!', W / 2, 556, 24, '#7ef9ff', 900);
      if (Math.random() < 0.3) puff(EDGE_X - 120 + Math.random() * 200, GROUND_Y - 200 - Math.random() * 150, 3, ['#ffd23f', '#ff4f7b', '#7ef9ff'][Math.floor(Math.random() * 3)], 120, 200, 4, 1.0);
      if (cardVisible()) drawPillBtn(CARD_BTN, 'SHARE MY WIN', '#ffffff', '#12141f', 22);
    }
    if (s.rescue && s.rescue.state === 'anim') text({ rewind: 'REWIND!', balloon: 'BALLOON RESCUE!', seagull: 'SEAGULL RESCUE!', parachute: 'PARACHUTE!' }[s.rescue.kind], W / 2, 150, 36, '#7ef9ff', 900);
    if (inSlowMo()) text('SLOW MOTION', W / 2, 290, 22, '#7ef9ff', 900);
    if (shareVisible()) drawShareBtn();
    if (challengeVisible()) drawChallengeBtn();
    if (performance.now() < toast.until) {
      ctx.fillStyle = 'rgba(10,10,25,0.8)';
      const lines = toast.msg.split('\n');
      const th = 26 + lines.length * 28;
      ctx.beginPath(); ctx.roundRect(W / 2 - 255, 600 - th / 2, 510, th, 22); ctx.fill();
      lines.forEach((ln, i) => text(ln, W / 2, 600 - (lines.length - 1) * 14 + i * 28, i === 0 ? 22 : 18, i === 0 ? '#ffd23f' : '#ffffff', 700));
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt, now);
    Sound.update(s);
    Rec.tick(s);
    draw();
    Rec.copyFrame();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__cliff = () => s;   // used only for automated testing
  window.__art = () => ({ car: artReady('car'), wheel: artReady('wheel'), bg1: artReady('bg1'), carArt: !!carArt() });   // testing only
  window.__physics = Physics;   // used only for automated testing and tools/sim
  window.__shareVisible = () => shareVisible();
})();
</script>

</body>
</html>
