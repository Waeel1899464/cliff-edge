    ctx.font = '900 28px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#12141f';
    ctx.fillText(storyDone() ? 'PLAY ENDLESS' : 'PLAY ' + cliffLabel(cliff).replace('CLIFF ', ''), b.x, b.y + 1);
    if (storyDone()) text(`ENDLESS BEST ${endlessBest} · tap a cliff to replay it`, W / 2, 836, 16, '#7ef9ff', 800);
    else text('Tap a cliff you reached to replay it for stars', W / 2, 836, 16, 'rgba(255,255,255,0.7)', 700);
  }

  function draw() {
    if (screen === 'map') {
      if (ctx.reset) ctx.reset();
      ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
      drawMap();
      return;
    }
    // Start every frame from a clean canvas state, so nothing left over from a previous
    // frame (clip, transparency, transform) can hide the drawing.
    if (ctx.reset) ctx.reset();
    else { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; }
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    // sky (screen space), changes every 5 cliffs
    const Z = zoneOf(s);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, Z.sky[0]);
    g.addColorStop(0.6, Z.sky[1]);
    g.addColorStop(1, Z.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (Z.stars) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (const st of STARS) ctx.fillRect(st[0], st[1], st[2], st[2]);
      if (Z.bg !== 'moon') {   // no crescent in the sky when you are standing on the Moon
        ctx.fillStyle = '#fff6d8';
        ctx.beginPath(); ctx.arc(110, 150, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = Z.sky[0];
        ctx.beginPath(); ctx.arc(122, 142, 22, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (Z.bg) drawBackdrop(Z);
    if (inArena(s.cliff) && !s.daily && !s.friend) drawBoss();
    if (s.spec.wind && !s.daily && !s.friend) drawWind(s.spec.wind, s.spec.fog && s.world === 2);
    if (Z !== lastZone) { lastZone = Z; setPageSky(Z); }

    // world (camera space)
    ctx.save();
    ctx.translate(CAM_ANCHOR_X, GROUND_Y);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.fx, -cam.fy);

    const ePx = edgePx();
    ctx.fillStyle = s.surface.side;
    ctx.fillRect(-2000, GROUND_Y + 14, ePx + 2000, 3000);
    // A downhill road is drawn at its real angle, pivoting at the edge (physics uses the same slope).
    const ang = Math.atan(s.spec.slope || 0);
    if (ang) {
      const L = 2600, dx = -L * Math.cos(ang), dy = -L * Math.sin(ang);
      ctx.beginPath(); ctx.moveTo(EDGE_X, GROUND_Y + 13); ctx.lineTo(EDGE_X + dx, GROUND_Y + dy + 13); ctx.lineTo(EDGE_X + dx, GROUND_Y + 40); ctx.closePath(); ctx.fill();
    }
    ctx.save();
    ctx.translate(EDGE_X, GROUND_Y); ctx.rotate(ang); ctx.translate(-EDGE_X, GROUND_Y * -1);
    // the road top, one colour per piece of ground (ground can change along the road)
    for (const g of Physics.segments(s.spec)) {
      const x0 = g.x0 === 0 ? -2000 : EDGE_X - (s.dist - g.x0) * PPM, x1 = Math.min(ePx, EDGE_X - (s.dist - g.x1) * PPM);
      if (x1 <= x0) continue;
      ctx.fillStyle = SURFACES[g.si].top;
      ctx.fillRect(x0, GROUND_Y, x1 - x0, 14);
    }

    if (s.spec.crumble.length) drawCracks(ePx);
    // edge flag (points out over the drop), always on the current edge
    ctx.save(); ctx.translate(ePx - EDGE_X, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(EDGE_X - 3, GROUND_Y - 30, 3, 30);
    ctx.fillStyle = '#ff3355';
    ctx.beginPath();
    // the flag shows the wind: it points away from where the wind comes from
    const fd = (s.spec.wind || 0) < 0 ? -1 : 1;
    ctx.moveTo(EDGE_X - 3, GROUND_Y - 30);
    ctx.lineTo(EDGE_X - 3 + 22 * fd, GROUND_Y - 24);
    ctx.lineTo(EDGE_X - 3, GROUND_Y - 18);
    ctx.fill();
    ctx.restore();

    // Ground type, written on the cliff face instead of the top of the screen.
    ctx.font = '800 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    if (s.state === 'ready' || s.state === 'holding') ctx.fillText(s.surface.name, EDGE_X - 16, GROUND_Y + (ASSIST ? 62 : 40));

    // name each ground change on the cliff face, under where it starts
    for (const g of Physics.segments(s.spec).slice(1)) {
      const x0 = EDGE_X - (s.dist - g.x0) * PPM;
      ctx.fillStyle = SURFACES[g.si].top; ctx.fillRect(x0, GROUND_Y + 14, 2, 74);
      ctx.font = '900 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(SURFACES[g.si].name, x0 + 5, GROUND_Y + 82);
    }
    if (ASSIST && !s.daily && !s.friend && s.target && !s.parts) {
      // the target zone: stop with the car's nose inside the green strip to clear the cliff
      const zx1 = edgePx(), zx0 = zx1 - Math.min(s.target, 100) / 100 * PPM;
      ctx.fillStyle = 'rgba(80,230,120,0.55)'; ctx.fillRect(zx0, GROUND_Y - 1, zx1 - zx0, 15);
      ctx.fillStyle = '#5dff8a'; ctx.fillRect(zx0 - 1.5, GROUND_Y - 22, 3, 22);
      ctx.beginPath(); ctx.moveTo(zx0 + 1.5, GROUND_Y - 22); ctx.lineTo(zx0 + 11, GROUND_Y - 18); ctx.lineTo(zx0 + 1.5, GROUND_Y - 14); ctx.fill();
    }
    if (ASSIST) drawAssist();
    if (s.helper === 'ball' && !s.parts && (s.state === 'ready' || s.state === 'holding')) {
      const x = s.idealFront * PPM, glow = 0.6 + 0.4 * Math.sin(performance.now() / 150);
      ctx.strokeStyle = `rgba(180,140,255,${glow})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, GROUND_Y - 60); ctx.lineTo(x, GROUND_Y); ctx.stroke();
      ctx.font = '900 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#d9c4ff';
      ctx.fillText('LET GO HERE', x, GROUND_Y - 70);
    }
    if (s.helper === 'sandbag') {
      ctx.fillStyle = '#c7955a';
      for (let x = edgePx() - 1.6 * PPM + 4; x < edgePx() - 6; x += 12) { ctx.beginPath(); ctx.roundRect(x, GROUND_Y - 6, 10, 7, 3); ctx.fill(); }
    }
    if (!s.parts) drawCar();
    ctx.restore();
    if (s.spec.fog && s.world !== 2 && !s.parts) drawFog();
    if (s.parts) { if (s.rescue && s.rescue.state === 'anim') drawRescue(); else drawParts(); }
    if (s.rocks) for (const r of s.rocks) {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.fillStyle = s.surface.side; ctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h);
      ctx.fillStyle = s.surface.top; ctx.fillRect(-r.w / 2, -r.h / 2, r.w, 8);
      ctx.restore();
    }

    // sea drawn over the pieces so sinking parts look underwater
    ctx.fillStyle = Z.sea;
    ctx.fillRect(-2000, WATER_Y, 6000, 3000);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-2000, WATER_Y, 6000, 3);

    for (const p of particles) {
      ctx.globalAlpha = 0.8 * (1 - p.t / p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.grow ? p.r * (1 + p.t * 2) : p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (s.spec.fog && s.world === 2 && !s.daily && !s.friend) drawStormHaze();
    // HUD (screen space)
    text(storyDone() ? 'ALL WORLDS ✓' : 'BEST ' + cliffLabel(bestCliff).replace('CLIFF ', ''), 26, 50, 22, '#ffffff', 800, 'left');

    drawMuteIcon();
    if (pillVisible()) drawDailyPill();
    if (mapBtnVisible()) drawMapBtn();
    if (!s.daily && !s.friend) drawCoinCount(26, 84);

    // Game link on the end screens; every recorded clip ends on one, so clips carry it. Web build only.
    if (!IS_PORTAL && roundEnded()) {
    ctx.font = '700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(10,10,25,0.45)';
    ctx.beginPath(); ctx.roundRect(W / 2 - 168, 930, 336, 26, 13); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('▶ waeel1899464.github.io/cliff-edge', W / 2, 944);
    }

    // Top banner: friend challenge, daily challenge, or the endless run
    const rescuing = s.rescue && s.rescue.state === 'anim';
    if (rescuing) {
      // (only the rescue title, drawn below)
    } else if (s.endless) {
      if (s.runOver && roundEnded()) {
        text('RUN OVER', W / 2, 140, 36, '#ff8fa8', 900);
        text(`${s.runScore} ${s.runScore === 1 ? 'CLIFF' : 'CLIFFS'} IN A ROW`, W / 2, 186, 26, '#ffffff', 900);
        text(s.runScore >= endlessBest && s.runScore > 0 ? 'NEW BEST!' : `BEST ${endlessBest}`, W / 2, 222, 20, s.runScore >= endlessBest && s.runScore > 0 ? '#ffd23f' : '#fff3c4', 900);
      } else if (s.cleared) {
        text(`STREAK ${endless.score}!`, W / 2, 150, 36, '#ffd23f', 900);
        text(s.newEndlessBest ? 'NEW BEST!' : `Best ${endlessBest}`, W / 2, 196, 22, s.newEndlessBest ? '#ffd23f' : '#fff3c4', 800);
      } else {
        text('ENDLESS', W / 2, 116, 16, '#7ef9ff', 900);
        text(`CLIFF ${endless.i + 1} · BEST ${endlessBest}`, W / 2, 150, 20, '#ffd23f', 800);
        text('UNDER ' + fmtTarget(s.target), W / 2, 194, 44, '#ffffff', 900);
        text(endless.score ? `STREAK ${endless.score}` : 'One miss ends the run', W / 2, 242, 18, '#ffffff', 900);
        if (s.state === 'ready') {
          const tl = [];
          if (s.spec.wind) tl.push(s.spec.wind > 0 ? 'TAIL WIND ›' : '‹ HEAD WIND');
          if (s.spec.gs < 1) tl.push('LOW GRAVITY');
          if (s.spec.crumble.length) tl.push('CRUMBLING EDGE');
          if (s.spec.quake) tl.push('EARTHQUAKE');
          const lines = tl.length > 2 ? [tl.slice(0, 2).join(' · '), tl.slice(2).join(' · ')] : tl;
          lines.forEach((l, i) => text(l, W / 2, 280 + i * 26, 20, '#ffffff', 900));
        }
      }
    } else if (s.daily) {
      const d = getDaily(), left = DAILY_TRIES - d.tries, streak = getStreak();
      text('DAILY CHALLENGE', W / 2, 150, 20, '#ffd23f', 800);
      if (s.state === 'ready') {
        text(d.best !== null ? 'BEST TODAY ' + fmt(d.best) : 'ONE CLIFF FOR EVERYONE', W / 2, 194, d.best !== null ? 40 : 30, '#ffffff', 900);
        text(`${left} ${left === 1 ? 'TRY' : 'TRIES'} LEFT TODAY`, W / 2, 238, 18, '#fff3c4', 700);
      } else if (roundEnded()) {
        text(streak > 0 ? `🔥 ${streak} DAY STREAK` : `TRY ${s.dailyTry}/${DAILY_TRIES}`, W / 2, 194, 26, '#ffffff', 900);
      }
    } else if (s.friend) {
      text(`FRIEND'S CHALLENGE · TRY ${s.friendTry}/${FRIEND_TRIES}`, W / 2, 150, 20, '#ffd23f', 800);
      text(s.friend.score === null ? 'YOUR FRIEND FELL OFF' : 'BEAT ' + fmt(s.friend.score), W / 2, 192, 38, '#ffffff', 900);
      text('Same cliff, same speed', W / 2, 232, 20, '#fff3c4', 600);
    } else if (s.cleared) {
      if (s.replay) {
        text('CLIFF CLEARED!', W / 2, 150, 34, '#ffd23f', 900);
        text(`Replay done · back to ${cliffLabel(cliff)}`, W / 2, 196, 22, '#fff3c4', 800);
      } else if (s.worldDone && BOSSES[s.world]) {
        text(`${BOSSES[s.world].name} IS DOWN!`, W / 2, 150, 32, '#7ef9ff', 900);
        text(s.world >= 5 ? 'ALL 5 WORLDS COMPLETE!' : `World ${s.world} complete · next: ${Physics.WORLDS[s.world].name}`, W / 2, 196, 20, s.world >= 5 ? '#ffd23f' : '#fff3c4', 800);
      } else if (inArena(s.cliff) && !s.replay) {
        text('HIT!', W / 2, 140, 40, '#ffd23f', 900);
        drawBossBar(W / 2, 184, 5 - arenaPhase(s.cliff), true);
        text(`Next: phase ${arenaPhase(s.cliff) + 1}/5`, W / 2, 214, 18, '#fff3c4', 800);
      } else if (s.worldDone) {
        text(`WORLD ${s.world} COMPLETE!`, W / 2, 150, 36, '#7ef9ff', 900);
        text(`Next: ${Physics.WORLDS[Math.min(4, s.world)].name} · hearts refilled`, W / 2, 196, 22, '#fff3c4', 800);
      } else {
        text(s.newCp ? 'CHECKPOINT SAVED!' : 'CLIFF CLEARED!', W / 2, 150, 34, '#ffd23f', 900);
        text(s.newCp ? `Hearts refilled · next: ${cliffLabel(cliff)}` : `Next: ${cliffLabel(cliff)}`, W / 2, 196, 22, '#fff3c4', 800);
      }
    } else if (s.rescue && s.rescue.state === 'offer' && (s.state === 'stopped' || s.state === 'fell' || s.splashed)) {
      text('LAST HEART LOST!', W / 2, 150, 32, '#ff8fa8', 900);
      text(`Save it, or tap anywhere: back to ${cliffLabel(checkpoint)}`, W / 2, 196, 19, '#fff3c4', 800);
    } else if (s.missed && (s.state === 'stopped' || s.state === 'fell' || s.splashed)) {
      if (s.backTo) {
        text('NO HEARTS LEFT', W / 2, 150, 34, '#ff8fa8', 900);
        text(`Back to checkpoint · cliff ${s.backTo}`, W / 2, 196, 22, '#fff3c4', 800);
      } else {
        text(s.state === 'stopped' ? 'TOO SHORT!' : 'MISSED!', W / 2, 150, 38, '#ff5a6e', 900);
        drawHearts(W / 2, 198, s.heartsLeft, true);
      }
    } else {
      if (inArena(s.cliff) && !s.daily && !s.friend) {
        const B = BOSSES[s.world];
        text(B.name + (s.replay ? ' · REPLAY' : ''), W / 2, 104, 16, '#ff8a5c', 900);
        drawBossBar(W / 2, 126, 6 - arenaPhase(s.cliff), false);
        text(arenaPhase(s.cliff) === 5 ? 'FINAL HIT · PHASE 5/5' : `BOSS · PHASE ${arenaPhase(s.cliff)}/5`, W / 2, 154, 20, '#ff8a5c', 900);
      } else {
        text(Physics.WORLDS[s.world - 1].name + (s.replay ? ' · REPLAY' : ''), W / 2, 116, 16, 'rgba(255,255,255,0.85)', 800);
        if (s.spec.boss) text(`BOSS · ${cliffLabel(s.cliff).replace('CLIFF ', '')}`, W / 2, 150, 22, '#ff8a5c', 900);
        else text(cliffLabel(s.cliff), W / 2, 150, 20, '#ffd23f', 800);
      }
      text('UNDER ' + fmtTarget(s.target), W / 2, 194, 44, '#ffffff', 900);
      if (!s.replay) drawHearts(W / 2, 242, hearts, false);
      else text('NO HEARTS LOST IN A REPLAY', W / 2, 242, 15, 'rgba(255,255,255,0.75)', 800);
      const tl = [];
      if (s.spec.wind) {
        const w = s.spec.wind, k = Math.abs(w) <= 0.6 ? 1 : Math.abs(w) <= 1.0 ? 2 : 3;
        tl.push(w > 0 ? 'TAIL WIND ' + '›'.repeat(k) : '‹'.repeat(k) + ' HEAD WIND');
      }
      if (s.spec.gs < 1) tl.push('LOW GRAVITY');
      if (s.spec.crumble.length) tl.push('CRUMBLING EDGE');
      if (s.spec.quake) tl.push('EARTHQUAKE');
      // shown before you drive (while driving, the distance counter takes this place)
      if (s.state === 'ready') {
        const lines = tl.length > 2 ? [tl.slice(0, 2).join(' · '), tl.slice(2).join(' · ')] : tl;
        lines.forEach((l, i) => text(l, W / 2, 280 + i * 26, 20, '#ffffff', 900));
      }
    }

    if (s.state === 'ready') {
      // Teach the controls only in the first rounds; after that the screen stays clean.
      if (roundsPlayed < 3) {
        text(FINE_POINTER ? 'HOLD SPACE OR CLICK' : 'HOLD TO DRIVE', W / 2, 380, 40, '#ffffff');
        text('Let go to stop at the edge', W / 2, 426, 22, '#fff3c4', 600);
      }
    } else if (s.state === 'sliding' || (ASSIST && s.state === 'holding')) {
      text(fmt(Math.max(0, gapNow() * 100)), W / 2, 340, 52, 'rgba(255,255,255,0.9)');
    } else if (s.state === 'stopped' && !rescuing) {
      const shortStop = s.missed && !s.daily && !s.friend;     // stopped before reaching the target
      text(fmt(s.result), W / 2, 300, 76, shortStop ? '#ff5a6e' : '#ffffff');
      if (s.friend) text(s.friendWin ? 'YOU BEAT YOUR FRIEND!' : 'YOUR FRIEND WINS', W / 2, 358, 30, s.friendWin ? '#ffd23f' : '#fff3c4', 900);
      else if (s.daily) {
        // After midnight (UTC) the round still belongs to its own day, so today's best is not shown for it.
        const db = s.dailyDay === dayKey() ? getDaily().best : null;
        text(s.newDailyBest ? (s.dailyDay === dayKey() ? 'NEW BEST TODAY!' : 'NEW BEST!') : db !== null ? 'BEST TODAY ' + fmt(db) : 'from the edge', W / 2, 358, 28, s.newDailyBest ? '#ffd23f' : '#fff3c4', 800);
      }
      else if (s.grade) {
        // Stop quality on a cleared cliff: PERFECT < GREAT < target, so PERFECT is always also GREAT.
        const G = { PERFECT: ['PERFECT!', 36, '#ffd23f', 900], GREAT: ['GREAT!', 32, '#ffe27a', 900], GOOD: ['GOOD', 28, '#fff3c4', 800] }[s.grade];
        text(G[0], W / 2, 358, G[1], G[2], G[3]);
        if (s.newBest) text('NEW BEST STOP', W / 2, 238, 18, '#ffd23f', 800);
        // one row: the stars of this stop, then the coins won
        if (!s.endless) drawStarRow(W / 2 - 46, 400, s.stars, 15);
        if (s.coinsWon) { drawCoin(W / 2 + 50, 400, 11); text('+' + s.coinsWon, W / 2 + 66, 401, 24, '#ffe27a', 900, 'left'); }
      }
      else if (shortStop) text('NEEDED UNDER ' + fmtTarget(s.target), W / 2, 358, 26, '#ffd0d6', 900);
      else text(s.newBest ? 'NEW BEST STOP!' : 'from the edge', W / 2, 358, 28, s.newBest ? '#ffd23f' : '#fff3c4', 700);
      text(endHint(s.endless ? (s.cleared ? 'TAP FOR THE NEXT CLIFF' : 'TAP FOR A NEW RUN') : s.allDone ? 'TAP TO START ENDLESS' : s.cleared ? `TAP FOR ${cliffLabel(cliff)}` : `TAP TO RETRY ${cliffLabel(s.replay ? s.cliff : cliff)}`, 'TAP TO PLAY AGAIN'), W / 2, 900, 26, '#ffffff', 700);
    } else if (rescuing) {
      // the rescue animation speaks for itself
    } else if (s.state === 'falling' || s.state === 'fell') {
      text(s.fallMsg, W / 2, 340, 64, '#ffffff');
      if (s.friend) text(s.friend.score === null ? 'YOU BOTH FELL!' : 'YOUR FRIEND WINS', W / 2, 400, 28, '#fff3c4', 900);
      text(endHint(s.endless ? 'TAP FOR A NEW RUN' : `TAP TO RETRY ${cliffLabel(s.replay ? s.cliff : cliff)}`, 'TAP TO TRY AGAIN'), W / 2, 900, 26, '#ffffff', 700);
    }
    if (s.introAt) drawBossIntro();
    if (rescueBtnVisible()) drawRescueBtn();
    if (helperVisible()) drawHelpers();
    if (doubleVisible()) {
      drawPillBtn(DOUBLE_BTN, 'DOUBLE COINS', '#ffd23f', '#12141f', 18);
      text(`${rewardLeft('double')} left today`, DOUBLE_BTN.x, DOUBLE_BTN.y + 36, 13, 'rgba(255,255,255,0.75)', 800);
      if (isNew('double')) drawNewBadge(DOUBLE_BTN.x + DOUBLE_BTN.w / 2 - 4, DOUBLE_BTN.y - DOUBLE_BTN.h / 2);
    }
    if (heartBtnVisible()) {
      drawPillBtn(HEART_BTN, '+1 ♥', '#ff4f7b', '#ffffff', 18);
      text('1 a day', HEART_BTN.x, HEART_BTN.y + 30, 12, 'rgba(255,255,255,0.75)', 800);
      if (isNew('heart')) drawNewBadge(HEART_BTN.x + HEART_BTN.w / 2 - 2, HEART_BTN.y - HEART_BTN.h / 2);
    }
    if (boxVisible()) {
      drawPillBtn(BOX_BTN, 'OPEN MYSTERY BOX', '#7ef9ff', '#12141f', 18);
      if (isNew('box')) drawNewBadge(BOX_BTN.x + BOX_BTN.w / 2 - 4, BOX_BTN.y - BOX_BTN.h / 2);
    }
    if (s.boxCoins) { drawCoin(W / 2 - 50, 452, 12); text('+' + s.boxCoins + ' FROM THE BOX', W / 2 - 32, 453, 20, '#7ef9ff', 900, 'left'); }
    if (s.heartWon) text('GOLDEN HEART! +1 ♥', W / 2, 512, 20, '#ffd23f', 900);
    if (s.allDone && s.state === 'stopped') {
      text('ENDLESS MODE UNLOCKED!', W / 2, 556, 24, '#7ef9ff', 900);
      if (Math.random() < 0.3) puff(EDGE_X - 120 + Math.random() * 200, GROUND_Y - 200 - Math.random() * 150, 3, ['#ffd23f', '#ff4f7b', '#7ef9ff'][Math.floor(Math.random() * 3)], 120, 200, 4, 1.0);
      if (cardVisible()) drawPillBtn(CARD_BTN, 'SHARE MY WIN', '#ffffff', '#12141f', 22);
    }
    if (s.rescue && s.rescue.state === 'anim') text({ rewind: 'REWIND!', balloon: 'BALLOON RESCUE!', seagull: 'SEAGULL RESCUE!', parachute: 'PARACHUTE!' }[s.rescue.kind], W / 2, 150, 36, '#7ef9ff', 900);
    if (inSlowMo()) text('SLOW MOTION', W / 2, 290, 22, '#7ef9ff', 900);
    if (shareVisible()) drawShareBtn();
    if (challengeVisible()) drawChallengeBtn();
    if (performance.now() < toast.until) {
      ctx.fillStyle = 'rgba(10,10,25,0.8)';
      const lines = toast.msg.split('\n');
      const th = 26 + lines.length * 28;
      ctx.beginPath(); ctx.roundRect(W / 2 - 255, 600 - th / 2, 510, th, 22); ctx.fill();
      lines.forEach((ln, i) => text(ln, W / 2, 600 - (lines.length - 1) * 14 + i * 28, i === 0 ? 22 : 18, i === 0 ? '#ffd23f' : '#ffffff', 700));
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt, now);
    Sound.update(s);
    Rec.tick(s);
    draw();
    Rec.copyFrame();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__cliff = () => s;   // used only for automated testing
  window.__physics = Physics;   // used only for automated testing and tools/sim
  window.__shareVisible = () => shareVisible();
})();
</script>
